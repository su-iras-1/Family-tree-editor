/* 按住空格时临时切换为平移（像多数绘图软件一样） */
let spaceDown = false;
window.addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat) spaceDown = true; });
window.addEventListener('keyup', e => { if (e.code === 'Space') spaceDown = false; });
window.addEventListener('blur', () => { spaceDown = false; });

/* ---------- 方向键平移画布 ----------
   按住方向键连续平移（速度按屏幕像素算，所以放大缩小时手感一致）；
   按住 Shift 加速；对角线可以同时按两个方向键。 */
const ARROW_PAN = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
const PAN_SPEED = 600;                 // 连续平移速度：屏幕像素 / 秒（按住 Shift 再快 2.2 倍）
const PAN_TAP = 30;                    // 轻点一下走多远（屏幕像素）：按下即抬起也要看得见反应
let panHeld = { left: 0, right: 0, up: 0, down: 0 };
let panFast = false, panRaf = 0, panLast = 0;

function panActive() { return panHeld.left || panHeld.right || panHeld.up || panHeld.down; }
function panStop() {
  panHeld = { left: 0, right: 0, up: 0, down: 0 };
  panFast = false; panLast = 0;
  if (panRaf) { cancelAnimationFrame(panRaf); panRaf = 0; }
}
function panTick(now) {
  panRaf = 0;
  if (!panActive()) { panLast = 0; return; }
  if (!panLast) panLast = now;
  const dt = Math.min(now - panLast, 64) / 1000;   // 掉帧时最多按 64ms 计，免得跳一大截
  panLast = now;
  const step = PAN_SPEED * (panFast ? 2.2 : 1) * dt / (view.zoom || 1);
  let dx = 0, dy = 0;
  if (panHeld.left) dx += step;
  if (panHeld.right) dx -= step;
  if (panHeld.up) dy += step;
  if (panHeld.down) dy -= step;
  view.x += dx; view.y += dy;
  requestRender(true);
  panRaf = requestAnimationFrame(panTick);
}
/** 方向键按下：接管并启动平移；正在输入或弹层打开时不管 */
function panKeyDown(e) {
  const dir = ARROW_PAN[e.key];
  if (!dir) return false;
  if ($('#modalMask') && $('#modalMask').classList.contains('open')) return false;
  e.preventDefault();
  const wasIdle = !panActive();
  panHeld[dir] = 1; panFast = e.shiftKey;
  // 轻点一下（按下即抬起，中间可能一帧都没到）也要走一小步，否则会像没反应
  if (!e.repeat && wasIdle) {
    const s0 = PAN_TAP / (view.zoom || 1);
    if (dir === 'left') view.x += s0;
    else if (dir === 'right') view.x -= s0;
    else if (dir === 'up') view.y += s0;
    else view.y -= s0;
    panLast = 0;                       // 重新计时，避免这一步被算进下一帧
    requestRender(true);
  }
  if (!panRaf) panRaf = requestAnimationFrame(panTick);
  return true;
}
function panKeyUp(e) {
  const dir = ARROW_PAN[e.key];
  if (dir) { panHeld[dir] = 0; panFast = e.shiftKey; if (!panActive()) panStop(); return; }
  if (e.key === 'Shift') panFast = false;
}

function bindCanvas() {
  const svg = $('#svg');

  svg.addEventListener('pointerdown', e => {
    const nodeEl = e.target.closest ? e.target.closest('.fam-node') : null;
    const bubEl = e.target.closest ? e.target.closest('.bubble') : null;

    if (bubEl) {
      if (guard()) return;
      e.preventDefault(); e.stopPropagation();
      const id = bubEl.dataset.id, act = bubEl.dataset.bubble;
      ({ addPartner: actAddPartner, addParents: actAddParents, addChild: actAddChild, addSibling: actAddSibling }[act] || (() => { }))(id);
      return;
    }

    /* 关系线的中点标签：点一下跳到「改这条线」，免得为改一个类型还要去右侧面板里翻 */
    const chipEl = e.target.closest ? e.target.closest('.kin-chip') : null;
    if (chipEl) {
      if (guard()) return;
      e.preventDefault(); e.stopPropagation();
      const k = (state.kins || []).find(x => x.id === chipEl.dataset.kin);
      if (k) editKin(k.id);
      return;
    }

    /* 平移画布：抓手工具 / 空格 / Alt / 鼠标中键，四个入口都行 */
    const wantsPan = ui.tool === 'hand' || spaceDown || e.altKey || e.button === 1;
    if (wantsPan) {
      e.preventDefault();
      ui.bondFrom = null; ui.kinFrom = null; hideMarquee();
      // 平移时按到的若是人物，记下他：没有拖动就只是「点了一下」，照样选中
      drag = { pan: true, sx: e.clientX, sy: e.clientY, bx: view.x, by: view.y,
               pick: nodeEl ? nodeEl.dataset.id : null, moved: false };
      svg.classList.add('panning');
      try { svg.setPointerCapture(e.pointerId); } catch (err) { }
      return;
    }

    if (nodeEl) {
      const id = nodeEl.dataset.id;
      if (ui.tool === 'kin') {
        if (guard()) return;
        e.preventDefault();
        if (!ui.kinFrom) { ui.kinFrom = id; select(id); toast('再点另一位成员，建立血缘关系线'); }
        else if (ui.kinFrom !== id) {
          const a = ui.kinFrom; ui.kinFrom = null;
          chooseKinType(a, id);
        } else ui.kinFrom = null;
        return;
      }
      if (ui.tool === 'bond') {
        if (guard()) return;
        e.preventDefault();
        if (!ui.bondFrom) { ui.bondFrom = id; select(id); toast('再点另一位成员，建立情感线'); }
        else if (ui.bondFrom !== id) {
          const a = ui.bondFrom; ui.bondFrom = null;
          chooseBondType((type) => {
            state.bonds = state.bonds.filter(b => !((b.a === a && b.b === id) || (b.a === id && b.b === a)));
            state.bonds.push({ id: uid('b'), a, b: id, type });
            ui.tool = 'select'; syncToolButtons(); commit();
            toast('已添加情感线：' + (BOND_TYPE[type] || {}).label);
          });
        } else ui.bondFrom = null;
        return;
      }
      // Shift + 点击：把这个人在选中集合里加入 / 移除
      if (e.shiftKey) {
        e.preventDefault();
        const cur = (ui.selSet || []).slice();
        const i = cur.indexOf(id);
        if (i >= 0) cur.splice(i, 1); else cur.push(id);
        setSelection(cur, id);
        render();
        return;
      }
      // 按到人物即自动选中：不在选中集合里就立刻改选他；已经落在一个多选集合里则整批保持，
      // 这样拖下去就是整体移动，而原地松手（没拖动）再收拢为只选他。
      // 仅查看状态下点选照旧可用，只是不拖动、不改数据。
      if (locked()) { setSelection([id], id); render(); return; }
      const wasMulti = isSelected(id) && (ui.selSet || []).length > 1;
      if (!isSelected(id)) { setSelection([id], id); render(); }
      const ids = wasMulti ? ui.selSet.slice() : [id];
      const baseMap = {};
      ids.forEach(i => { baseMap[i] = (person(i).off || [0, 0]).slice(); });
      drag = { ids, id, wasMulti, moved: false, sx: e.clientX, sy: e.clientY, baseMap };
      try { svg.setPointerCapture(e.pointerId); } catch (err) { }
      return;
    }

    // 空白处
    if (ui.tool === 'add') {
      if (guard()) return;
      const w = toWorld(e.clientX, e.clientY);
      const p = addPerson({ gender: GENDER_F });
      ui.layout = computeLayout();
      const q = ui.layout.pos[p.id];
      p.off = [w.x - q.x, w.y - q.y];
      commit();
      select(p.id);
      toast('已添加成员，继续点击可继续添加');
      return;
    }
    // 空白处拖动 = 框选（「框选」工具下）；Shift 保持原有选中，做追加
    e.preventDefault();
    drag = { box: true, sx: e.clientX, sy: e.clientY, additive: e.shiftKey, base: e.shiftKey ? (ui.selSet || []).slice() : [] };
    try { svg.setPointerCapture(e.pointerId); } catch (err) { }
    showMarquee(e.clientX, e.clientY, e.clientX, e.clientY);
  });

  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    if (drag.pan) {
      view.x = drag.bx + (e.clientX - drag.sx);
      view.y = drag.by + (e.clientY - drag.sy);
      if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 3) drag.moved = true;
      requestRender();
      return;
    }
    if (drag.box) {
      showMarquee(drag.sx, drag.sy, e.clientX, e.clientY);
      return;
    }
    const dx = (e.clientX - drag.sx) / view.zoom, dy = (e.clientY - drag.sy) / view.zoom;
    if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 3) drag.moved = true;
    if (!drag.moved) return;
    drag.ids.forEach(i => {
      const p = person(i); if (!p) return;
      const b = drag.baseMap[i] || [0, 0];
      p.off = [b[0] + dx, b[1] + dy];
    });
    requestRender(true);
  });

  svg.addEventListener('pointerup', e => {
    if (!drag) return;
    const d = drag; drag = null;
    try { svg.releasePointerCapture(e.pointerId); } catch (err) { }
    svg.classList.remove('panning');
    if (d.pan) {
      // 平移工具下轻点人物（没有真的拖动）也当作选中，符合「点到谁就选谁」
      if (!d.moved && d.pick && person(d.pick)) { setSelection([d.pick], d.pick); render(); }
      return;
    }

    if (d.box) {
      hideMarquee();
      const hit = peopleInMarquee(d.sx, d.sy, e.clientX, e.clientY);
      const ids = d.additive ? d.base.concat(hit.filter(id => d.base.indexOf(id) < 0)) : hit;
      setSelection(ids, ids.length ? ids[ids.length - 1] : null);
      render();
      if (!ids.length) toast('未选中任何成员');
      else if (ids.length > 1) toast('已选中 ' + ids.length + ' 位成员 · 拖动其中一位可整体移动，Delete 可一起删除', 2600);
      return;
    }

    if (d.moved) { ui.layout = computeLayout(); render(); saveDraft(); }
    else if (d.wasMulti) { select(d.id); }        // 多选状态下单击某一位：收拢为只选他
    else if (d.id) { select(d.id); }
  });

  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    const factor = Math.pow(0.9988, e.deltaY);
    zoomAt(e.clientX - r.left, e.clientY - r.top, factor);
  }, { passive: false });

  svg.addEventListener('dblclick', e => {
    const nodeEl = e.target.closest ? e.target.closest('.fam-node') : null;
    if (!nodeEl) { closeInline(); return; }
    const id = nodeEl.dataset.id;
    const t = e.target.closest ? e.target.closest('[data-inline]') : null;
    e.preventDefault();
    if (guard()) return;
    // 双击称呼文字改称呼，双击姓名文字改姓名；双击符号本身，有称呼就改称呼，否则改姓名
    if (!isSelected(id)) { setSelection([id], id); render(); }
    inlineEdit(id, t ? t.dataset.inline : (currentTerm(person(id)) ? 'term' : 'name'), t);
  });
}

/* ==========================================================================
   画布内就地编辑：双击节点上的文字直接改
   ========================================================================== */
function closeInline() {
  const el = document.getElementById('inlineEdit');
  if (el) el.remove();
  if (ui._inline) ui._inline = null;
}
function inlineEdit(pid, field, anchorEl) {
  const p = person(pid);
  const q = ui.layout && ui.layout.pos ? ui.layout.pos[pid] : null;
  if (!p || !q) return;
  closeInline();
  select(pid);

  const isTerm = field === 'term';
  const svgR = $('#svg').getBoundingClientRect();
  const wrapR = $('#canvasWrap').getBoundingClientRect();
  const fs = Math.max(11, (isTerm ? 12.5 : 14) * view.zoom);

  // 优先按被双击的那个文字元素定位——SVG 里 text 的 y 是基线，直接拿坐标会偏下几个像素
  let cx, cy;
  const ar = anchorEl && anchorEl.getBoundingClientRect ? anchorEl.getBoundingClientRect() : null;
  if (ar && ar.width) {
    cx = ar.left + ar.width / 2 - wrapR.left;
    cy = ar.top + ar.height / 2 - wrapR.top;
  } else {
    cx = (svgR.left - wrapR.left) + view.x + q.x * view.zoom;
    cy = (svgR.top - wrapR.top) + view.y + (q.y + (isTerm ? -SYM - 12 : SYM + 20) - (isTerm ? 5 : 5.5)) * view.zoom;
  }

  const box = document.createElement('div');
  box.id = 'inlineEdit';
  box.className = 'inline-edit' + (isTerm ? ' is-term' : '');
  box.style.left = cx + 'px';
  box.style.top = cy + 'px';
  box.style.fontSize = fs.toFixed(1) + 'px';
  box.innerHTML = `<input type="text" spellcheck="false" value="${esc(isTerm ? currentTerm(p) : p.name)}"
      placeholder="${isTerm ? '如：大伯（老派：大大）' : '姓名'}">
    <div class="inline-hint">${isTerm ? '回车保存 · Esc 取消 · 清空即恢复自动推算' : '回车保存 · Esc 取消'}</div>`;
  $('#canvasWrap').appendChild(box);

  const inp = box.querySelector('input');
  inp.style.width = Math.max(112, Math.round(fs * (isTerm ? 9 : 8))) + 'px';
  ui._inline = { pid, field };

  let done = false;
  const finish = keep => {
    if (done) return;
    done = true;
    ui._inline = null;
    if (!keep) { box.remove(); return; }
    const v = inp.value.trim();
    if (isTerm) p.term = v; else p.name = v;
    box.remove();
    saveDraft();          // 记一步撤销
    render();
  };
  inp.addEventListener('keydown', ev => {
    ev.stopPropagation();  // 别让 Del / Ctrl+Z 这些快捷键抢走键盘
    if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
    else if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
  });
  inp.addEventListener('blur', () => finish(true));
  setTimeout(() => { inp.focus(); inp.select(); }, 0);
}
let rafPending = false;
function requestRender(noLayout) {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    if (!noLayout) ui.layout = computeLayout();
    render();
  });
}

/** 弹层里那条示意小线 */
function kinSample(t) {
  const dash = t.draw === 'dash' ? ' stroke-dasharray="9 5"'
    : t.draw === 'dashdot' ? ' stroke-dasharray="10 4 2 4"'
      : t.draw === 'dot' ? ' stroke-dasharray="2 5"' : '';
  const seg = `stroke="${t.color}" stroke-width="1.7" fill="none"${dash}`;
  if (t.draw === 'double') {
    return `<path d="M5 9 L91 9" ${seg}/><path d="M5 15 L91 15" ${seg}/>`;
  }
  return `<path d="M5 12 L84 12" ${seg}/>` +
    `<path d="M91 12 L82 7.6 L82 16.4 Z" fill="${t.color}"/>`;
}
/** 关系线怎么描述辈分：给弹层和面板用的一句话 */
function kinGapText(delta) {
  if (delta === 0) return '同辈（排在同一行）';
  return delta > 0 ? '低 ' + delta + ' 辈（排在下方 ' + delta + ' 行）' : '高 ' + (-delta) + ' 辈（排在上方 ' + (-delta) + ' 行）';
}

}

  return `${t}_${stamp}${suffix || ''}.${ext}`;
}

function standaloneSVG(opts) {
  opts = opts || {};
  const r = contentMarkup({ legend: opts.legend !== false, export: true });
  const b = fullBounds(), pad = 46;
  const titleH = opts.title ? 58 : 0;
  const x0 = b.x0 - pad, y0 = b.y0 - pad - titleH;
  const w = Math.max(b.x1 - b.x0 + pad * 2, 240);
  const h = Math.max(b.y1 - b.y0 + pad * 2 + titleH, 200);
  const bg = opts.bg === false ? '' :
    `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#ffffff"/>`;
  const title = opts.title ? `<text x="${x0 + 10}" y="${y0 + 38}" font-size="26" font-weight="700" fill="#1e2633" font-family='${FONT}'>${esc(state.title)}</text>
    <line x1="${x0 + 10}" y1="${y0 + 50}" x2="${x0 + w - 10}" y2="${y0 + 50}" stroke="#dbe1ea" stroke-width="1.5"/>` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(w)}" height="${Math.round(h)}" viewBox="${x0} ${y0} ${w} ${h}">
${bg}${title}${r.markup}
</svg>`;
}
function svgToCanvas(svgStr, scale, cb) {
  const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width * scale);
    cv.height = Math.round(img.height * scale);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    cb(cv);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('导出失败，请稍后重试'); };
  img.src = url;
}

/* ---- 极简 PDF 生成（内嵌 JPEG，无外部依赖） ---- */
function pdfFromJPEG(jpegBytes, pxW, pxH, pageW, pageH) {
  const strBytes = s => { const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 0xff; return a; };
  // 等比缩放居中
  const s = Math.min(pageW / pxW, pageH / pxH) * 0.94;
  const w = pxW * s, h = pxH * s;
  const x = (pageW - w) / 2, y = (pageH - h) / 2;

  const chunks = [];
  const offsets = [0];
  let len = 0;
  const push = u8 => { chunks.push(u8); len += u8.length; };
  const pushStr = s => push(strBytes(s));
  const startObj = () => { offsets.push(len); };

  pushStr('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  startObj(); pushStr('1 0 obj\n<</Type/Catalog/Pages 2 0 R>>\nendobj\n');
  startObj(); pushStr('2 0 obj\n<</Type/Pages/Kids[3 0 R]/Count 1>>\nendobj\n');
  startObj(); pushStr(`3 0 obj\n<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pageW.toFixed(2)} ${pageH.toFixed(2)}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>\nendobj\n`);
  startObj(); pushStr(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${pxW}/Height ${pxH}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpegBytes.length}>>\nstream\n`);
  push(jpegBytes);
  pushStr('\nendstream\nendobj\n');
  const content = `q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q\n`;
  startObj(); pushStr(`5 0 obj\n<</Length ${content.length}>>\nstream\n${content}endstream\nendobj\n`);

  const xrefPos = len;
  let xref = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) xref += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  pushStr(xref);
  pushStr(`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xrefPos}\n%%EOF\n`);

  const total = chunks.reduce((a, b) => a + b.length, 0);
  const out = new Uint8Array(total);
  let o = 0; chunks.forEach(c => { out.set(c, o); o += c.length; });
  return new Blob([out], { type: 'application/pdf' });
}
/** 把 JS 字符串安全地嵌进 <script> 里（转义引号换行，并拆掉可能提前闭合脚本的 </） */
function jsStr(v) {
  return JSON.stringify(v == null ? null : v).replace(/<\//g, '<\\/');
}
/** 在模板里一次性填空：边扫边替换，插进去的内容不会再被扫到（副本里也有同样的占位行） */
function fillTemplate(src, map) {
  // left 里的每个占位只填一次：整份源码里，占位行除了 app-core.js 里那一处，
  // 在本函数的查找表里还各有一处，填完必须摘掉，否则会把查找表自己改掉
  const left = Object.assign({}, map);
  let out = '', i = 0;
  while (i < src.length) {
    let hit = null;
    for (const k in left) {
      const j = src.indexOf(k, i);
      if (j >= 0 && (!hit || j < hit.j)) hit = { k: k, j: j };
    }
    if (!hit) { out += src.slice(i); break; }
    out += src.slice(i, hit.j) + left[hit.k];
    i = hit.j + hit.k.length;
    delete left[hit.k];
  }
  return out;
}

function exportPDF(a3) {
  const opts = { legend: $('#chkLegend').checked, bg: true, title: true };
  const svgStr = standaloneSVG(opts);
  toast('正在生成 PDF…');
  svgToCanvas(svgStr, 2.4, cv => {

    const jpeg = cv.toDataURL('image/jpeg', 0.94);
    const bin = atob(jpeg.split(',')[1]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    let pw = 595.28, ph = 841.89;                 // A4 纵向
    if (pxW > pxH) { const t = pw; pw = ph; ph = t; }  // 横向
    if (a3) { pw *= Math.SQRT2; ph *= Math.SQRT2; }    // A3
    download(pdfFromJPEG(bytes, pxW, pxH, pw, ph), fileName('pdf'));
    toast('PDF 已导出');
  });
}

function syncToolButtons() {
  $$('.tool[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === ui.tool));

function needSelection(fn) {
  return () => {
    if (!ui.sel || !person(ui.sel)) { toast('请先在画布上选中一位成员'); return; }
    fn(ui.sel);
  };
}
/** 收起所有下拉菜单 */
function closeMenus() {
  $$('.menu').forEach(x => { x.classList.remove('open'); x.style.visibility = ''; });
}
/** 展开某个菜单：菜单是 fixed 定位，这里按按钮的位置现算坐标，贴右边缘对齐 */
function placeMenu(btn, menu) {
  if (!btn || !menu) return;
  menu.style.visibility = 'hidden';
  menu.classList.add('open');
  const r = btn.getBoundingClientRect();
  const w = menu.offsetWidth, h = menu.offsetHeight, pad = 8;
  let left = Math.min(Math.max(pad, r.right - w), Math.max(pad, window.innerWidth - w - pad));
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - pad) top = Math.max(pad, r.top - h - 6);  // 下面放不下就翻到按钮上方
  menu.style.left = Math.round(left) + 'px';
  menu.style.top = Math.round(top) + 'px';
  menu.style.visibility = '';
}

    if (ctrl && e.key.toLowerCase() === 'p') { e.preventDefault(); printDoc(); return; }
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if ((ui.selSet || []).length > 1) { e.preventDefault(); actDeleteMany(); }
      else if (ui.sel) { e.preventDefault(); actDelete(ui.sel); }
      return;
    }
    if (e.key === 'Escape') { setSelection([]); ui.bondFrom = null; ui.kinFrom = null; ui.tool = 'select'; syncToolButtons(); render(); renderInspector(true); return; }
    if (e.key === 'f' || e.key === 'F') { fitView(); return; }
    if (panKeyDown(e)) return;
    if (e.key === '+' || e.key === '=') { const s = $('#svg'); zoomAt((s.clientWidth || 800) / 2, (s.clientHeight || 600) / 2, 1.2); return; }
    if (e.key === '-') { const s = $('#svg'); zoomAt((s.clientWidth || 800) / 2, (s.clientHeight || 600) / 2, 1 / 1.2); return; }
  });

  window.addEventListener('keyup', panKeyUp);
  window.addEventListener('blur', panStop);
  window.addEventListener('resize', () => render());
}

/** 框选多人后的批量操作 */
function handleMultiAct(act, el) {
  const ids = (ui.selSet || []).filter(id => person(id));
  if (!ids.length) return;
  const NUDGE = { up: [0, -10], down: [0, 10], left: [-12, 0], right: [12, 0] };
  if (act === 'clear') { setSelection([]); render(); renderInspector(true); return; }
  if (act === 'delete') { actDeleteMany(); return; }
  if (act === 'gender') {
    const g = el && el.dataset ? el.dataset.g : null;
    if (!g) return;
    ids.forEach(id => { person(id).gender = g; });
    commit(); renderInspector(true);
    toast('已把 ' + ids.length + ' 位的性别设为「' + (g === 'M' ? '男' : g === 'F' ? '女' : '未填') + '」');
    return;
  }
  if (act === 'cond') {
    const lab = ($('#mCondLabel') || {}).value || '';
    const col = ($('#mCondColor') || {}).value || COND_COLORS[0];
    if (!lab.trim()) { toast('先给标记起个名字，例如「高血压」'); return; }
    ids.forEach(id => { const p = person(id); p.conditions = p.conditions || []; p.conditions.push({ label: lab.trim(), color: col }); });
    commit(); renderInspector(true); toast('已给 ' + ids.length + ' 位成员加上「' + lab.trim() + '」');
    return;
  }
  if (NUDGE[act]) {
    const d = NUDGE[act];
    ids.forEach(id => {
      const p = person(id);
      p.off = [(p.off ? p.off[0] : 0) + d[0], (p.off ? p.off[1] : 0) + d[1]];
    });
    ui.layout = computeLayout(); render(); saveDraft();
    return;
  }
}

function pickBondTarget(fromId) {
  showModal(`<h3>选择要建立情感线的成员</h3><div class="mbody">
    <p class="hint-text">选中一位成员后，再用左侧「情感关系线」工具点另一位也可以。</p>
    <div id="bondPick" style="max-height:44vh;overflow:auto">
      ${state.people.filter(p => p.id !== fromId).map(p =>
    `<div class="kv" style="cursor:pointer" data-pick="${p.id}">
        <span class="dot" style="background:${p.gender === 'F' ? '#d4628f' : p.gender === 'M' ? '#4a7fd4' : '#7b8798'}"></span>
        <span class="nm">${esc(displayName(p))}</span>
        <span class="rel">${esc(safeKin(state.focalId, p.id).term || '')}</span></div>`).join('')}
    </div></div><div class="mfoot"><button class="btn" data-close>取消</button></div>`);
  $('#modalBox [data-close]').onclick = closeModal;
  $$('#bondPick .kv').forEach(el => el.onclick = () => {
    const to = el.dataset.pick;
    closeModal();
    chooseBondType(type => {
      state.bonds = state.bonds.filter(b => !((b.a === fromId && b.b === to) || (b.a === to && b.b === fromId)));
      state.bonds.push({ id: uid('b'), a: fromId, b: to, type });
      commit(); toast('已添加情感线');
    });
  });
}

/* ==========================================================================
   启动
   ========================================================================== */
function init() {
  let draft = loadDraft();
  // 导出的「可编辑副本」把家谱数据内嵌在文件里：第一次打开时把它落成草稿，
  // 之后再打开就走草稿（免得用户改了半天，一刷新又被内嵌的旧数据盖回去）
  if (!draft && EMBEDDED_STATE) {
    draft = JSON.parse(JSON.stringify(EMBEDDED_STATE));
    draft.locked = false;                     // 副本是拿来继续改的，不再保持「仅查看」
  }
  state = draft || starterState();
  if (!state.focalId && state.people.length) state.focalId = state.people[0].id;
  $('#docTitle').value = state.title || '我的家谱';
  history = { stack: [], index: -1 };
  pushHistory();
  ui.sel = null;
  ui.structVer = 1;
  bindUI();
  bindCanvas();
  // 视图开关的初始状态以 ui 为准（图例默认关闭，见 app-core.js）
  $('#chkShowLegend').checked = ui.showLegend;
  $('#chkShowTerm').checked = ui.showTerm;
  $('#chkShowNote').checked = ui.showNote;
  relayoutRender();
  fitView();
  if (state.people.length <= 1) {
    const hint = $('#canvasHint');
    hint.textContent = '提示：选中「我」，点节点上方的 ＋ 添加父母，左右加配偶/兄弟姐妹，下方加子女';
    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 7000);
  }
}
document.addEventListener('DOMContentLoaded', init);
</script>
