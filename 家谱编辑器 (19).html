d' },\n  adopt: { label: '收养', draw: 'dash' },\n  foster: { label: '寄养', draw: 'dot' },\n  step: { label: '继子女', draw: 'dashdot' }\n};\n\n/* 情感关系 */\nconst BOND_TYPE = {\n  close: { label: '亲密', color: '#2f8f6b' },\n  fused: { label: '融合 / 纠缠', color: '#7c3aed' },\n  distant: { label: '疏远', color: '#8a94a4' },\n  conflict: { label: '冲突', color: '#d97706' },\n  cutoff: { label: '断绝来往', color: '#dc2626' },\n  enmity: { label: '敌对', color: '#b91c1c' }\n};\n\n/* 血缘关系线（自定义血缘）\n   delta ＝「后点的人」相对「先点的人」的辈分差：+1 表示后点的人低一辈，−1 高一辈，0 同辈。\n   生 / 被生 是一对镜像：同样一条「长辈 → 晚辈」的线，选哪个取决于你先后点了谁。\n   自定义 只提供一个辈分差 n，不说明具体是什么亲戚——自动排列不会拿它当亲子 / 兄弟姐妹去解释，\n   只按 n 把对方挂到合理辈分上。 */\nconst KIN_TYPE = {\n  birth: { label: '生', delta: 1, draw: 'solid', color: '#8a5a2b', hint: '先点的人是长辈，后点的人是他／她生的' },\n  begotten: { label: '被生', delta: -1, draw: 'solid', color: '#8a5a2b', hint: '先点的人是晚辈，后点的人是他／她的父母' },\n  sibling: { label: '兄弟姐妹', delta: 0, draw: 'double', color: '#1f7a6a', hint: '两人同辈' },\n  adopt: { label: '领养', delta: 1, draw: 'dash', color: '#8a5a2b', hint: '先点的人是养父母（长辈），后点的人是被领养的一方' },\n  succession: { label: '过继', delta: 1, draw: 'dashdot', color: '#8a5a2b', hint: '先点的人是嗣父母（长辈），后点的人过继到其名下' },\n  custom: { label: '自定义', delta: 0, draw: 'dot', color: '#6b7688', hint: '自己定辈分差，不说明具体是什么亲戚' }\n};\n\n/** 一条关系线给「后点的人」带来的辈分差 */\nfunction kinDelta(k) {\n  if (!k) return 0;\n  const t = KIN_TYPE[k.type];\n  if (k.type === 'custom') { const n = Math.round(Number(k.n)); return isFinite(n) ? Math.max(-6, Math.min(6, n)) : 0; }\n  return t ? t.delta : 0;\n}\nfunction kinOf(id) { return (state.kins || []).filter(k => k.a === id || k.b === id); }\n/** 关系线另一头是谁 */\nfunction otherEnd(k, id) { return k.a === id ? k.b : k.a; }\n/** 关系线标签：自定义优先显示用户写的字，没写就按辈分差描述 */\nfunction kinLabel(k) {\n  if (!k) return '';\n  if (k.type !== 'custom') return (KIN_TYPE[k.type] || {}).label || '';\n  const txt = (k.text || '').trim();\n  const n = kinDelta(k);\n  const gap = n === 0 ? '同辈' : (n > 0 ? '低 ' + n + ' 辈' : '高 ' + (-n) + ' 辈');\n  return txt ? txt + '（' + gap + '）' : gap;\n}\n\n/* 健康状况常用配色（可自定义） */\nconst COND_COLORS = ['#4a7fd4', '#d4628f', '#e0a30b', '#2f8f6b', '#7c3aed', '#c2410c',\n  '#0e7490', '#9d174d', '#4d7c0f', '#57534e'];\n\n/* ---------------- 状态 ---------------- */\nlet state = null;         // 家谱数据\nlet view = { zoom: 1, x: 0, y: 0 };   // 视图变换\nlet ui = {\n  tool: 'select', sel: null, selSet: [], bondFrom: null, kinFrom: null,\n  // 图例默认关掉：刚打开时那几行图例挡在画布右上角，碍着看谱；要用时在左侧「视图」里勾上\n  showLegend: false, showTerm: true, showNote: false,\n  layout: null, bounds: null\n};\nlet history = { stack: [], index: -1 };\n\n/* ---------------- 选择（支持框选多选） ----------------\n   ui.sel    ── 主选中项，属性面板与「加父母 / 加子女」等操作的对象\n   ui.selSet ── 全部被选中的人；只有一个时与 ui.sel 相同 */\nfunction isSelected(id) {\n  return (ui.selSet && ui.selSet.length) ? ui.selSet.indexOf(id) >= 0 : ui.sel === id;\n}\n/** 设定选中集合；primary 缺省取最后一个。传空数组即取消选择 */\nfunction setSelection(ids, primary) {\n  ui.selSet = (ids || []).filter(id => person(id));\n  ui.sel = (primary && person(primary)) ? primary\n    : (ui.selSet.length ? ui.selSet[ui.selSet.length - 1] : null);\n  ui.structVer = (ui.structVer || 0) + 1;\n}\n/** 撤销 / 载入数据后，把已经不存在的人从选中集合里剔掉 */\nfunction pruneSelection() {\n  ui.selSet = (ui.selSet || []).filter(id => person(id));\n  if (!person(ui.sel)) ui.sel = ui.selSet.length ? ui.selSet[ui.selSet.length - 1] : null;\n}\n\n/* ---------------- 仅查看（锁定） ----------------\n   state.locked 会跟着 .json 一起保存，别人打开这份谱子时默认就是只读的，\n   不会顺手把节点拖乱。这是「防误改」，不是加密：想改随时可以解除。 */\nfunction locked() { return !!(state && state.locked); }\n\n/** 出嫁（或入赘）的人在本家（母族）的亲子关系，是否用「极淡虚线」表示。\n *  开：本人只按实线符号画在婚后所在的家族，连回母族的那条线淡化，一眼看出这是姻亲来路；\n *  关：与普通子女一样画成常规实线。两种模式下的排版完全一致，只是线的深浅不同。 */\nfunction faintNatalOn() { return !state || state.faintNatal !== false; }\n\nlet lastFaintLinks = 0;    // 上一条渲染里画了几条「母族关系淡线」，图例据此决定要不要列这一行\n\n/** 入赘：男方到女方家成婚，门户按女方算（只在性别为男时有效） */\nfunction isRuzhui(id) {\n  const p = person(id);\n  return !!(p && p.ruzhui && p.gender === GENDER_M);\n}\n\n/** 这个人是不是「嫁娶进来」的一方：婚后的家按配偶那一族定位，本人不在自己的本家落位。 */\nfunction marriedIn(id) {\n  const L = ui.layout;\n  return !!(L && L.owner && L.owner[id] && L.owner[id] !== id);\n}\n/** 编辑入口的统一拦截：已锁定时给个提示并返回 true，调用方直接 return */\nfunction guard() {\n  if (locked()) { toast('当前是「仅查看」状态，点右上角「解锁」后才能修改', 2600); return true; }\n  return false;\n}\n\n/* ---------------- 小工具 ---------------- */\nfunction uid(prefix) {\n  return (prefix || 'n') + Math.random().toString(36).slice(2, 7) + Date.now().toString(36).slice(-3);\n}\nfunction esc(s) {\n  return String(s == null ? '' : s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\n}\nfunction $(sel, root) { return (root || document).querySelector(sel); }\nfunction $$(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }\nfunction toast(msg, ms) {\n  const el = $('#toast');\n  el.textContent = msg; el.classList.add('show');\n  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), ms || 1900);\n}\n\n/* ==========================================================================\n   数据模型\n   ========================================================================== */\nfunction emptyState(title) {\n  return {\n    version: 1,\n    title: title || '我的家谱',\n    focalId: null,\n    locked: false,          // 「仅查看」锁定，随文件一起保存\n    faintNatal: true,       // 出嫁 / 入赘者在本家（母族）的亲子关系，用极淡虚线表示\n    people: [], couples: [], links: [], bonds: [], kins: []\n  };\n}\n\nfunction person(id) { return state.people.find(p => p.id === id) || null; }\nfunction couple(id) { return state.couples.find(c => c.id === id) || null; }\nfunction couplesOf(id) { return state.couples.filter(c => c.a === id || c.b === id); }\nfunction spouseOf(id) {\n  return couplesOf(id).map(c => (c.a === id ? c.b : c.a));\n}\nfunction linksOfChild(id) { return state.links.filter(l => l.child === id); }\nfunction partnerIn(c, id) { return c.a === id ? c.b : c.a; }\nfunction displayName(p) { return p ? (p.name && p.name.trim() ? p.name : '（未命名）') : '（未知）'; }\n\n/** 某人的父母 id 列表 */\nfunction parentsOf(id) {\n  const out = [];\n  for (const l of linksOfChild(id)) {\n    if (l.couple) {\n      const c = couple(l.couple);\n      if (c) { if (!out.includes(c.a)) out.push(c.a); if (!out.includes(c.b)) out.push(c.b); }\n    } else if (l.parent && !out.includes(l.parent)) out.push(l.parent);\n  }\n  return out;\n}\n/** 某人的子女 id 列表（含其夫妻关系中的子女） */\nfunction childrenOf(id) {\n  const out = [];\n  for (const l of state.links) {\n    if (l.couple) { const c = couple(l.couple); if (c && (c.a === id || c.b === id)) { if (!out.includes(l.child)) out.push(l.child); } }\n    else if (l.parent === id && !out.includes(l.child)) out.push(l.child);\n  }\n  return out;\n}\n/** 兄弟姐妹（共享同一父母关系） */\nfunction siblingsOf(id) {\n  const out = [];\n  const refs = linksOfChild(id).map(l => l.couple ? 'c:' + l.couple : 'p:' + l.parent);\n  for (const l of state.links) {\n    const key = l.couple ? 'c:' + l.couple : 'p:' + l.parent;\n    if (refs.includes(key) && l.child !== id && !out.includes(l.child)) out.push(l.child);\n  }\n  return out;\n}\nfunction firstParentRef(id) {\n  const l = linksOfChild(id)[0];\n  return l ? (l.couple ? l.couple : l.parent) : null;\n}\nfunction isAncestorOf(anc, node) {\n  if (anc === node) return true;\n  const seen = new Set();\n  const walk = (x) => {\n    if (seen.has(x)) return false; seen.add(x);\n    for (const p of parentsOf(x)) { if (p === anc || walk(p)) return true; }\n    return false;\n  };\n  return walk(node);\n}\n\n/* 供 Kin 模块使用的适配器 */\nconst KinGraph = {\n  person: id => person(id),\n  parentsOf, childrenOf, siblingsOf,\n  spousesOf: id => spouseOf(id),\n  elderBetween: (a, b) => elderBetween(a, b)   // 年龄未知时，称呼的长幼改由「兄弟排行」决定\n};\n\n/* ---------------- 增删改 ---------------- */\nfunction addPerson(opts) {\n  const p = Object.assign({\n    id: uid('p'), name: '', term: '', gender: GENDER_U, born: '', died: '', rank: '',\n    deceased: false, trans: false, orientation: '', ruzhui: false, conditions: [], note: ''\n  }, opts || {});\n  state.people.push(p);\n  return p;\n}\nfunction addCouple(a, b, status) {\n  const existing = state.couples.find(c => (c.a === a && c.b === b) || (c.a === b && c.b === a));\n  if (existing) return existing;\n  const c = { id: uid('c'), a, b, status: status || 'married' };\n  state.couples.push(c);\n  return c;\n}\nfunction addLink(parentRef, childId, type) {\n  const l = { id: uid('l'), couple: null, parent: null, child: childId, type: type || 'bio' };\n  if (typeof parentRef === 'string' && parentRef.startsWith('c_')) l.couple = parentRef;\n  else if (parentRef && couple(parentRef)) l.couple = parentRef;\n  else l.parent = parentRef;\n  state.links.push(l);\n  return l;\n}\n/** 找出「某人/某夫妻」当前使用的亲子关系引用 */\nfunction parentRefOf(id, preferCoupleWith) {\n  if (preferCoupleWith) {\n    const c = state.couples.find(x => (x.a === id && x.b === preferCoupleWith) || (x.b === id && x.a === preferCoupleWith));\n    if (c) return c.id;\n  }\n  const l = linksOfChild(id)[0];\n  if (l) return l.couple || l.parent;\n  const cs = couplesOf(id);\n  return cs.length ? cs[0].id : id;\n}\nfunction removePerson(id) {\n  // 先找出「因删人而解体」的夫妻，并记下仍在世的一方\n  const broken = state.couples.filter(c => c.a === id || c.b === id);\n  const survivor = {};\n  broken.forEach(c => { survivor[c.id] = partnerIn(c, id); });\n  const gone = new Set(broken.map(c => c.id));\n\n  state.couples = state.couples.filter(c => !gone.has(c.id));\n  state.links = state.links.filter(l => {\n    if (l.child === id) return false;               // 本人作为子女的连线\n    if (l.parent === id) return false;              // 本人作为单亲家长的连线\n    if (l.couple && gone.has(l.couple)) {\n      // 夫妻一方被删：子女改挂到仍在世的一方，亲子关系不丢\n      const s = survivor[l.couple];\n      if (s && person(s)) { l.couple = null; l.parent = s; return true; }\n      return false;\n    }\n    return true;                                    // 其余关系一律保留\n  });\n  state.bonds = state.bonds.filter(b => b.a !== id && b.b !== id);\n  if (state.kins) state.kins = state.kins.filter(k => k.a !== id && k.b !== id);\n  state.people = state.people.filter(p => p.id !== id);\n  if (state.focalId === id) state.focalId = null;\n}\nfunction removeBond(id) { state.bonds = state.bonds.filter(b => b.id !== id); }\nfunction removeKin(id) { state.kins = (state.kins || []).filter(k => k.id !== id); }\n\n/* ==========================================================================\n   自动布局\n   ========================================================================== */\n\n/** 辈分行号：以中心人物为基准推算，同辈必然同行。\n *\n *  规则：中心人物 = 0，父母 = −1，子女 = +1，配偶与兄弟姐妹 = 同辈。\n *  从中心人物出发做一次广度传播，最后整体平移到最小值为 0，得到行号。\n *\n *  为什么不按「无父母者 = 0」的老办法：那样算出来的是「离本支最早祖先有多远」，\n *  而不是「比『我』高几辈」。外祖父母一支若记得浅（只记到外公，再往上的没录），\n *  外公就会被当成第 0 代，与曾祖父挤在同一行，而他到妈妈之间的线也要多跨一行。\n *  以中心人物推算后，外公 = −2、妈妈 = −1，辈分相同的人自然齐平。 */\nfunction computeGenerations() {\n  const v = new Map();\n  const valid = new Set(state.people.map(p => p.id));\n  let queue = [];\n  const put = (id, val) => {\n    if (!valid.has(id) || v.has(id)) return;\n    v.set(id, val);\n    queue.push(id);\n  };\n\n  /* ① 以中心人物为基准做一致性传播 */\n  if (state.focalId && valid.has(state.focalId)) put(state.focalId, 0);\n  for (let qi = 0; qi < queue.length; qi++) {\n    const id = queue[qi];\n    const g = v.get(id);\n    parentsOf(id).forEach(p => put(p, g - 1));\n    childrenOf(id).forEach(c => put(c, g + 1));\n    spouseOf(id).forEach(s => put(s, g));\n    siblingsOf(id).forEach(s => put(s, g));\n  }\n\n  /* ①′ 关系线：把只靠关系线连着的成员挂到合理辈分上。\n        规矩是「结构优先」——父母 / 子女 / 配偶 / 兄弟姐妹算出来的辈分不动，\n        关系线只补结构没覆盖到的人；所以被关系者等于挂在主体家族旁边的一个「挂件」，\n        辈分对了，但不会并进那个家族的子树里去。\n        补完之后新落位的人还可能带着自己的父母 / 子女 / 配偶，所以整段反复跑到不再有人落位。 */\n  if ((state.kins || []).length) {\n    for (let pass = 0; pass < 12; pass++) {\n      const before = v.size;\n      const q = [];\n      v.forEach((val, id) => q.push(id));\n      // (a) 先把已有的结构闭包补完\n      for (let qi0 = 0; qi0 < q.length; qi0++) {\n        const id = q[qi0], g0 = v.get(id);\n        const add = (o, d) => { if (o && valid.has(o) && !v.has(o)) { v.set(o, g0 + d); q.push(o); } };\n        parentsOf(id).forEach(p => add(p, -1));\n        childrenOf(id).forEach(c => add(c, 1));\n        spouseOf(id).forEach(s => add(s, 0));\n        siblingsOf(id).forEach(s => add(s, 0));\n      }\n      // (b) 再看关系线：只补 (a) 没算到的人\n      const q2 = [];\n      v.forEach((val, id) => q2.push(id));\n      for (let i = 0; i < q2.length; i++) {\n        const id = q2[i], g0 = v.get(id);\n        kinOf(id).forEach(k => {\n          const o = otherEnd(k, id);\n          const d = kinDelta(k) * (k.a === id ? 1 : -1);   // 对方相对我的辈分差\n          if (o && valid.has(o) && !v.has(o)) { v.set(o, g0 + d); q2.push(o); }\n        });\n      }\n      if (v.size === before) break;\n    }\n  }\n\n  /* ② 与中心人物不连通的分支：退回「无父母者 0」的拓扑代数，再整体对齐。\n        没有中心人物时全体走这条路，与旧行为一致。\n        只有「牵涉关系线的那些分支」换成一次相对辈分的传播，好让一连串关系线\n        （甲同辈乙、乙生丙、丙又差三辈丁……）内部的高下严格对得上各自的辈分差；\n        不牵涉关系线的分支走的还是原来那套，行为一点没变。 */\n  if (state.people.some(p => !v.has(p.id))) {\n    const memo = new Map(), visiting = new Set();\n    const left = state.people.filter(p => !v.has(p.id)).map(p => p.id);\n    const leftSet = new Set(left);\n\n    function solvedByKin(id) {\n      return (state.kins || []).some(k => (k.a === id && leftSet.has(k.b)) || (k.b === id && leftSet.has(k.a)));\n    }\n    const rel = new Map();\n    left.forEach(start => {\n      if (rel.has(start) || !solvedByKin(start)) return;\n      const comp = [start], q = [start];\n      rel.set(start, 0);\n      for (let i = 0; i < q.length; i++) {\n        const id = q[i]; comp.push(id);\n        const push = (o, d) => { if (o && leftSet.has(o) && !rel.has(o)) { rel.set(o, rel.get(id) + d); q.push(o); } };\n        parentsOf(id).forEach(p => push(p, -1));\n        childrenOf(id).forEach(c => push(c, 1));\n        spouseOf(id).forEach(s => push(s, 0));\n        siblingsOf(id).forEach(s => push(s, 0));\n        kinOf(id).forEach(k => push(otherEnd(k, id), kinDelta(k) * (k.a === id ? 1 : -1)));\n      }\n      // 这一伙人里辈分最低的那个落在 0，和老办法「无父母者 0」的观感一致\n      let m = Infinity;\n      comp.forEach(id => { const x = rel.get(id); if (x < m) m = x; });\n      if (!isFinite(m)) m = 0;\n      comp.forEach(id => memo.set(id, rel.get(id) - m));\n    });\n\n    function topo(id) {\n      if (memo.has(id)) return memo.get(id);\n      if (visiting.has(id)) return 0;\n      visiting.add(id);\n      let g = 0;\n      for (const p of parentsOf(id)) g = Math.max(g, topo(p) + 1);\n      visiting.delete(id);\n      memo.set(id, g);\n      return g;\n    }\n    state.people.forEach(p => topo(p.id));\n    let base = 0;\n    if (v.size) { let m = Infinity; v.forEach(x => { if (x < m) m = x; }); base = m; }\n    state.people.forEach(p => { if (!v.has(p.id)) v.set(p.id, memo.get(p.id) + base); });\n  }\n\n  /* ③ 平移到 0 起步的行号 */\n  let min = Infinity;\n  v.forEach(x => { if (x < min) min = x; });\n  if (!isFinite(min)) min = 0;\n  const rows = new Map();\n  v.forEach((val, id) => rows.set(id, val - min));\n  return rows;\n}\n\n/** 判定一对夫妻中谁是「本家」（承接血亲线的一侧） */\nfunction tentativeAnchor(c) {\n  const has = id => linksOfChild(id).length > 0;\n  const a = c.a, b = c.b;\n  // 入赘优先：男方到女方家，门户按女方算，男方按「嫁进来」的一方处理\n  const ra = isRuzhui(a), rb = isRuzhui(b);\n  if (ra !== rb) return ra ? b : a;\n  const ha = has(a), hb = has(b);\n  if (ha && !hb) return a;\n  if (hb && !ha) return b;\n  const na = !has(a) ? 0 : -1, nb = !has(b) ? 0 : -1;\n  // 若某人是中心人物的直系祖先，优先作为锚点\n  const fa = state.focalId ? isAncestorOf(a, state.focalId) : false;\n  const fb = state.focalId ? isAncestorOf(b, state.focalId) : false;\n  if (fa !== fb) return fa ? a : b;\n  const da = ancestorDepth(a), db = ancestorDepth(b);\n  if (da !== db) return da > db ? a : b;\n  const ga = person(a), gb = person(b);\n  if (ga && gb && ga.gender !== gb.gender) return ga.gender === GENDER_M ? a : b;\n  return a;\n}\nfunction ancestorDepth(id, depth) {\n  depth = depth || 0;\n  if (depth > 20) return depth;\n  const ps = parentsOf(id);\n  if (!ps.length) return 0;\n  return 1 + Math.max.apply(null, ps.map(p => ancestorDepth(p, depth + 1)));\n}\n\nfunction buildUnits() {\n  const anchors = new Map();\n  state.couples.forEach(c => anchors.set(c.id, tentativeAnchor(c)));\n\n  // 若某人作为「非锚点配偶」出现在两对以上关系中（再婚），改由他/她来当锚点\n  const cnt = {};\n  state.couples.forEach(c => {\n    const A = anchors.get(c.id), B = partnerIn(c, A);\n    cnt[B] = (cnt[B] || 0) + 1;\n  });\n  state.couples.forEach(c => {\n    const A = anchors.get(c.id), B = partnerIn(c, A);\n    if (cnt[B] >= 2) anchors.set(c.id, B);\n  });\n\n  const isAnchorOfAny = new Set(Array.from(anchors.values()));\n  const owner = {};\n  state.people.forEach(p => owner[p.id] = p.id);\n  state.couples.forEach(c => {\n    const A = anchors.get(c.id), B = partnerIn(c, A);\n    if (!isAnchorOfAny.has(B) && owner[B] === B) owner[B] = A;\n  });\n\n  // 组装单元\n  const units = {};\n  state.people.forEach(p => {\n    if (owner[p.id] === p.id) units[p.id] = { anchor: p.id, cells: [p.id], couples: [], groups: [] };\n  });\n  state.people.forEach(p => {\n    const A = owner[p.id];\n    if (A !== p.id && units[A]) units[A].cells.push(p.id);\n  });\n  // 单元内顺序：本家为男性时配偶在右，为女性时配偶在左，多配偶依次向外\n  Object.values(units).forEach(u => {\n    const A = u.anchor;\n    const partners = state.couples.filter(c => (c.a === A || c.b === A))\n      .map(c => ({ c, B: partnerIn(c, A) }))\n      .filter(x => owner[x.B] === A);\n    const aMale = person(A) && person(A).gender === GENDER_M;\n    const left = [], right = [];\n    partners.forEach((x, i) => {\n      if (i === 0) (aMale ? right : left).push(x);\n      else if (i % 2 === 1) right.push(x);\n      else left.unshift(x);\n    });\n    u.cells = left.map(x => x.B).concat([A], right.map(x => x.B));\n    // 夫左妻右：一对夫妻里把丈夫排在左边。两人才好换；多段婚姻仍按「本家在中间、配偶依次向外」保持读得通\n    if (u.cells.length === 2) {\n      const p0 = person(u.cells[0]), p1 = person(u.cells[1]);\n      if (p0 && p1 && p0.gender !== GENDER_M && p1.gender === GENDER_M) {\n        u.cells = [u.cells[1], u.cells[0]];\n      }\n    }\n    u.couples = left.concat(right).sort((x, y) => u.cells.indexOf(x.B) - u.cells.indexOf(y.B)).map(x => x.c);\n    u.partnerOf = {};\n    left.concat(right).forEach(x => u.partnerOf[x.B] = x.c.id);\n  });\n  // 子女分组\n  Object.values(units).forEach(u => {\n    const seen = new Set();\n    u.groups = [];\n    u.couples.forEach(c => {\n      const kids = state.links.filter(l => l.couple === c.id).map(l => l.child).filter(k => !seen.has(k));\n      kids.forEach(k => seen.add(k));\n      if (kids.length) u.groups.push({ ref: c.id, couple: c, kids: sortKids(kids) });\n    });\n    const solo = state.links.filter(l => l.parent === u.anchor).map(l => l.child).filter(k => !seen.has(k));\n    if (solo.length) u.groups.push({ ref: u.anchor, couple: null, kids: sortKids(solo) });\n  });\n\n  return { units, owner, anchors };\n}\n/** 同辈组（兄弟姐妹，含本人） */\nfunction siblingGroup(id) {\n  return siblingsOf(id).concat([id]);\n}\n/** 出生年（整数）；没填或填了非数字返回 null */\nfunction bornYear(id) {\n  const p = person(id);\n  const y = p ? parseInt(p.born, 10) : NaN;\n  return isNaN(y) ? null : y;\n}\n/** 手工填写的排行（1＝同辈中最大）；未填返回 null */\nfunction manualRank(id) {\n  const p = person(id);\n  const r = p ? parseInt(p.rank, 10) : NaN;\n  return (!isNaN(r) && r > 0) ? r : null;\n}\n/**\n * 同辈排序：年长者始终在前。\n *   1. 填了出生年的人，按出生年排——年龄是长幼最硬的依据，填了年龄就轮不到排行说话；\n *   2. 没填出生年、但填了「兄弟排行」的人，把排行当作「他在这一辈里排第几」的直接声明，\n *      据此占住对应位次（排行 1 → 第一个）；\n *   3. 两样都没有的人垫在最后，保持录入次序。\n * 例：阿二(1960)、阿三(1965)、阿大(1970) → 阿二 阿三 阿大（年龄说话）\n *     阿大排行 2、阿二排行 1、阿三排行 3（都没年龄） → 阿二 阿大 阿三（排行说话）\n */\nfunction sortSiblings(ids) {\n  const list = ids.slice();\n  const n = list.length;\n  if (n < 2) return list;\n  const ins = new Map(list.map((id, i) => [id, i]));\n  const tie = (a, b) => {\n    const ma = manualRank(a), mb = manualRank(b);\n    if ((ma != null) !== (mb != null)) return ma != null ? -1 : 1;\n    const pa = person(a), pb = person(b);\n    if (pa && pb && pa.gender !== pb.gender) return pa.gender === GENDER_M ? -1 : 1;\n    return (ins.get(a) || 0) - (ins.get(b) || 0);\n  };\n  const dated = list.filter(id => bornYear(id) != null)\n    .sort((a, b) => (bornYear(a) - bornYear(b)) || tie(a, b));\n  const ranked = list.filter(id => bornYear(id) == null && manualRank(id) != null)\n    .sort((a, b) => (manualRank(a) - manualRank(b)) || tie(a, b));\n  const blank = list.filter(id => bornYear(id) == null && manualRank(id) == null);\n\n  const out = new Array(n).fill(null);\n  // ① 没年龄的人用排行占位\n  ranked.forEach(id => {\n    let s = Math.min(Math.max(manualRank(id) - 1, 0), n - 1);\n    while (s < n && out[s]) s++;\n    if (s >= n) { s = 0; while (s < n && out[s]) s++; }\n    if (s < n) out[s] = id;\n  });\n  // ② 有年龄的人按年龄依次填进剩下的空位\n  let di = 0;\n  for (let i = 0; i < n; i++) if (!out[i] && di < dated.length) out[i] = dated[di++];\n  // ③ 既无年龄又无排行的人垫尾\n  let bi = 0;\n  for (let i = 0; i < n; i++) if (!out[i] && bi < blank.length) out[i] = blank[bi++];\n  return out.filter(Boolean);\n}\nfunction sortKids(ids) { return sortSiblings(ids); }\n\n/** 某人在同辈中的位次（1 起，1 ＝ 这一辈里最大）；单独一人时为 1 */\nfunction rankPos(id) {\n  return sortSiblings(siblingGroup(id)).indexOf(id) + 1;\n}\n/**\n * 比较 a、b 谁年长：返回 'a' a 年长 / 'b' b 年长 / null 无法判断（长幼并列）。\n * 只在真正的兄弟姐妹之间有意义。优先出生年，年龄缺失时才看排行。\n */\nfunction elderBetween(a, b) {\n  if (!a || !b || a === b) return null;\n  const ya = bornYear(a), yb = bornYear(b);\n  // 1) 都填了出生年：年龄说话\n  if (ya != null && yb != null && ya !== yb) return ya < yb ? 'a' : 'b';\n  // 2) 有一方年龄不明：用「兄弟排行」——位次由 sortSiblings 统一算出\n  if (ya == null || yb == null) {\n    if (manualRank(a) == null && manualRank(b) == null) return null;\n    const ra = rankPos(a), rb = rankPos(b);\n    return ra === rb ? null : (ra < rb ? 'a' : 'b');\n  }\n  // 3) 同年出生：两边都声明了排行才比\n  const ra0 = manualRank(a), rb0 = manualRank(b);\n  if (ra0 != null && rb0 != null && ra0 !== rb0) return ra0 < rb0 ? 'a' : 'b';\n  return null;\n}\n/** 仅按出生年推算的排行（用于面板提示；没填出生年或同辈里没有别的年龄时返回 null） */\nfunction autoRank(id) {\n  const y = bornYear(id);\n  if (y == null) return null;\n  const grp = siblingGroup(id);\n  if (grp.length < 2) return null;\n  let r = 1, peers = 0;\n  for (const sid of grp) {\n    if (sid === id) continue;\n    const yy = bornYear(sid);\n    if (yy == null) continue;\n    peers++;\n    if (yy < y) r++;\n  }\n  return peers ? r : null;\n}\n\n/**\n * 某人所属「根」——他最终会落在哪一支家族的块里。\n *   1. 有父母：优先走「本家」那一侧（父母里作为单元锚点、即血亲的一方），\n *      两边都是本家时取父系——这就是「以父系遗传为主轴」；\n *   2. 没有父母：自己就是单元的锚点 → 自成一根；否则随配偶所在单元，归到配偶那一支。\n */\nfunction rootAnchorOf(id, owner, memo, visiting) {\n  if (memo.has(id)) return memo.get(id);\n  visiting = visiting || new Set();\n  if (visiting.has(id)) return owner[id];\n  visiting.add(id);\n  const ps = parentsOf(id);\n  let r;\n  if (!ps.length) {\n    const a = owner[id];\n    r = (a === id) ? id : rootAnchorOf(a, owner, memo, visiting);\n  } else {\n    const blood = ps.filter(p => owner[p] === p);              // 本家一方\n    const pool = blood.length ? blood : ps;\n    const dad = pool.find(p => { const q = person(p); return q && q.gender === GENDER_M; });\n    r = rootAnchorOf(dad || pool[0], owner, memo, visiting);\n  }\n  visiting.delete(id);\n  memo.set(id, r);\n  return r;\n}\n\n/** 每对夫妻的中点（亲子线从这里垂下） */\nfunction coupleMid(c, pos) {\n  const pa = pos[c.a], pb = pos[c.b];\n  if (!pa || !pb) return null;\n  return { x: (pa.x + pb.x) / 2, y: Math.max(pa.y, pb.y) };\n}\n/** 某条亲子线从长辈轴心到子女的水平跨度（嫁出的子女算在其母族虚位处） */\nfunction linkSpanOf(l, pos) {\n  const c = pos[l.child];\n  if (!c) return 0;\n  let a = null;\n  if (l.couple) { const cp = couple(l.couple); a = cp ? coupleMid(cp, pos) : null; }\n  else a = pos[l.parent];\n  if (!a) return 0;\n  return Math.abs(c.x - a.x);\n}\n/** 全图遗传线总跨度——越小说明子代线越短、交叉越少 */\nfunction totalLinkSpan(pos) {\n  let s = 0;\n  state.links.forEach(l => { s += linkSpanOf(l, pos); });\n  return s;\n}\n\n/* ==================================== troke=\"${s}\" stroke-width=\"${w}\"/>`;\n  return `<rect x=\"${x-SYM}\" y=\"${y-SYM}\" width=\"${SYM*2}\" height=\"${SYM*2}\" rx=\"2\" fill=\"${f}\" stroke=\"${s}\" stroke-width=\"${w}\"/>`;\n}\nfunction symbolMarkup(p, x, y, opts) {\n  opts = opts || {};\n  const stroke = p.deceased ? '#33415c' : '#33415c';\n  const conds = (p.conditions || []).filter(c => c && c.color);\n  let defs = '', body = '';\n\n  if (conds.length) {\n    const cid = 'clip-' + p.id;\n    defs = `<clipPath id=\"${cid}\">${symbolShape(p.gender, 0, 0, '#fff', 'none', 0).replace(/fill=\"#fff\"/, 'fill=\"#fff\"')}<\/clipPath>`;\n    const n = conds.length, R = SYM * 2.6;\n    let wedges = '';\n    if (n === 1) {\n      wedges = `<circle cx=\"0\" cy=\"0\" r=\"${R}\" fill=\"${conds[0].color}\" opacity=\"0.85\"/>`;\n    } else {\n      for (let i = 0; i < n; i++) {\n        const a0 = -Math.PI / 2 + i * 2 * Math.PI / n, a1 = -Math.PI / 2 + (i + 1) * 2 * Math.PI / n;\n        const x0 = R * Math.cos(a0), y0 = R * Math.sin(a0), x1 = R * Math.cos(a1), y1 = R * Math.sin(a1);\n        wedges += `<path d=\"M0 0 L${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)} Z\" fill=\"${conds[i].color}\" opacity=\"0.85\"/>`;\n      }\n    }\n    body += `<g clip-path=\"url(#${cid})\">${wedges}<\/g>`;\n  }\n  body += symbolShape(p.gender, 0, 0, 'none', stroke, 2);\n\n  if (p.deceased) {\n    const r = SYM * 0.82;\n    body += `<path d=\"M${-r} ${-r} L${r} ${r} M${r} ${-r} L${-r} ${r}\" stroke=\"${stroke}\" stroke-width=\"2.2\" stroke-linecap=\"round\" fill=\"none\"/>`;\n  }\n  if (p.trans) {\n    if (p.gender === GENDER_M) body += `<circle cx=\"0\" cy=\"0\" r=\"9.5\" fill=\"none\" stroke=\"${stroke}\" stroke-width=\"1.8\"/>`;\n    else if (p.gender === GENDER_F) body += `<rect x=\"-8.5\" y=\"-8.5\" width=\"17\" height=\"17\" fill=\"none\" stroke=\"${stroke}\" stroke-width=\"1.8\"/>`;\n  }\n  if (p.orientation === 'gay') {\n    body += `<path d=\"M0 -11 L10.5 8 L-10.5 8 Z\" fill=\"${stroke}\" opacity=\"0.85\"/>`;\n  }\n  return `<defs>${defs}<\/defs>${body}`;\n}\n/** 面板里的小图标 */\nfunction miniSymbol(p, size) {\n  const s = size || 30, r = s / 2 - 2;\n  const conds = (p.conditions || []).filter(c => c && c.color);\n  let fill = 'none';\n  if (conds.length === 1) fill = conds[0].color;\n  else if (conds.length > 1) fill = conds[0].color;\n  let shape;\n  if (p.gender === GENDER_F) shape = `<circle cx=\"${s/2}\" cy=\"${s/2}\" r=\"${r}\" fill=\"${fill}\" stroke=\"#33415c\" stroke-width=\"2\"/>`;\n  else if (p.gender === GENDER_U) shape = `<path d=\"M ${s/2} ${s/2-r-1} L ${s/2+r+1} ${s/2} L ${s/2} ${s/2+r+1} L ${s/2-r-1} ${s/2} Z\" fill=\"${fill}\" stroke=\"#33415c\" stroke-width=\"2\"/>`;\n  else shape = `<rect x=\"2\" y=\"2\" width=\"${s-4}\" height=\"${s-4}\" rx=\"2\" fill=\"${fill}\" stroke=\"#33415c\" stroke-width=\"2\"/>`;\n  let extra = '';\n  if (p.deceased) extra += `<path d=\"M${s*0.2} ${s*0.2} L${s*0.8} ${s*0.8} M${s*0.8} ${s*0.2} L${s*0.2} ${s*0.8}\" stroke=\"#33415c\" stroke-width=\"2\" stroke-linecap=\"round\"/>`;\n  if (p.trans) {\n    if (p.gender === GENDER_M) extra += `<circle cx=\"${s/2}\" cy=\"${s/2}\" r=\"${s*0.19}\" fill=\"none\" stroke=\"#33415c\" stroke-width=\"1.6\"/>`;\n    else extra += `<rect x=\"${s*0.32}\" y=\"${s*0.32}\" width=\"${s*0.36}\" height=\"${s*0.36}\" fill=\"none\" stroke=\"#33415c\" stroke-width=\"1.6\"/>`;\n  }\n  if (p.orientation === 'gay') extra += `<path d=\"M${s/2} ${s*0.28} L${s*0.72} ${s*0.68} L${s*0.28} ${s*0.68} Z\" fill=\"#33415c\" opacity=\"0.85\"/>`;\n  return `<svg width=\"${s}\" height=\"${s}\" viewBox=\"0 0 ${s} ${s}\">${shape}${extra}<\/svg>`;\n}\n\n/* 图例用的小图形（中心在 (13,0)） */\nconst LG = {\n  square: () => `<rect x=\"4\" y=\"-9\" width=\"18\" height=\"18\" rx=\"2\" fill=\"none\" stroke=\"#33415c\" stroke-width=\"2\"/>`,\n  circle: () => `<circle cx=\"13\" cy=\"0\" r=\"9\" fill=\"none\" stroke=\"#33415c\" stroke-width=\"2\"/>`,\n  diamond: () => `<path d=\"M13 -10 L23 0 L13 10 L3 0 Z\" fill=\"none\" stroke=\"#33415c\" stroke-width=\"2\"/>`\n};\n\nfunction lineDash(draw) {  if (draw === 'dash') return '8 6';\n  if (draw === 'dot') return '2 5';\n  if (draw === 'dashdot') return '9 4 2 4';\n  return '';\n}\n\n/** 生成整幅图的 SVG 内容 */\nfunction contentMarkup(opts) {\n  opts = opts || {};\n  const L = ui.layout || computeLayout();\n  const pos = L.pos, b = ui.bounds;\n  const forExport = !!opts.export;\n  let out = '';\n\n  /* ---- 情感关系线（绘于底层） ---- */\n  let bonds = '';\n  state.bonds.forEach(bd => {\n    const p1 = pos[bd.a], p2 = pos[bd.b];\n    if (!p1 || !p2) return;\n    const t = BOND_TYPE[bd.type] || BOND_TYPE.close;\n    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;\n    const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy) || 1;\n    const nx = -dy / len, ny = dx / len;\n    const bow = Math.min(46, len * 0.16);\n    const cx = mx + nx * bow, cy = my + ny * bow;\n    const base = { stroke: t.color, 'stroke-width': 1.8, fill: 'none', 'stroke-linecap': 'round' };\n    const attr = o => Object.entries(Object.assign({}, base, o)).map(([k, v]) => `${k}=\"${v}\"`).join(' ');\n    const q = (off) => `M${p1.x + nx*off} ${p1.y + ny*off} Q${cx + nx*off} ${cy + ny*off} ${p2.x + nx*off} ${p2.y + ny*off}`;\n\n    if (bd.type === 'close' || bd.type === 'fused') {\n      const n = bd.type === 'fused' ? 3 : 2;\n      for (let i = 0; i < n; i++) bonds += `<path d=\"${q((i - (n - 1) / 2) * 3.4)}\" ${attr({})}/>`;\n    } else if (bd.type === 'distant') {\n      bonds += `<path d=\"${q(0)}\" ${attr({ 'stroke-dasharray': '7 6' })}/>`;\n    } else if (bd.type === 'conflict' || bd.type === 'enmity') {\n      const N = 26, amp = 4.6;\n      let pts = [];\n      for (let i = 0; i <= N; i++) {\n        const u = i / N, iu = 1 - u;\n        const px = iu*iu*p1.x + 2*iu*u*cx + u*u*p2.x, py = iu*iu*p1.y + 2*iu*u*cy + u*u*p2.y;\n        const s = (i % 2 ? 1 : -1) * amp * Math.sin(Math.PI * u);\n        pts.push([px + nx * s, py + ny * s]);\n      }\n      bonds += `<polyline points=\"${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}\" ${attr({ 'stroke-width': 1.6 })}/>`;\n      if (bd.type === 'enmity') bonds += `<path d=\"${q(0)}\" ${attr({ 'stroke-width': 1.6, 'marker-end': '' })} opacity=\"0\"/>`;\n    } else if (bd.type === 'cutoff') {\n      const N = 30, seg1 = [], seg2 = [];\n      for (let i = 0; i <= N; i++) {\n        const u = i / N, iu = 1 - u;\n        const px = iu*iu*p1.x + 2*iu*u*cx + u*u*p2.x, py = iu*iu*p1.y + 2*iu*u*cy + u*u*p2.y;\n        if (u <= 0.4) seg1.push([px, py]); else if (u >= 0.6) seg2.push([px, py]);\n      }\n      const pl = a => a.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');\n      bonds += `<polyline points=\"${pl(seg1)}\" ${attr({})}/><polyline points=\"${pl(seg2)}\" ${attr({})}/>`;\n    }\n  });\n  out += `<g>${bonds}<\/g>`;\n\n  /* ---- 夫妻线 ---- */\n  let cls = '';\n  state.couples.forEach(c => {\n    const pa = pos[c.a], pb = pos[c.b];\n    if (!pa || !pb) return;\n    const st = COUPLE_STATUS[c.status] || COUPLE_STATUS.married;\n    const dash = lineDash(st.draw);\n    const y = pa.y;\n    let d;\n    if (Math.abs(pa.y - pb.y) < 1) {\n      // 同行：直接连（若中间隔着别人，绕到下方）\n      const between = state.people.some(p => pos[p.id] && Math.abs(pos[p.id].y - y) < 1 &&\n        pos[p.id].x > Math.min(pa.x, pb.x) + SYM && pos[p.id].x < Math.max(pa.x, pb.x) - SYM);\n      if (!between) d = `M${pa.x} ${y} L${pb.x} ${y}`;\n      else {\n        const yy = y + SYM + 20;\n        const x1 = pa.x + (pb.x > pa.x ? SYM * 0.6 : -SYM * 0.6);\n        const x2 = pb.x + (pb.x > pa.x ? -SYM * 0.6 : SYM * 0.6);\n        d = `M${x1} ${y} L${x1} ${yy} L${x2} ${yy} L${x2} ${y}`;\n      }\n    } else {\n      const yy = Math.max(pa.y, pb.y) + SYM + 22;\n      const x1 = pa.x + (pb.x >= pa.x ? SYM * 0.6 : -SYM * 0.6);\n      const x2 = pb.x + (pb.x >= pa.x ? -SYM * 0.6 : SYM * 0.6);\n      d = `M${x1} ${pa.y} L${x1} ${yy} L${x2} ${yy} L${x2} ${pb.y}`;\n    }\n    cls += `<path d=\"${d}\" fill=\"none\" stroke=\"#33415c\" stroke-width=\"1.8\" stroke-linejoin=\"round\" ${dash ? `stroke-dasharray=\"${dash}\"` : ''}/>`;\n    // 婚姻状态符号\n    const mx = (pa.x + pb.x) / 2, segY = (Math.abs(pa.y - pb.y) < 1) ? y : Math.max(pa.y, pb.y) + SYM + 22;\n    if (st.draw === 'slash1' || st.draw === 'slash2') {\n      const n = st.draw === 'slash2' ? 2 : 1;\n      for (let i = 0; i < n; i++) {\n        const ox = mx + (i - (n - 1) / 2) * 9;\n        cls += `<path d=\"M${ox - 6} ${segY + 6} L${ox + 6} ${segY - 6}\" stroke=\"#33415c\" stroke-width=\"2\" stroke-linecap=\"round\"/>`;\n      }\n    } else if (st.draw === 'dot') {\n      cls += `<circle cx=\"${mx}\" cy=\"${segY}\" r=\"3.4\" fill=\"#33415c\"/>`;\n    }\n  });\n  out += `<g>${cls}<\/g>`;\n\n  /* ---- 亲子线 ---- */\n  const groups = {};\n  state.links.forEach(l => {\n    const key = l.couple ? 'c:' + l.couple : 'p:' + l.parent;\n    (groups[key] = groups[key] || []).push(l);\n  });\n  const bars = [];          // 待绘制的「父母 → 子女」支架\n  const slots = faintNatalOn() ? (L.slots || {}) : {};\n  Object.entries(groups).forEach(([key, ls]) => {\n    let anchorPt = null;\n    if (key.startsWith('c:')) {\n      const c = couple(key.slice(2));\n      if (!c) return;\n      const pa = pos[c.a], pb = pos[c.b];\n      if (!pa || !pb) return;\n      if (Math.abs(pa.y - pb.y) < 1) anchorPt = { x: (pa.x + pb.x) / 2, y: pa.y + (hasCrossing(c, pos) ? SYM + 20 : 0) };\n      else anchorPt = { x: (pa.x + pb.x) / 2, y: Math.max(pa.y, pb.y) + SYM + 22 };\n    } else {\n      const q = pos[key.slice(2)];\n      if (!q) return;\n      anchorPt = { x: q.x, y: q.y + SYM };\n    }\n    const all = ls.map(l => ({ l, q: pos[l.child], slot: slots[l.child] })).filter(k => k.q);\n    if (!all.length) return;\n    // 嫁出 / 入赘的子女：本人在配偶那一族，这里只在父母横杆上按姊妹排行留一个位子（m.x / m.y）\n    const byRow = {};\n    all.forEach(k => {\n      const m = { k, x: k.slot ? k.slot.x : k.q.x, y: k.slot ? k.slot.y : k.q.y };\n      (byRow[m.y] = byRow[m.y] || []).push(m);\n    });\n    Object.values(byRow).forEach(row => {\n      const childY = Math.min.apply(null, row.map(m => m.y)) - SYM;\n      // 横杆必须横跨「长辈轴心」与全部子女在本家的位置（嫁出者用她的姊妹位），\n      // 这样她的连线与前后的兄弟姐妹是同一条横杆、同一个起点，地位完全相同\n      const bx0 = Math.min(Math.min.apply(null, row.map(m => m.x)), anchorPt.x);\n      const bx1 = Math.max(Math.max.apply(null, row.map(m => m.x)), anchorPt.x);\n      const natural = anchorPt.y + Math.max(26, (childY - anchorPt.y) * 0.42);\n      bars.push({ anchorPt, row, childY, bx0, bx1, barY: Math.min(natural, childY - 20) });\n    });\n  });\n  // 横杆错开：不同家庭的横杆若在同一高度且水平重叠，逐级下移\n  bars.sort((a, b) => a.barY - b.barY || a.bx0 - b.bx0);\n  const settled = [];\n  bars.forEach(g => {\n    let y = g.barY, guard = 0;\n    while (guard++ < 60 && settled.some(p =>\n      Math.abs(p.y - y) < 15 && !(p.x1 < g.bx0 - 4 || p.x0 > g.bx1 + 4))) y += 15;\n    g.barY = Math.min(y, g.childY - 18);\n    settled.push({ y: g.barY, x0: g.bx0, x1: g.bx1 });\n  });\n\n  /** 竖线穿横杆时画「跳线」半圆，避免看成接点 */\n  function vpath(x, y1, y2) {\n    const cross = settled.filter(s => s.x0 - 1 <= x && x <= s.x1 + 1 && s.y > y1 + 3 && s.y < y2 - 3)\n      .map(s => s.y).sort((a, b) => a - b);\n    let d = `M${x} ${y1}`;\n    cross.forEach(oy => { d += ` L${x} ${oy - 6} A6 6 0 0 1 ${x} ${oy + 6}`; });\n    d += ` L${x} ${y2}`;\n    return d;\n  }\n  /* ---- 父母 → 子女：实线照旧；出嫁 / 入赘的那一条改用极淡虚线，但走法完全一样 ----\n     她从父母横杆上「自己的姊妹位」出发（跟兄弟姐妹同一个起点、同一条横杆），\n     直角转弯（竖 → 横 → 竖）绕到配偶那一族里她本人的符号顶端。\n     关掉「母族关系用淡线」后，她与普通子女一样画实线，横杆也一直连到她本人。 */\n  let pl = '', faintPl = '';\n  let nFaint = 0;\n  bars.forEach(g => {\n    pl += `<path d=\"${vpath(g.anchorPt.x, g.anchorPt.y, g.barY)}\" fill=\"none\" stroke=\"#33415c\" stroke-width=\"1.8\"/>`;\n    pl += `<path d=\"M${g.bx0} ${g.barY} L${g.bx1} ${g.barY}\" fill=\"none\" stroke=\"#33415c\" stroke-width=\"1.8\"/>`;\n    g.row.forEach(m => {\n      const k = m.k;\n      if (k.slot) {\n        // 姊妹位 → 直角转弯 → 她本人的符号顶端\n        const y0 = g.barY, x1 = k.q.x, y1 = k.q.y - SYM;\n        // 转弯的横线走在「父母那一行」与「子女那一行」之间，避开子女的称呼小字\n        const midY = Math.max(y0 + 12, Math.min(y0 + (y1 - y0) * 0.5, y1 - 12));\n        const ry = midY.toFixed(1);\n        faintPl += `<path d=\"M${m.x.toFixed(1)} ${y0.toFixed(1)} L${m.x.toFixed(1)} ${ry} L${x1.toFixed(1)} ${ry} L${x1.toFixed(1)} ${y1.toFixed(1)}\" ` +\n          `fill=\"none\" stroke=\"#b3c3d8\" stroke-width=\"1.5\" stroke-dasharray=\"5 6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>`;\n        nFaint++;\n        return;\n      }\n      const t = PARENT_TYPE[k.l.type] || PARENT_TYPE.bio;\n      const dash = lineDash(t.draw);\n      pl += `<path d=\"${vpath(m.x, g.barY, m.y - SYM)}\" fill=\"none\" stroke=\"#33415c\" stroke-width=\"1.8\" ${dash ? `stroke-dasharray=\"${dash}\"` : ''}/>`;\n    });\n  });\n  out += `<g>${pl}<\/g>`;\n  lastFaintLinks = nFaint;\n  if (faintPl) out += `<g>${faintPl}<\/g>`;\n\n  /* ---- 关系线（自定义血缘）：画在结构线之上、节点之下，免得被夫妻线 / 亲子线压住 ----\n     一条线 = 一句「先点的人 → 后点的人」的血缘声明，中点挂一个小标签说明是什么关系。\n     两端各留出 SYM 的空档，线不压到符号上。 */\n  let kins = '';\n  (state.kins || []).forEach(k => {\n    const p1 = pos[k.a], p2 = pos[k.b];\n    if (!p1 || !p2) return;\n    const t = KIN_TYPE[k.type] || KIN_TYPE.custom;\n    const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy) || 1;\n    const ux = dx / len, uy = dy / len;\n    const gp = Math.min(SYM + 7, Math.max(0, (len - 26) / 2));\n    const x1 = p1.x + ux * gp, y1 = p1.y + uy * gp;\n    const x2 = p2.x - ux * gp, y2 = p2.y - uy * gp;\n    const dash = t.draw === 'dash' ? ' stroke-dasharray=\"9 5\"'\n      : t.draw === 'dashdot' ? ' stroke-dasharray=\"10 4 2 4\"'\n        : t.draw === 'dot' ? ' stroke-dasharray=\"2 5\"' : '';\n    const line = o =>\n      `<path d=\"M${(x1 + (uy * o)).toFixed(1)} ${(y1 - (ux * o)).toFixed(1)} L${(x2 + (uy * o)).toFixed(1)} ${(y2 - (ux * o)).toFixed(1)}\" ` +\n      `stroke=\"${t.color}\" stroke-width=\"1.7\" fill=\"none\" stroke-linecap=\"round\"${dash}/>`;\n    if (t.draw === 'double') kins += line(-3) + line(3);\n    else kins += line(0);\n    // 箭头指向「后点的人」，让「生 / 被生」这类方向一眼看得出来；兄弟姐妹是对称的，不画箭头\n    if (t.draw !== 'double') {\n      const a = 9, w = 5.2;\n      kins += `<path d=\"M${x2.toFixed(1)} ${y2.toFixed(1)} L${(x2 - ux * a + uy * w).toFixed(1)} ${(y2 - uy * a - ux * w).toFixed(1)} L${(x2 - ux * a - uy * w).toFixed(1)} ${(y2 - uy * a + ux * w).toFixed(1)} Z\" fill=\"${t.color}\"/>`;\n    }\n    // 中点标签；两人挨得近时（标签比两个符号之间的空档还宽）把标签挑到线的一侧，免得压住符号\n    const text = kinLabel(k);\n    const lw = Math.max(34, text.length * 11.4 + 14), lh = 19;\n    let mx = (x1 + x2) / 2, my = (y1 + y2) / 2;\n    if (lw > len - 2 * (SYM + 4)) { mx += uy * (lh / 2 + 5); my -= ux * (lh / 2 + 5); }\n    kins += `<g class=\"kin-chip\" data-kin=\"${k.id}\" style=\"cursor:pointer\">` +\n      `<rect x=\"${(mx - lw / 2).toFixed(1)}\" y=\"${(my - lh / 2).toFixed(1)}\" width=\"${lw.toFixed(1)}\" height=\"${lh}\" rx=\"9.5\" ` +\n      `fill=\"rgba(255,255,255,0.94)\" stroke=\"${t.color}\" stroke-width=\"1.2\"/>` +\n      `<text x=\"${mx.toFixed(1)}\" y=\"${(my + 0.5).toFixed(1)}\" font-size=\"11.5\" fill=\"${t.color}\" text-anchor=\"middle\" ` +\n      `dominant-baseline=\"central\" font-family='${FONT}'>${esc(text)}<\/text><\/g>`;\n  });\n  out += `<g>${kins}<\/g>`;\n\n  /* ---- 成员 ---- */\n  let nodes = '';\n  state.people.forEach(p => {\n    const q = pos[p.id];\n    if (!q) return;\n    const isSel = isSelected(p.id);\n    let label = currentTerm(p);\n    if (p.id === state.focalId && !p.term) label = '我';\n    const nm = displayName(p);\n    const dates = [p.born, p.died].filter(Boolean).join('–');\n    let txt = '';\n    // 非导出时给文字挂上 data-inline，画布上双击即可直接改\n    const hit = forExport ? '' : ' pointer-events=\"visiblePainted\" style=\"pointer-events:auto;cursor:text\"';\n    if (label) txt += `<text x=\"0\" y=\"${-SYM - 12}\" font-size=\"12.5\" fill=\"#2f6fd0\" text-anchor=\"middle\" font-family='${FONT}' font-weight=\"600\"${forExport ? '' : ' data-inline=\"term\"'}${hit}>${esc(label)}<\/text>`;\n    txt += `<text x=\"0\" y=\"${SYM + 20}\" font-size=\"14\" font-weight=\"600\" fill=\"${p.name ? '#1e2633' : '#9aa4b2'}\" text-anchor=\"middle\" font-family='${FONT}'${forExport ? '' : ' data-inline=\"name\"'}${hit}>${esc(nm)}<\/text>`;\n    if (dates) txt += `<text x=\"0\" y=\"${SYM + 36}\" font-size=\"11\" fill=\"#7b8798\" text-anchor=\"middle\" font-family='${FONT}'>${esc(dates)}<\/text>`;\n    if (ui.showNote && p.note) {\n      const short = p.note.length > 18 ? p.note.slice(0, 18) + '…' : p.note;\n      txt += `<text x=\"0\" y=\"${SYM + 51}\" font-size=\"10.5\" fill=\"#9aa4b2\" text-anchor=\"middle\" font-family='${FONT}'>${esc(short)}<\/text>`;\n    }\n    // 入赘徽标：符号左下角一个小圆章「赘」\n    if (isRuzhui(p.id)) {\n      const bx = -SYM - 3, by = SYM + 3;\n      txt += `<g><circle cx=\"${bx}\" cy=\"${by}\" r=\"8.5\" fill=\"#fff\" stroke=\"#e0a30b\" stroke-width=\"1\"/>` +\n        `<text x=\"${bx}\" y=\"${by}\" font-size=\"10.5\" font-weight=\"700\" fill=\"#b45309\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family='${FONT}'>赘<\/text><\/g>`;\n    }\n    // 选中环：non-scaling-stroke 让线宽不随缩放变细，缩到很小也看得见谁被选中\n    const selRing = (!forExport && isSel)\n      ? `<rect class=\"sel-ring\" style=\"display:block\" x=\"${-SYM - 11}\" y=\"${-SYM - 11}\" width=\"${(SYM + 11) * 2}\" height=\"${(SYM + 11) * 2}\" rx=\"13\" fill=\"none\" stroke=\"#2f6fd0\" stroke-width=\"2.5\" stroke-dasharray=\"5 4\" vector-effect=\"non-scaling-stroke\"/>`\n      : '';\n    const bub = forExport ? '' : bubbles(p.id);\n    nodes += `<g class=\"fam-node${isSel ? ' sel' : ''}\" data-id=\"${p.id}\" transform=\"translate(${q.x.toFixed(1)},${q.y.toFixed(1)})\">` +\n      `<rect class=\"hit\" x=\"${-SYM - 14}\" y=\"${-SYM - 16}\" width=\"${(SYM + 14) * 2}\" height=\"${(SYM + 16) * 2 + 46}\" rx=\"10\" fill=\"transparent\"/>` +\n      selRing + symbolMarkup(p, 0, 0) + txt + bub + `<\/g>`;\n  });\n  out += `<g>${nodes}<\/g>`;\n\n  /* ---- 图例 ---- */\n  if (opts.legend) out += legendMarkup(b);\n\n  return { markup: out, bounds: b };\n}\nfunction hasCrossing(c, pos) {\n  const pa = pos[c.a], pb = pos[c.b];\n  if (!pa || !pb || Math.abs(pa.y - pb.y) > 1) return false;\n  return state.people.some(p => pos[p.id] && Math.abs(pos[p.id].y - pa.y) < 1 &&\n    pos[p.id].x > Math.min(pa.x, pb.x) + SYM && pos[p.id].x < Math.max(pa.x, pb.x) - SYM);\n}\nfunction safeKin(focalId, targetId) {\n  try { return Kin.term(KinGraph, focalId, targetId); } catch (e) { return null; }\n}\n/**\n * 某人此刻显示的称呼：手工填写的优先，其次自动推算，最后（中心人物）显示「我」。\n * 画布上双击改称呼时，就以它作为输入框的初值。\n */\nfunction currentTerm(p) {\n  if (!p) return '';\n  if (p.term) return p.term;\n  if (p.id === state.focalId) return '我';\n  if (!ui.showTerm || !state.focalId) return '';\n  const kin = safeKin(state.focalId, p.id);\n  return (kin && kin.ok && kin.term) ? kin.term : '';\n}\nfunction bubbles(id) {\n  const r = 10.5, d = SYM + 16;\n  const items = [\n    [-d, 0, 'addPartner', '配偶'],\n    [d, 0, 'addSibling', '兄弟姐妹'],\n    [0, -d, 'addParents', '父母'],\n    [0, d, 'addChild', '子女']\n  ];\n  return items.map(it =>\n    `<g class=\"bubble\" data-bubble=\"${it[2]}\" data-id=\"${id}\" transform=\"translate(${it[0]},${it[1]})\">` +\n    `<circle r=\"${r}\"/><text y=\"0.5\">+<\/text><title>添加${it[3]}<\/title><\/g>`).join('');\n}\n\nfunction legendMarkup(b) {\n  const used = { M: false, F: false, U: false, dec: false, trans: false, gay: false };\n  const conds = [];\n  state.people.forEach(p => {\n    if (p.gender === GENDER_M) used.M = true;\n    if (p.gender === GENDER_F) used.F = true;\n    if (p.gender === GENDER_U) used.U = true;\n    if (p.deceased) used.dec = true;\n    if (p.trans) used.trans = true;\n    if (p.orientation === 'gay') used.gay = true;\n    (p.conditions || []).forEach(c => { if (c.label && !conds.some(x => x.label === c.label)) conds.push(c); });\n  });\n  const W = 232, PAD = 14, LINE = 23;\n  let rows = 0;\n  let y = 0;\n  const item = (shapeSvg, text) => {\n    const s = `<g transform=\"translate(${PAD},${y})\">${shapeSvg}<text x=\"40\" y=\"5\" font-size=\"11.5\" fill=\"#5b6b82\" font-family='${FONT}'>${esc(text)}<\/text><\/g>`;\n    y += LINE; rows++;\n    return s;\n  };\n  let items = '';\n  if (used.M) items += item(LG.square(), '男性');\n  if (used.F) items += item(LG.circle(), '女性');\n  if (used.U) items += item(LG.diamond(), '性别未知 / 未填');\n  if (used.dec) items += item(LG.square() + `<path d=\"M5.5 -7.5 L20.5 7.5 M20.5 -7.5 L5.5 7.5\" stroke=\"#33415c\" stroke-width=\"2\" stroke-linecap=\"round\"/>`, '已故');\n  if (used.trans) items += item(`<circle cx=\"13\" cy=\"0\" r=\"7\" fill=\"none\" stroke=\"#33415c\" stroke-width=\"1.7\"/><rect x=\"6\" y=\"-7\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"#33415c\" stroke-width=\"1.7\"/>`, '跨性别标记（内嵌图形）');\n  if (used.gay) items += item(`<rect x=\"4\" y=\"-9\" width=\"18\" height=\"18\" rx=\"1.5\" fill=\"none\" stroke=\"#33415c\" stroke-width=\"1.7\" stroke-opacity=\".25\"/><path d=\"M13 -5.5 L19 6 L7 6 Z\" fill=\"#33415c\"/>`, '同性恋标记（实心三角）');\n  conds.forEach(c => items += item(`<rect x=\"4\" y=\"-9\" width=\"18\" height=\"18\" rx=\"1.5\" fill=\"${c.color}\" stroke=\"#33415c\" stroke-width=\"1.4\"/>`, c.label));\n\n  const cSt = [];\n  const usedStatus = new Set(state.couples.map(c => c.status || 'married'));\n  const statusSvg = { married: 'solid', cohabit: 'dash', engaged: 'dot', separated: 'slash1', divorced: 'slash2', widowed: 'slash1' };\n  usedStatus.forEach(s => {\n    const st = COUPLE_STATUS[s]; if (!st) return;\n    let g = `<path d=\"M2 0 L30 0\" stroke=\"#33415c\" stroke-width=\"1.8\" ${st.draw === 'dash' ? 'stroke-dasharray=\"8 6\"' : st.draw === 'dot' ? 'stroke-dasharray=\"2 5\"' : ''}/>`;\n    if (st.draw === 'slash1' || st.draw === 'slash2') {\n      const n = st.draw === 'slash2' ? 2 : 1;\n      for (let i = 0; i < n; i++) { const ox = 16 + (i - (n - 1) / 2) * 9; g += `<path d=\"M${ox - 5} 6 L${ox + 5} -6\" stroke=\"#33415c\" stroke-width=\"2\"/>`; }\n    }\n    if (st.draw === 'dot') g += `<circle cx=\"16\" cy=\"0\" r=\"3\" fill=\"#33415c\"/>`;\n    cSt.push(item(g, '夫妻：' + st.label));\n  });\n  const usedPT = new Set(state.links.map(l => l.type || 'bio'));\n  usedPT.forEach(t => {\n    const pt = PARENT_TYPE[t]; if (!pt) return;\n    const dash = lineDash(pt.draw);\n    let g = `<path d=\"M16 -10 L16 2 M5 2 L27 2 M16 2 L16 12\" stroke=\"#33415c\" stroke-width=\"1.8\" fill=\"none\" ${dash ? `stroke-dasharray=\"${dash}\"` : ''}/>`;\n    cSt.push(item(g, '亲子：' + pt.label));\n  });\n  if (state.people.some(p => isRuzhui(p.id))) {\n    cSt.push(item(`<g><circle cx=\"16\" cy=\"0\" r=\"8.5\" fill=\"#fff\" stroke=\"#e0a30b\"/>` +\n      `<text x=\"16\" y=\"0\" font-size=\"10.5\" font-weight=\"700\" fill=\"#b45309\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family='${FONT}'>赘<\/text><\/g>`,\n      '赘：入赘（男到女家，门户按女方算）'));\n  }\n  if (faintNatalOn() && lastFaintLinks) {\n    cSt.push(item(`<path d=\"M2 6 Q16 -6 30 6\" stroke=\"#b3c3d8\" stroke-width=\"1.5\" stroke-dasharray=\"5 6\" fill=\"none\"/>`,\n      '淡虚线：出嫁 / 入赘者从本家姊妹位绕到夫家'));\n  }\n  const usedB = new Set(state.bonds.map(b => b.type));\n  usedB.forEach(t => {\n    const bt = BOND_TYPE[t]; if (!bt) return;\n    const dash = t === 'distant' ? 'stroke-dasharray=\"7 6\"' : '';\n    cSt.push(item(`<path d=\"M3 6 Q16 -10 29 6\" stroke=\"${bt.color}\" stroke-width=\"2\" fill=\"none\" ${dash}/>`, '情感：' + bt.label));\n  });\n  const usedK = new Set((state.kins || []).map(k => k.type));\n  usedK.forEach(t => {\n    const kt = KIN_TYPE[t]; if (!kt) return;\n    const dash = kt.draw === 'dash' ? 'stroke-dasharray=\"9 5\"'\n      : kt.draw === 'dashdot' ? 'stroke-dasharray=\"10 4 2 4\"'\n        : kt.draw === 'dot' ? 'stroke-dasharray=\"2 5\"' : '';\n    const seg = `stroke=\"${kt.color}\" stroke-width=\"1.7\" fill=\"none\" ${dash}`;\n    const g = kt.draw === 'double'\n      ? `<path d=\"M2 3 L30 3\" ${seg}/><path d=\"M2 9 L30 9\" ${seg}/>`\n      : `<path d=\"M2 6 L27 6\" ${seg}/><path d=\"M30 6 L26 3.2 L26 8.8 Z\" fill=\"${kt.color}\"/>`;\n    cSt.push(item(g, '血缘：' + (t === 'custom' ? '自定义（自定辈分差）' : kt.label)));\n  });\n\n  const totalRows = rows;\n  const H = 46 + totalRows * LINE + 8;\n  const x = b.x1 + 20 - W;\n  const y0 = Math.max(b.y0, b.y1 - H);\n  ui.legendBox = { x: x, y: y0, w: W, h: H };\n  return `<g transform=\"translate(${x.toFixed(1)},${y0.toFixed(1)})\">` +\n    `<rect x=\"0\" y=\"0\" width=\"${W}\" height=\"${H}\" rx=\"10\" fill=\"rgba(255,255,255,0.95)\" stroke=\"#dbe1ea\"/>` +\n    `<text x=\"${PAD}\" y=\"21\" font-size=\"13\" font-weight=\"700\" fill=\"#1e2633\" font-family='${FONT}'>图例<\/text>` +\n    `<line x1=\"${PAD}\" y1=\"29\" x2=\"${W - PAD}\" y2=\"29\" stroke=\"#e6ebf3\"/>` +\n    `<g transform=\"translate(0,34)\">${items}${cSt.join('')}<\/g><\/g>`;\n}\n\n/** 整幅图（含图例）的包围盒 */\nfunction fullBounds() {\n  const b = ui.bounds || { x0: 0, y0: 0, x1: 600, y1: 400 };\n  const l = ui.legendBox;\n  if (!l || !ui.showLegend) return b;\n  return {\n    x0: Math.min(b.x0, l.x), y0: Math.min(b.y0, l.y),\n    x1: Math.max(b.x1, l.x + l.w), y1: Math.max(b.y1, l.y + l.h)\n  };\n}\n\n/** 把整幅图渲染进 #svg（带平移缩放） */\nfunction render() {\n  const svg = $('#svg');\n  ui.layout = ui.layout || computeLayout();\n  const r = contentMarkup({ legend: ui.showLegend });\n  svg.setAttribute('viewBox', `0 0 ${svg.clientWidth || 800} ${svg.clientHeight || 600}`);\n  svg.innerHTML = `<g transform=\"translate(${view.x.toFixed(2)},${view.y.toFixed(2)}) scale(${view.zoom})\">${r.markup}<\/g>`;\n  svg.classList.toggle('tool-add', ui.tool === 'add');\n  svg.classList.toggle('tool-bond', ui.tool === 'bond');\n  svg.classList.toggle('tool-kin', ui.tool === 'kin');\n  svg.classList.toggle('tool-hand', ui.tool === 'hand');\n  $('#zPct').textContent = Math.round(view.zoom * 100) + '%';\n  if (typeof closeInline === 'function') closeInline();   // 重绘后原来的就地编辑框位置就不准了\n  if (typeof applyLock === 'function') applyLock();        // 锁定状态可能刚被撤销/载入改变\n  renderInspector();\n}\n/** 屏幕坐标 → 世界坐标 */\nfunction toWorld(clientX, clientY) {\n  const r = $('#svg').getBoundingClientRect();\n  return { x: (clientX - r.left - view.x) / view.zoom, y: (clientY - r.top - view.y) / view.zoom };\n}\n\nfunction fitView(padding) {\n  const svg = $('#svg');\n  const b = fullBounds(); if (!b) return;\n  const pad = padding == null ? 60 : padding;\n  const vw = svg.clientWidth || 900, vh = svg.clientHeight || 620;\n  const w = b.x1 - b.x0, h = b.y1 - b.y0;\n  const z = Math.min(vw / (w + pad * 2), vh / (h + pad * 2));\n  view.zoom = Math.max(0.15, Math.min(2.2, z));\n  view.x = (vw - w * view.zoom) / 2 - b.x0 * view.zoom;\n  view.y = (vh - h * view.zoom) / 2 - b.y0 * view.zoom;\n  render();\n}\nfunction zoomAt(cx, cy, factor) {\n  const z2 = Math.max(0.1, Math.min(4, view.zoom * factor));\n  const k = z2 / view.zoom;\n  view.x = cx - (cx - view.x) * k;\n  view.y = cy - (cy - view.y) * k;\n  view.zoom = z2;\n  render();\n}\n\n\n/* ===== app-ui.js ===== */\n/* ==========================================================================\n   家谱编辑器 · 界面交互 / 属性面板 / 存档导出\n   ========================================================================== */\n\nlet saveTimer = null;\n\n/* ==========================================================================\n   历史记录\n   ========================================================================== */\nfunction snapshot() { return JSON.stringify(state); }\nfunction pushHistory() {\n  const s = snapshot();\n  if (history.stack[history.index] === s) { updateUndoBtns(); return; }\n  history.stack = history.stack.slice(0, history.index + 1);\n  history.stack.push(s);\n  if (history.stack.length > 80) history.stack.shift();\n  history.index = history.stack.length - 1;\n  updateUndoBtns();\n}\nfunction undo() {\n  if (guard()) return;\n  if (history.index <= 0) return;\n  history.index--;\n  state = JSON.parse(history.stack[history.index]);\n  pruneSelection();\n  ui.structVer = (ui.structVer || 0) + 1;\n  relayoutRender(); saveDraft(); updateUndoBtns();\n}\nfunction redo() {\n  if (guard()) return;\n  if (history.index >= history.stack.length - 1) return;\n  history.index++;\n  state = JSON.parse(history.stack[history.index]);\n  pruneSelection();\n  ui.structVer = (ui.structVer || 0) + 1;\n  relayoutRender(); saveDraft(); updateUndoBtns();\n}\nfunction updateUndoBtns() {\n  $('#btnUndo').disabled = history.index <= 0;\n  $('#btnRedo').disabled = history.index >= history.stack.length - 1;\n}\n\n/* ==========================================================================\n   渲染与提交\n   ========================================================================== */\nfunction relayoutRender() {\n  ui.layout = computeLayout();\n  render();\n}\n/** 结构性改动（增删成员、改动关系）后调用 */\nfunction commit(opts) {\n  ui.structVer = (ui.structVer || 0) + 1;\n  if (ui.bounds && !(opts && opts.keepView)) relayoutRender(); else relayoutRender();\n  pushHistory();\n  saveDraft();\n}\n/** 仅数据字段变化（改名、改年份），重绘但不重排 */\nfunction touch() {\n  render(); saveDraft();\n}\n\n/** 草稿按文件分格存放：导出的可编辑副本各存各的，不会互相覆盖，也不会盖掉编辑器本身的草稿 */\nfunction draftKey() { return 'jiapu:draft:' + DOC_ID; }\nfunction saveDraft() {\n  clearTimeout(saveTimer);\n  saveTimer = setTimeout(() => {\n    // 面板里打字改字段（姓名、年份、排行…）也要能撤销：\n    // 停顿 500ms 记一步，连打不会碎成一堆撤销点；内容没变时 pushHistory 内部会跳过\n    pushHistory();\n    try { localStorage.setItem(draftKey(), snapshot()); } catch (e) { }\n  }, 500);\n}\nfunction loadDraft() {\n  try {\n    let s = localStorage.getItem(draftKey());\n    // 兼容老版本：以前所有草稿都挤在 'jiapu:draft' 这一个格子里，搬一次过去\n    if (!s && DOC_ID === 'main') {\n      s = localStorage.getItem('jiapu:draft');\n      if (s) localStorage.setItem(draftKey(), s);\n    }\n    if (!s) return null;\n    const d = JSON.parse(s);\n    // 老版本存下来的草稿没有 kins 这一张表，补一个空数组，免得后面到处判空\n    if (d && Array.isArray(d.people)) { if (!Array.isArray(d.kins)) d.kins = []; return d; }\n  } catch (e) { }\n  return null;\n}\n\n/* ==========================================================================\n   仅查看（锁定）\n   ========================================================================== */\n/** 把锁定状态同步到界面：顶栏按钮、画布横幅、被禁用的入口 */\nfunction applyLock() {\n  const on = locked();\n  document.body.classList.toggle('locked', on);\n  const lab = $('#btnLockLabel');\n  if (lab) lab.textContent = on ? '已锁定' : '仅查看';\n  const b = $('#btnLock');\n  if (b) b.title = on ? '当前已锁定为「仅查看」，点这里解除'\n    : '锁定为「仅查看」，防止自己或别人误改（会随文件一起保存）';\n  if (on && ui.tool !== 'select') { ui.tool = 'select'; ui.bondFrom = null; ui.kinFrom = null; syncToolButtons(); }\n  const tidy = $('#btnTidy'); if (tidy) tidy.disabled = on;\n  const t = $('#docTitle'); if (t) t.readOnly = on;\n  syncViewChecks();\n}\n/** 把 state 里的显示开关同步回左侧「视图」复选框（撤销、打开文件后也要对得上） */\nfunction syncViewChecks() {\n  const g = $('#chkShowGhost');\n  if (g) g.checked = faintNatalOn();\n}\nfunction setLock(on) {\n  if (!state) return;\n  state.locked = !!on;\n  applyLock();\n  render();\n  renderInspector(true);\n  if (on) toast('已锁定为「仅查看」：家谱只能平移、缩放与导出；保存后文件打开也是只读', 3200);\n  else toast('已解除锁定，可以继续编辑');\n  saveDraft();\n}\nfunction toggleLock() {\n  if (!locked()) return setLock(true);\n  confirmModal('解除锁定', '确定要解除「仅查看」状态，恢复编辑吗？解除后所有改动都能正常保存。', () => setLock(false));\n}\n\n/* ==========================================================================\n   选择与属性面板\n   ========================================================================== */\nfunction select(id) {\n  setSelection(id ? [id] : [], id);\n  render();\n  renderInspector(true);\n}\nfunction inspectorKey() {\n  return (ui.selSet || []).join(',') + '|' + (ui.sel || '-') + '|' + (ui.structVer || 0) + '|' + (state.focalId || '-');\n}\n/** 只描述「面板该显示谁」：选中集合 + 中心人物，不含数据版本 */\nfunction inspectorSelKey() {\n  return (ui.selSet || []).join(',') + '|' + (ui.sel || '-') + '|' + (state.focalId || '-');\n}\nfunction renderInspector(force) {\n  // 用户正在面板的某个输入框里打字时，不要重建面板：重建会把输入框整个换掉，\n  // 光标位置随之丢失（回到最前），后面敲的数字就全被插到前面去了。\n  // 但「选中的人变了」是另一回事——那种时候必须重建，否则点到别人身上面板还停在原来那位。\n  const act = document.activeElement;\n  const typing = !!(act && act.dataset && act.dataset.f && $('#inspContent').contains(act));\n  const skey = inspectorSelKey();\n  const selChanged = ui._inspSelKey !== skey;\n\n  const key = inspectorKey();\n  if (!force && ui._inspKey === key) return;\n  if (!force && typing && !selChanged) return;   // 只是数据版本变了（比如正在填出生年），保住光标\n  ui._inspKey = key;\n  ui._inspSelKey = skey;\n\n  // 换成另一个人了就不再把光标塞回原来那个字段——用户是在选人，不是接着填表\n  const holdFocus = typing && !selChanged;\n  const f = holdFocus ? act.dataset.f : null;\n  const selStart = holdFocus ? caretOf(act) : null;\n  const val = holdFocus ? act.value : null;\n\n  const multi = (ui.selSet || []).length > 1;\n  const p = ui.sel ? person(ui.sel) : null;\n  $('#inspContent').innerHTML = multi ? multiInspector() : (p ? personInspector(p) : docInspector());\n\n  // 仅查看状态下，面板里的一切可改控件一律禁用（名单跳转之类的只读操作保留）\n  if (locked()) {\n    $$('#inspContent input, #inspContent select, #inspContent textarea, #inspContent button').forEach(el => {\n      el.disabled = true;\n    });\n    $('#inspContent').insertAdjacentHTML('afterbegin',\n      `<div class=\"lock-note\">仅查看模式 · 面板暂时不可编辑<\/div>`);\n  }\n\n  if (f && val != null) {\n    const el = $(`#inspContent [data-f=\"${f}\"]`);\n    if (el) {\n      el.focus();\n      if (selStart != null) { try { el.setSelectionRange(selStart, selStart); } catch (e) { } }\n    }\n  }\n}\n/** 取输入框的光标位置；个别类型（number）不支持该 API，取不到就返回 null 而不是 0 */\nfunction caretOf(el) {\n  try { return typeof el.selectionStart === 'number' ? el.selectionStart : null; }\n  catch (e) { return null; }\n}\n\nconst RANK_WORD = ['', '老大', '老二', '老三', '老四', '老五', '老六', '老七', '老八', '老九', '老十'];\nfunction rankWord(id) {\n  if (!siblingsOf(id).length) return '独子';\n  const r = rankPos(id);\n  return RANK_WORD[r] || ('排行第 ' + r);\n}\nfunction genderLabel(p) {\n  const base = p.gender === GENDER_M ? '男' : p.gender === GENDER_F ? '女' : '性别未填';\n  const extra = [];\n  if (p.trans) extra.push(p.gender === GENDER_M ? '跨性别（女→男）' : '跨性别（男→女）');\n  if (p.orientation === 'gay') extra.push('同性恋');\n  return base + (extra.length ? ' · ' + extra.join(' · ') : '');\n}\n\nfunction docInspector() {\n  const n = state.people.length, c = state.couples.length, l = state.links.length;\n  if (!n) {\n    return `<div class=\"insp-empty\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\"><path d=\"M12 3v5M6 21v-3h12v3\"/><circle cx=\"5\" cy=\"6\" r=\"3\"/><circle cx=\"19\" cy=\"6\" r=\"3\"/><circle cx=\"12\" cy=\"17\" r=\"3.4\"/><\/svg>\n      <b>还没有成员<\/b>\n      左侧点「添加成员」，然后在画布上点击即可放置。\n    <\/div>`;\n  }\n  const foc = state.focalId ? person(state.focalId) : null;\n  return `<div class=\"insp-head\"><div class=\"who\"><b>${esc(state.title || '我的家谱')}<\/b>\n      <span>共 ${n} 位成员 · ${c} 对夫妻 · ${l} 条亲子线<\/span><\/div><\/div>\n    <div class=\"insp-body\">\n      <div class=\"kin-card\">\n        <div style=\"font-size:12px;color:#6b7688\">中心人物（推算称呼的基准「我」）<\/div>\n        <div class=\"big\">${foc ? esc(displayName(foc)) : '尚未指定'}<\/div>\n        <div class=\"sub\">选中任意成员后，点左侧「设为中心人物」即可切换。<\/div>\n      <\/div>\n      <div class=\"section\">\n        <h4>怎么开始<\/h4>\n        <div class=\"empty-note\">\n          1. 在画布上单击选中一个人；在空白处拖出方框可以一次选中一片（Shift 追加）；<br>\n          2. 用选中节点四周的蓝色 <b>+<\/b> 号，向上加父母、向左右加配偶与兄弟姐妹、向下加子女；<br>\n          3. 拖动节点可微调位置，点「自动排列」重新排布（以中心人物推算辈分，同辈同行；父系为主线，夫左妻右）；<br>\n          4. 在右侧填写姓名、性别、生卒年，可自动推算亲属称呼。\n        <\/div>\n      <\/div>\n      <div class=\"section\">\n        <h4>关系线怎么改<\/h4>\n        <div class=\"empty-note\">选中成员后，在「关系」一栏的下拉框里可直接把夫妻线改成离异／同居／分居，把亲子线改成收养／寄养／继子女。<\/div>\n      <\/div>\n    <\/div>`;\n}\n\n/** 框选多人时的面板：名单 + 批量操作 */\nfunction multiInspector() {\n  const ids = (ui.selSet || []).filter(id => person(id));\n  const gens = {};\n  ids.forEach(id => {\n    const g = (ui.layout && ui.layout.gen) ? ui.layout.gen.get(id) : null;\n    if (g != null) gens[g] = (gens[g] || 0) + 1;\n  });\n  const spread = Object.keys(gens).sort((a, b) => a - b)\n    .map(g => `${g} 代 ×${gens[g]}`).join('、');\n\n  let h = `<div class=\"insp-head\"><div class=\"who\"><b>已选中 ${ids.length} 位成员<\/b>\n    <span>${spread ? '分布：' + spread : '多选状态'}<\/span><\/div><\/div><div class=\"insp-body\">\n    <div class=\"hint-sm\" style=\"margin:0 0 10px\">拖动其中任意一位，选中的人会一起移动；按 <b>Delete<\/b> 一起删除。\n      按住 <b>Shift<\/b> 再框选可以追加，Shift 单击可以逐个增减。<\/div>`;\n\n  h += `<div class=\"section\" style=\"border-top:0;margin-top:0;padding-top:0\">\n    <h4>名单<span class=\"count\">点击可只看这一位<\/span><\/h4>\n    <div style=\"max-height:230px;overflow:auto\">`;\n  ids.forEach(id => {\n    const p = person(id);\n    const kin = (state.focalId && state.focalId !== id) ? safeKin(state.focalId, id) : null;\n    h += `<div class=\"kv\" style=\"cursor:pointer\" data-mpick=\"${id}\">\n      <span class=\"dot\" style=\"background:${p.gender === 'F' ? '#d4628f' : p.gender === 'M' ? '#4a7fd4' : '#7b8798'}\"><\/span>\n      <span class=\"nm\">${esc(displayName(p))}<\/span>\n      <span class=\"rel\">${esc(kin && kin.term ? kin.term : '')}<\/span><\/div>`;\n  });\n  h += `<\/div><\/div>`;\n\n  h += `<div class=\"section\"><h4>批量修改<\/h4>\n    <div class=\"field\"><label>性别<\/label><div class=\"seg\">\n      <button data-mact=\"gender\" data-g=\"M\">男<\/button>\n      <button data-mact=\"gender\" data-g=\"F\">女<\/button>\n      <button data-mact=\"gender\" data-g=\"U\">未填<\/button>\n    <\/div><\/div>\n    <div class=\"field\"><label>给这几位一起加一条彩色标记<\/label>\n      <div class=\"cond-row\">\n        <input type=\"text\" id=\"mCondLabel\" placeholder=\"如：高血压\">\n        <input type=\"color\" id=\"mCondColor\" value=\"${COND_COLORS[ids.length % COND_COLORS.length]}\">\n        <button class=\"btn sm\" data-mact=\"cond\">添加<\/button>\n      <\/div>\n      <div class=\"hint-sm\">标记会加到每一位成员身上，导出图片时按图例显示。<\/div>\n    <\/div>\n    <div class=\"field\"><label>整体微调位置<\/label>\n      <div class=\"seg\">\n        <button data-mact=\"up\">上移<\/button>\n        <button data-mact=\"down\">下移<\/button>\n        <button data-mact=\"left\">左移<\/button>\n        <button data-mact=\"right\">右移<\/button>\n      <\/div>\n      <div class=\"hint-sm\">与直接拖动一样，属于手动微调；点「自动排列」会全部归位。<\/div>\n    <\/div>\n  <\/div>`;\n\n  h += `<div class=\"section\">\n    <button class=\"link-add\" data-mact=\"clear\">取消选择<\/button>\n    <button class=\"link-add\" style=\"margin-top:8px;border-color:#f3c6c6;color:#b91c1c;background:#fef6f6\" data-mact=\"delete\">删除这 ${ids.length} 位成员<\/button>\n  <\/div><\/div>`;\n  return h;\n}\n\nfunction personInspector(p) {\n  const kin = state.focalId ? safeKin(state.focalId, p.id) : null;\n  const isFocal = state.focalId === p.id;\n  const parents = parentsOf(p.id);\n  const spouses = couplesOf(p.id);\n  const kids = childrenOf(p.id);\n  const sibs = siblingsOf(p.id);\n  const bonds = state.bonds.filter(b => b.a === p.id || b.b === p.id);\n\n  let h = `<div class=\"insp-head\">\n    <div class=\"mini\">${miniSymbol(p, 30)}<\/div>\n    <div class=\"who\"><b>${esc(displayName(p))}<\/b>\n      <span>${genderLabel(p)}${isFocal ? ' · 中心人物' : ''}<\/span><\/div>\n  <\/div><div class=\"insp-body\">`;\n\n  if (kin && kin.term && !isFocal) {\n    h += `<div class=\"kin-card\">\n      <div style=\"font-size:11.5px;color:#6b7688\">${esc(displayName(person(state.focalId)))} 应称其为<\/div>\n      <div class=\"big\">${esc(kin.term)}<\/div>\n      ${kin.note ? `<div class=\"sub\">${esc(kin.note)}<\/div>` : ''}\n      ${kin.path ? `<div class=\"alt\">关系路径：${esc(kin.path)}<\/div>` : ''}\n    <\/div>`;\n  } else if (isFocal) {\n    h += `<div class=\"kin-card\"><div class=\"big\">我（本人）<\/div>\n      <div class=\"sub\">全谱以该成员为基准推算亲属称呼。<\/div><\/div>`;\n  } else if (!state.focalId) {\n    h += `<div class=\"kin-card\"><div style=\"font-size:12.5px;color:#6b7688\">尚未设定中心人物，无法推算称呼。<\/div><\/div>`;\n  }\n\n  /* 基本信息 */\n  h += `<div class=\"field\"><label>姓名 / 称呼<\/label>\n    <input type=\"text\" data-f=\"name\" value=\"${esc(p.name)}\" placeholder=\"如：刘××，或直接写「爷爷」\"><\/div>`;\n  h += `<div class=\"field\"><label>节点上显示的称呼（留空则自动推算）<\/label>\n    <div class=\"term-row\">\n      <input type=\"text\" data-f=\"term\" value=\"${esc(p.term || '')}\" placeholder=\"${esc(currentTerm(p) && !p.term ? '现在是自动：' + currentTerm(p) : '如：大伯（老派：大大）')}\">\n      ${p.term ? '<button type=\"button\" class=\"btn sm ghost\" data-act=\"term-auto\" title=\"清空手填的称呼，改回自动推算\">恢复自动<\/button>' : ''}\n    <\/div>\n    <div class=\"hint-sm\">也可以直接在画布上<b>双击节点上的蓝色称呼<\/b>就地修改；清空＝回到自动推算。<\/div>\n  <\/div>`;\n  h += `<div class=\"field\"><label>性别<\/label><div class=\"seg\">\n      <button data-g=\"M\" class=\"${p.gender === 'M' ? 'on' : ''}\">男<\/button>\n      <button data-g=\"F\" class=\"${p.gender === 'F' ? 'on' : ''}\">女<\/button>\n      <button data-g=\"U\" class=\"${p.gender === 'U' ? 'on' : ''}\">未填<\/button>\n    <\/div><\/div>`;\n  h += `<div class=\"row2\">\n      <div class=\"field\"><label>出生年<\/label><input type=\"text\" inputmode=\"numeric\" autocomplete=\"off\" data-f=\"born\" value=\"${esc(p.born)}\" placeholder=\"1935\"><\/div>\n      <div class=\"field\"><label>去世年<\/label><input type=\"text\" inputmode=\"numeric\" autocomplete=\"off\" data-f=\"died\" value=\"${esc(p.died)}\" placeholder=\"—\"><\/div>\n    <\/div>`;\n  const auto = autoRank(p.id), sibs0 = siblingsOf(p.id), myBorn = bornYear(p.id), myRank = manualRank(p.id);\n  const nPeers = sibs0.length + 1;\n  let rankHint;\n  if (myRank != null && myBorn != null) {\n    rankHint = `已填出生年，同辈排序以<b>出生年<\/b>为准；这条排行只在别人年龄缺失时用来比长幼。`;\n  } else if (myRank != null) {\n    rankHint = `本人没填出生年，同辈就按这条排行排位（1 ＝ 最大），年龄大的始终排在前面。`;\n  } else if (myBorn != null) {\n    rankHint = `留空即按出生年在同辈（${nPeers} 人）中自动排位${auto != null ? '，当前推算第 ' + auto + ' 位' : ''}。`;\n  } else {\n    rankHint = `填上排行，同辈就按它排序（1 ＝ 最大）；留空且没有出生年时，称呼里的长幼会并列显示，如「伯父 / 叔父」。`;\n  }\n  h += `<div class=\"field\"><label>兄弟排行${sibs0.length ? '（同辈 ' + nPeers + ' 人）' : ''}<\/label>\n    <input type=\"text\" inputmode=\"numeric\" autocomplete=\"off\" data-f=\"rank\" value=\"${esc(p.rank)}\"\n      placeholder=\"${auto != null ? '按出生年推算：第 ' + auto + ' 位' : '1 ＝ 这一辈里最大'}\">\n    <div class=\"hint-sm\">${rankHint}<\/div>\n  <\/div>`;\n  h += `<label class=\"chk\"><input type=\"checkbox\" data-f=\"deceased\" ${p.deceased ? 'checked' : ''}>已故（符号加 ×）<\/label>`;\n  h += `<label class=\"chk\"><input type=\"checkbox\" data-f=\"trans\" ${p.trans ? 'checked' : ''}>跨性别（符号内嵌图形）<\/label>`;\n  h += `<label class=\"chk\"><input type=\"checkbox\" data-f=\"gay\" ${p.orientation === 'gay' ? 'checked' : ''}>同性恋（符号内实心三角）<\/label>`;\n  if (p.gender === GENDER_M) {\n    h += `<label class=\"chk\"><input type=\"checkbox\" data-f=\"ruzhui\" ${p.ruzhui ? 'checked' : ''}>赘 · 入赘（男到女家）<\/label>`;\n    h += `<div class=\"hint-sm\" style=\"margin:-3px 0 9px\">勾上后<b>门户按女方算<\/b>：这一对夫妻连子女一起画在女方一族里（仍是夫左妻右），他自己本家那边留一个姊妹位、用极淡虚线连过来，符号左下角加一个小圆章「赘」。这是<b>改门户归属<\/b>，整套排版会重排，取消勾选即恢复。<\/div>`;\n  }\n  h += `<div class=\"field\"><label>备注<\/label><textarea data-f=\"note\" placeholder=\"职业、住地、家族轶事…\">${esc(p.note)}<\/textarea><\/div>`;\n\n  /* 健康状况 / 彩色标记 */\n  h += `<div class=\"section\"><h4>健康状况 / 彩色标记<span class=\"count\">${(p.conditions || []).length}<\/span><\/h4>`;\n  (p.conditions || []).forEach((c, i) => {\n    h += `<div class=\"cond-row\">\n      <input type=\"color\" data-cond=\"${i}\" value=\"${c.color || '#4a7fd4'}\">\n      <input type=\"text\" data-condlabel=\"${i}\" value=\"${esc(c.label || '')}\" placeholder=\"如：高血压\">\n      <button class=\"btn sm\" data-conddel=\"${i}\" style=\"padding:3px 8px\">×<\/button>\n    <\/div>`;\n  });\n  h += `<button class=\"link-add\" data-act=\"addCond\">+ 添加彩色标记<\/button><\/div>`;\n\n  /* 亲属关系 */\n  h += `<div class=\"section\"><h4>亲属关系<\/h4>`;\n  if (parents.length) {\n    parents.forEach(pid => {\n      const q = person(pid);\n      h += `<div class=\"kv\"><span class=\"dot\" style=\"background:${q && q.gender === 'F' ? '#d4628f' : '#4a7fd4'}\"><\/span>\n        <span class=\"nm\" data-goto=\"${pid}\">${esc(displayName(q))}<\/span>\n        <span class=\"rel\">${q && q.gender === 'F' ? '母亲' : '父亲'}<\/span>\n        <button class=\"x\" data-unlink=\"${pid}\">×<\/button><\/div>`;\n    });\n  }\n  spouses.forEach(c => {\n    const oid = partnerIn(c, p.id), q = person(oid);\n    h += `<div class=\"kv\"><span class=\"dot\" style=\"background:${q && q.gender === 'F' ? '#d4628f' : '#4a7fd4'}\"><\/span>\n      <span class=\"nm\" data-goto=\"${oid}\">${esc(displayName(q))}<\/span>\n      <select data-cst=\"${c.id}\" style=\"font-size:11.5px;padding:2px 4px;border-radius:6px;border:1px solid #dbe1ea\">\n        ${Object.entries(COUPLE_STATUS).map(([k, v]) => `<option value=\"${k}\" ${c.status === k ? 'selected' : ''}>${v.label}<\/option>`).join('')}\n      <\/select>\n      <button class=\"x\" data-uncouple=\"${c.id}\">×<\/button><\/div>`;\n  });\n  sortSiblings(kids).forEach(k => {\n    const q = person(k);\n    const l = state.links.find(x => x.child === k);\n    h += `<div class=\"kv\"><span class=\"dot\" style=\"background:${q && q.gender === 'F' ? '#d4628f' : '#4a7fd4'}\"><\/span>\n      <span class=\"nm\" data-goto=\"${k}\">${esc(displayName(q))}<\/span>\n      <select data-ltype=\"${l ? l.id : ''}\" style=\"font-size:11.5px;padding:2px 4px;border-radius:6px;border:1px solid #dbe1ea\">\n        ${Object.entries(PARENT_TYPE).map(([kk, v]) => `<option value=\"${kk}\" ${l && l.type === kk ? 'selected' : ''}>${v.label}<\/option>`).join('')}\n      <\/select>\n      <button class=\"x\" data-unlinkchild=\"${k}\">×<\/button><\/div>`;\n  });\n  sortSiblings(sibs).forEach(s => {\n    const q = person(s);\n    h += `<div class=\"kv\"><span class=\"dot\" style=\"background:${q && q.gender === 'F' ? '#d4628f' : '#4a7fd4'}\"><\/span>\n      <span class=\"nm\" data-goto=\"${s}\">${esc(displayName(q))}<\/span><span class=\"rel\">${rankWord(s)}<\/span><\/div>`;\n  });\n  if (!parents.length && !spouses.length && !kids.length && !sibs.length) h += `<div class=\"empty-note\">尚无可显示的亲属<\/div>`;\n  h += `<\/div>`;\n\n  /* 情感关系 */\n  h += `<div class=\"section\"><h4>情感关系<span class=\"count\">${bonds.length}<\/span><\/h4>`;\n  bonds.forEach(b => {\n    const oid = b.a === p.id ? b.b : b.a, q = person(oid);\n    const t = BOND_TYPE[b.type] || BOND_TYPE.close;\n    h += `<div class=\"kv\"><span class=\"dot\" style=\"background:${t.color}\"><\/span>\n      <span class=\"nm\" data-goto=\"${oid}\">${esc(displayName(q))}<\/span>\n      <select data-btype=\"${b.id}\" style=\"font-size:11.5px;padding:2px 4px;border-radius:6px;border:1px solid #dbe1ea\">\n        ${Object.entries(BOND_TYPE).map(([k, v]) => `<option value=\"${k}\" ${b.type === k ? 'selected' : ''}>${v.label}<\/option>`).join('')}\n      <\/select>\n      <button class=\"x\" data-ondel=\"${b.id}\">×<\/button><\/div>`;\n  });\n  h += `<button class=\"link-add\" data-act=\"addBond\">+ 与某位成员添加情感线<\/button><\/div>`;\n\n  /* 血缘关系线（自定义血缘） */\n  const kins = (state.kins || []).filter(k => k.a === p.id || k.b === p.id);\n  h += `<div class=\"section\"><h4>血缘关系线<span class=\"count\">${kins.length}<\/span><\/h4>`;\n  kins.forEach(k => {\n    const oid = otherEnd(k, p.id), q = person(oid);\n    const t = KIN_TYPE[k.type] || KIN_TYPE.custom;\n    const isFrom = k.a === p.id;\n    const delta = kinDelta(k) * (isFrom ? 1 : -1);   // 对方相对本人的辈分差\n    h += `<div class=\"kv\"><span class=\"dot\" style=\"background:${t.color}\"><\/span>\n      <span class=\"nm\" data-goto=\"${oid}\">${isFrom ? '→ ' : '← '}${esc(displayName(q))}<\/span>\n      <span class=\"rel\">${esc(kinLabel(k))} · 对方${esc(kinGapText(delta))}<\/span>\n      <button class=\"x\" data-kedit=\"${k.id}\" title=\"改这条关系线\">改<\/button>\n      <button class=\"x\" data-kdel=\"${k.id}\">×<\/button><\/div>`;\n  });\n  h += `<button class=\"link-add\" data-act=\"addKin\">+ 与某位成员添加血缘关系线<\/button>\n    <div class=\"hint-sm\" style=\"margin:6px 0 0\">「关系线」用来说明结构上画不出来的血缘（生 / 被生 / 兄弟姐妹 / 领养 / 过继），\n    或者只指定辈分差的自定义关系。它只影响<b>辈分排位<\/b>，不会把两人并成一家人。<\/div><\/div>`;\n\n  /* 操作 */\n  h += `<div class=\"section\">\n    <button class=\"btn\" style=\"width:100%;justify-content:center;margin-bottom:7px\" data-act=\"focus\">${isFocal ? '已是中心人物' : '设为中心人物（我）'}<\/button>\n    <button class=\"btn\" style=\"width:100%;justify-content:center;margin-bottom:7px\" data-act=\"addChild2\">添加子女<\/button>\n    <button class=\"btn\" style=\"width:100%;justify-content:center;margin-bottom:7px\" data-act=\"addPartner2\">添加配偶<\/button>\n    <button class=\"btn\" style=\"width:100%;justify-content:center;margin-bottom:7px\" data-act=\"center\">在画布上定位<\/button>\n    <button class=\"btn\" style=\"width:100%;justify-content:center;color:#dc2626;border-color:#f3c9c9\" data-act=\"delete\">删除该成员<\/button>\n  <\/div><\/div>`;\n  return h;\n}\n\n/* ==========================================================================\n   工具动作\n   ========================================================================== */\nfunction newSpouseGender(p) {\n  if (p.gender === GENDER_M) return GENDER_F;\n  if (p.gender === GENDER_F) return GENDER_M;\n  return GENDER_F;\n}\nfunction actAddPartner(id) {\n  if (guard()) return;\n  const p = person(id); if (!p) return;\n  const sp = addPerson({ gender: newSpouseGender(p) });\n  sp.name = '';\n  addCouple(id, sp.id, 'married');\n  select(sp.id); commit();\n  toast('已添加配偶，可在右侧填写姓名与关系状态');\n}\nfunction actAddParents(id) {\n  if (guard()) return;\n  const p = person(id); if (!p) return;\n  if (parentsOf(id).length) { toast('该成员已有父母，可先在「关系」里删除后再添加'); return; }\n  const f = addPerson({ gender: GENDER_M }), m = addPerson({ gender: GENDER_F });\n  const c = addCouple(f.id, m.id, 'married');\n  addLink(c.id, id, 'bio');\n  select(f.id); commit();\n  toast('已添加父母，可继续为他们添加其他子女');\n}\nfunction actAddChild(id) {\n  if (guard()) return;\n  const p = person(id); if (!p) return;\n  const cs = couplesOf(id);\n  const child = addPerson({ gender: GENDER_U });\n  if (cs.length) addLink(cs[0].id, child.id, 'bio')
