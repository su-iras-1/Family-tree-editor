<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>家谱编辑器 · 家谱图在线绘制</title>
<meta name="description" content="离线可用的家谱图（genogram）编辑器：男女/已故/跨性别符号、婚姻与离异、收养与寄养、情感关系线、自动排版、一键导出 PNG/SVG/PDF，并自动推算中文亲属称呼。">
<style>/* ==========================================================================
   家谱编辑器 · 样式表
   ========================================================================== */
:root{
  --bg:#eceff4;
  --panel:#ffffff;
  --panel-2:#f7f9fc;
  --line:#dbe1ea;
  --line-strong:#c3ccda;
  --text:#1e2633;
  --muted:#6b7688;
  --accent:#2f6fd0;
  --accent-dark:#2359ad;
  --accent-soft:#e9f1fd;
  --male:#4a7fd4;
  --female:#d4628f;
  --unknown:#7b8798;
  --danger:#dc2626;
  --ok:#12886a;
  --warn:#b45309;
  --shadow:0 1px 2px rgba(24,39,64,.06),0 6px 20px rgba(24,39,64,.08);
  --radius:10px;
  --font:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);color:var(--text);background:var(--bg);
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit;font-size:13px;color:var(--text);cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--text)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c8d1df;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#a9b5c7;background-clip:content-box}

/* ---------- 顶栏 ---------- */
.topbar{
  height:54px;display:flex;align-items:center;gap:14px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:40;
}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.logo{
  width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:linear-gradient(145deg,#3f7fe0,#2359ad);color:#fff;font-size:15px;font-weight:700;
  box-shadow:0 2px 6px rgba(47,111,208,.35);
}
.title-input{
  border:1px solid transparent;background:transparent;font-size:15px;font-weight:600;
  padding:4px 8px;border-radius:7px;width:190px;
}
.title-input:hover{background:var(--panel-2)}
.title-input:focus{outline:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.topbar .spacer{flex:1}
.actions{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto}
.btn{
  border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:8px;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.14s;
}
.btn:hover{border-color:var(--line-strong);background:var(--panel-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}

/* ---------- 下拉菜单 ---------- */
/* 顶栏是横向滚动容器（overflow:auto），菜单若用 absolute 会被整块裁掉，所以用 fixed，
   展开时由 JS 按按钮位置算 left/top（见 placeMenu） */
.menu-wrap{position:relative}
.menu{
  position:fixed;top:0;left:0;min-width:212px;background:#fff;
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  padding:6px;display:none;z-index:120;
}
.menu.open{display:block}
.menu button{
  display:flex;width:100%;align-items:center;gap:9px;border:0;background:transparent;
  padding:8px 10px;border-radius:8px;text-align:left;
}
.menu button:hover{background:var(--accent-soft)}
.menu .sep{height:1px;background:var(--line);margin:5px 8px}
.menu .mlabel{font-size:11px;color:var(--muted);padding:6px 10px 2px;letter-spacing:.04em}
.menu .kbd{margin-left:auto;font-size:11px;color:var(--muted);background:var(--panel-2);
  border:1px solid var(--line);border-radius:5px;padding:0 5px}

/* ---------- 主体布局 ---------- */
.layout{display:flex;height:calc(100vh - 54px);overflow:hidden}

/* 左侧工具条 */
.tools{
  width:194px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  padding:10px 9px;overflow-y:auto;
}
.tgroup{margin-bottom:12px}
.tgroup-title{
  font-size:11px;color:var(--muted);letter-spacing:.08em;padding:2px 8px 6px;font-weight:600;
}
.tool{
  width:100%;display:flex;align-items:center;gap:9px;border:1px solid transparent;background:transparent;
  padding:7px 9px;border-radius:8px;text-align:left;margin-bottom:2px;transition:.12s;
}
.tool:hover{background:var(--panel-2)}
.tool.active{background:var(--accent-soft);border-color:#bcd6f7;color:var(--accent-dark);font-weight:600}
.tool svg{width:17px;height:17px;flex-shrink:0;opacity:.85}
.tool.active svg{opacity:1}
.tool .tag{margin-left:auto;font-size:10px;color:var(--muted);background:var(--panel-2);
  border-radius:5px;padding:1px 5px;border:1px solid var(--line)}
.tool.active .tag{background:#fff}

/* 中间画布 */
.canvas-wrap{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(circle at 1px 1px,#d3dae6 1px,transparent 0) 0 0/22px 22px,var(--bg);}
#svg{width:100%;height:100%;display:block;cursor:default;touch-action:none}
#svg.panning{cursor:grabbing}
#svg.tool-add,#svg.tool-bond,#svg.tool-kin{cursor:crosshair}
#svg.tool-hand{cursor:grab}
.canvas-hint{
  position:absolute;left:50%;top:18px;transform:translateX(-50%);background:rgba(30,38,51,.86);
  color:#fff;font-size:12.5px;padding:7px 14px;border-radius:20px;pointer-events:none;
  opacity:0;transition:.25s;z-index:20;white-space:nowrap;
}
.canvas-hint.show{opacity:1}
.zoom-bar{
  position:absolute;left:14px;bottom:14px;display:flex;align-items:center;gap:2px;
  background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);padding:3px;z-index:20;
}
.zoom-bar button{border:0;background:transparent;width:28px;height:28px;border-radius:6px;
  display:grid;place-items:center;font-size:15px;color:var(--muted)}
.zoom-bar button:hover{background:var(--panel-2);color:var(--text)}
.zoom-bar .pct{font-size:12px;color:var(--muted);min-width:44px;text-align:center;font-variant-numeric:tabular-nums}

/* 右侧属性面板 */
.inspector{
  width:302px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--line);
  overflow-y:auto;padding:0 0 40px;
}
.insp-empty{padding:44px 26px;text-align:center;color:var(--muted);font-size:13px}
.insp-empty svg{width:56px;height:56px;opacity:.28;margin-bottom:12px}
.insp-empty b{display:block;color:var(--text);font-size:14px;margin-bottom:5px}
.insp-head{
  padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  position:sticky;top:0;background:var(--panel);z-index:10;
}
.insp-head .mini{width:30px;height:30px;flex-shrink:0}
.insp-head .who{min-width:0}
.insp-head .who b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.insp-head .who span{font-size:11.5px;color:var(--muted)}
.insp-body{padding:12px 15px 0}
.field{margin-bottom:11px}
.field>label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:600;letter-spacing:.02em}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;transition:.14s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{resize:vertical;min-height:52px;line-height:1.5}
.hint-sm{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.55}
.term-row{display:flex;gap:6px;align-items:center}
.term-row input[type=text]{flex:1;min-width:0}
.term-row .btn{flex-shrink:0;white-space:nowrap}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;gap:4px;background:var(--panel-2);padding:3px;border-radius:9px;border:1px solid var(--line)}
.seg button{
  flex:1;border:0;background:transparent;padding:6px 2px;border-radius:7px;font-size:12.5px;
  display:flex;align-items:center;justify-content:center;gap:5px;color:var(--muted);
}
.seg button:hover{background:#fff}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(24,39,64,.12);font-weight:600}
.seg button.on[data-g=M]{color:var(--male)}
.seg button.on[data-g=F]{color:var(--female)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:4px 0}
.chk input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.section{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.section>h4{
  margin:0 0 9px;font-size:11.5px;color:var(--muted);letter-spacing:.06em;font-weight:700;
  display:flex;align-items:center;gap:7px;
}
.section>h4 .count{margin-left:auto;font-weight:500;color:var(--muted)}
.kv{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:12.5px}
.kv:hover{background:var(--panel-2)}
.kv .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.kv .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv .rel{color:var(--muted);font-size:11.5px;flex-shrink:0}
.kv .x{border:0;background:transparent;color:var(--muted);padding:0 2px;border-radius:4px;line-height:1;font-size:15px}
.kv .x:hover{background:#fee2e2;color:var(--danger)}
.kin-card{
  background:linear-gradient(135deg,#eef4fe,#f6f9ff);border:1px solid #d5e4fa;border-radius:11px;
  padding:12px 13px;margin-bottom:10px;
}
.kin-card .big{font-size:19px;font-weight:700;color:var(--accent-dark);letter-spacing:.02em}
.kin-card .sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.55}
.kin-card .alt{font-size:12px;color:var(--muted);margin-top:7px;padding-top:7px;border-top:1px dashed #cfe0f8}
.tag-pill{
  display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:11.5px;
  margin:0 5px 5px 0;border:1px solid var(--line);background:#fff;
}
.tag-pill .sw{width:9px;height:9px;border-radius:3px}
.tag-pill .x{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0;font-size:13px;line-height:1}
.cond-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.cond-row input[type=text]{flex:1;border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:12.5px}
.cond-row input[type=color]{width:30px;height:28px;padding:1px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}
.empty-note{color:var(--muted);font-size:12.5px;padding:4px 2px}
.link-add{
  width:100%;border:1px dashed var(--line-strong);background:var(--panel-2);border-radius:8px;
  padding:7px;color:var(--muted);font-size:12.5px;
}
.link-add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- 状态栏 ---------- */
.statusbar{
  position:fixed;left:0;right:0;bottom:0;height:0;overflow:hidden;opacity:0;pointer-events:none;
}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1e2633;color:#fff;
  padding:9px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);opacity:0;
  transition:.25s;pointer-events:none;z-index:200;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 画布内元素 ---------- */
.fam-node{cursor:pointer}
.fam-node.sel .sel-ring{display:block}
.sel-ring{
  display:none;fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4;
}
.fam-node text{font-family:var(--font);user-select:none;pointer-events:none}
.nm{font-size:14px;font-weight:600;fill:#1e2633;text-anchor:middle}
.nm.muted{fill:#8a94a4;font-weight:500}
.dt{font-size:11px;fill:#7b8798;text-anchor:middle}
.nt{font-size:10.5px;fill:#9aa4b2;text-anchor:middle}
.bubble{cursor:pointer;opacity:0;transition:opacity .15s}
.fam-node:hover .bubble,.fam-node.sel .bubble{opacity:1}
.bubble circle{fill:#fff;stroke:var(--accent);stroke-width:1.5}
.bubble:hover circle{fill:var(--accent)}
.bubble text{font-size:13px;fill:var(--accent);text-anchor:middle;dominant-baseline:central;font-weight:600}
.bubble:hover text{fill:#fff}
.hit{fill:transparent}
.rel-line{fill:none;stroke:#5b6b82;stroke-width:1.6;stroke-linecap:round}
.legend-box{fill:rgba(255,255,255,.94);stroke:#dbe1ea}
.legend-title{font-size:13px;font-weight:700;fill:#1e2633}
.legend-text{font-size:11.5px;fill:#5b6b82}
.guide{stroke:var(--accent);stroke-width:1;stroke-dasharray:4 4;pointer-events:none}

/* ---------- 仅查看（锁定） ---------- */
.lock-note{
  margin:12px 15px 0;padding:8px 11px;border-radius:9px;background:#fff7ed;border:1px solid #fed7aa;
  color:#9a3412;font-size:12px;line-height:1.5;
}
body.locked #inspContent input:disabled,
body.locked #inspContent select:disabled,
body.locked #inspContent textarea:disabled,
body.locked #inspContent button:disabled{opacity:.55;cursor:not-allowed}
.lock-banner{
  position:absolute;left:50%;top:14px;transform:translateX(-50%);display:none;align-items:center;gap:9px;
  background:rgba(30,38,51,.92);color:#fff;font-size:12.5px;padding:7px 8px 7px 14px;border-radius:22px;
  box-shadow:var(--shadow);z-index:24;white-space:nowrap;
}
.lock-banner svg{width:14px;height:14px;flex-shrink:0;opacity:.9}
.lock-banner button{
  border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:16px;padding:3px 11px;font-size:12px;
}
.lock-banner button:hover{background:rgba(255,255,255,.3)}
body.locked .lock-banner{display:flex}
body.locked .bubble{display:none}
body.locked .tool[data-act],
body.locked .tool[data-tool="add"],
body.locked .tool[data-tool="bond"]{opacity:.35;pointer-events:none}
body.locked #btnTidy,
body.locked #btnUndo,
body.locked #btnRedo{opacity:.42;pointer-events:none}
body.locked .title-input{pointer-events:none;background:transparent}
body.locked #btnLock{background:#1e2633;border-color:#1e2633;color:#fff;font-weight:600}
body.locked #btnLock:hover{background:#0f1720;border-color:#0f1720}
body.locked .menu button[data-act="new"],
body.locked .menu button[data-act="templates"],
body.locked .menu button[data-act="data"],
body.locked .menu button[data-act="demo-zj"],
body.locked .menu button[data-act="demo-core"]{opacity:.35;pointer-events:none}

/* ---------- 画布内框选 ---------- */
.marquee{
  position:absolute;display:none;pointer-events:none;z-index:22;
  border:1px solid var(--accent);background:rgba(47,111,208,.10);border-radius:3px;
}

/* ---------- 画布内就地编辑 ---------- */
.inline-edit{
  position:absolute;transform:translate(-50%,-50%);z-index:25;pointer-events:auto;
}
.inline-edit input{
  font-family:var(--font);font-size:inherit;font-weight:600;text-align:center;padding:3px 8px;
  border:1px solid var(--accent);border-radius:7px;background:#fff;color:var(--text);
  box-shadow:0 2px 10px rgba(47,111,208,.22);outline:none;display:block;
}
.inline-edit.is-term input{color:var(--accent-dark)}
/* 提示浮在输入框外侧，不占高度，输入框才能正对原来的文字 */
.inline-edit .inline-hint{
  position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;
  font-size:11px;color:#fff;background:rgba(30,38,51,.86);border-radius:6px;padding:2px 8px;
  white-space:nowrap;pointer-events:none;
}
.inline-edit.is-term .inline-hint{top:auto;bottom:100%;margin:0 0 5px}

/* ---------- 弹层 ---------- */
.modal-mask{
  position:fixed;inset:0;background:rgba(20,28,42,.42);display:none;place-items:center;z-index:300;
  padding:24px;
}
.modal-mask.open{display:grid}
.modal{
  background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(15,25,45,.3);width:min(560px,100%);
  max-height:86vh;display:flex;flex-direction:column;overflow:hidden;
}
.modal h3{margin:0;padding:16px 20px;font-size:15.5px;border-bottom:1px solid var(--line)}
.modal .mbody{padding:18px 20px;overflow-y:auto}
.modal .mfoot{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:var(--panel-2)}
.grid-tpl{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tpl{border:1px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;transition:.15s;background:#fff}
.tpl:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(47,111,208,.14);transform:translateY(-1px)}
.tpl b{display:block;font-size:13.5px;margin-bottom:4px}
.tpl span{font-size:12px;color:var(--muted);line-height:1.5}
.tpl.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px rgba(47,111,208,.14)}
.modal .hint-text{font-size:12.5px;color:var(--muted);line-height:1.7;margin:0 0 14px}
.modal textarea{width:100%;min-height:230px;border:1px solid var(--line);border-radius:9px;padding:11px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;resize:vertical}
.kbd-table{width:100%;border-collapse:collapse;font-size:13px}
.kbd-table td{padding:6px 4px;border-bottom:1px solid var(--line)}
.kbd-table td:first-child{width:130px;color:var(--muted)}
.kbd-badge{display:inline-block;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
  padding:1px 7px;font-size:12px;font-family:ui-monospace,Menlo,monospace;margin-right:4px}

@media (max-width:980px){
  .tools{width:60px;padding:8px 5px}
  .tgroup-title,.tool span,.tool .tag{display:none}
  .tool{justify-content:center;padding:9px 0}
  .inspector{position:absolute;right:0;top:0;bottom:0;z-index:30;box-shadow:var(--shadow);width:290px;
    transform:translateX(100%);transition:transform .25s}
  .inspector.open{transform:none}
  .title-input{width:120px}
}
</style>
</head>
<body>

<!-- ============================ 顶栏 ============================ -->
<header class="topbar">
  <div class="brand">
    <div class="logo">谱</div>
    <input class="title-input" id="docTitle" value="我的家谱" title="家谱名称" spellcheck="false">
  </div>

  <div class="spacer"></div>

  <div class="actions">
    <button class="btn ghost" id="btnUndo" title="撤销 (Ctrl+Z)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 1 0 2.6-7.6L3 8"/></svg>撤销
    </button>
    <button class="btn ghost" id="btnRedo" title="重做 (Ctrl+Y)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M20.5 13a9 9 0 1 1-2.6-7.6L21 8"/></svg>重做
    </button>
    <button class="btn" id="btnTidy" title="重新计算布局（清除手动拖动的位置）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>自动排列
    </button>
    <button class="btn" id="btnFit" title="适应窗口">

<script>/* ===== kin.js ===== */
/* ==========================================================================
   Kin —— 中文亲属称呼自动推算
   输入：家谱关系图 G（由编辑器提供）
   输出：以「我」（中心人物）为基准，目标成员的规范称呼 + 口语叫法 + 关系说明

   做法：在亲属图上按 父/母/夫/妻/子/女/兄/弟/姐/妹 九种步长做广度优先搜索，
        取最短关系路径；再把「父+子」这类两跳归约成「兄弟」一跳，
        最后按 上溯(ups) → 旁系(lat) → 下延(downs) 三段式生成称呼。
   ========================================================================== */
const Kin = (function () {

  /* ---------------- 世系用字 ---------------- */
  const GEN_UP = ['', '', '祖', '曾祖', '高祖', '天祖', '烈祖', '太祖', '远祖'];
  const GEN_DOWN = ['', '孙', '曾孙', '玄孙', '来孙', '晜孙', '仍孙', '云孙'];

  /* ---------------- 配偶（姻亲）对照 ---------------- */
  const SPOUSE_OF = {
    '父亲': '母亲', '母亲': '父亲', '爸爸': '妈妈', '妈妈': '爸爸',
    '祖父': '祖母', '祖母': '祖父',
    '外祖父': '外祖母', '外祖母': '外祖父',
    '曾祖父': '曾祖母', '曾祖母': '曾祖父',
    '高祖父': '高祖母', '高祖母': '高祖父',
    '哥哥': '嫂子', '弟弟': '弟媳', '姐姐': '姐夫', '妹妹': '妹夫',
    '兄': '嫂子', '弟': '弟媳', '姐': '姐夫', '妹': '妹夫',
    '兄弟': '嫂子 / 弟媳', '姐妹': '姐夫 / 妹夫',
    '伯父': '伯母', '叔父': '婶母', '姑母': '姑父', '舅父': '舅母', '姨母': '姨父',
    '大姑母': '大姑父', '小姑母': '小姑父', '大舅父': '大舅母', '小舅父': '小舅母',
    '大姨母': '大姨父', '小姨母': '小姨父',
    '伯祖父': '伯祖母', '叔祖父': '叔祖母', '姑祖父': '姑祖母',
    '舅祖父': '舅祖母', '姨祖父': '姨祖母',
    '伯祖母': '伯祖父', '叔祖母': '叔祖父', '姑祖母': '姑祖父',
    '舅祖母': '舅祖父', '姨祖母': '姨祖父',
    '外伯祖父': '外伯祖母', '外叔祖父': '外叔祖母', '外姑祖父': '外姑祖母',
    '外舅祖父': '外舅祖母', '外姨祖父': '外姨祖母',
    '儿子': '儿媳', '女儿': '女婿',
    '孙子': '孙媳', '孙女': '孙女婿', '外孙': '外孙媳', '外孙女': '外孙女婿',
    '曾孙': '曾孙媳', '曾孙女': '曾孙女婿',
    '侄子': '侄媳', '侄女': '侄女婿', '外甥': '外甥媳', '外甥女': '外甥女婿',
    '堂兄': '堂嫂', '堂弟': '堂弟媳', '堂姐': '堂姐夫', '堂妹': '堂妹夫',
    '表兄': '表嫂', '表弟': '表弟媳', '表姐': '表姐夫', '表妹': '表妹夫',
    '堂伯父': '堂伯母', '堂叔父': '堂婶母', '堂姑母': '堂姑父',
    '表伯父': '表伯母', '表叔父': '表婶母', '表姑母': '表姑父',
    '表舅父': '表舅母', '表姨母': '表姨父'
  };

  /* ---------------- 口语叫法（补充说明用） ---------------- */
  const SPOKEN = {
    '父亲': '爸爸、爹爹（江淮老派）', '母亲': '妈妈、娘',
    '祖父': '爷爷、爹爹（老派）', '祖母': '奶奶、太太（老家庭）',
    '外祖父': '外公、姥爷', '外祖母': '外婆、姥姥',
    '曾祖父': '太爷爷、老太爷', '曾祖母': '太奶奶、老太',
    '伯父': '伯伯、大大（老派）', '叔父': '叔叔、爷儿（老派）',
    '姑母': '姑姑、姑妈', '舅父': '舅舅', '姨母': '姨妈、姨娘',
    '伯母': '伯娘、大妈', '婶母': '婶婶、婶娘', '姑父': '姑父、姑爷',
    '舅母': '舅妈', '姨父': '姨夫',
    '哥哥': '哥哥', '弟弟': '弟弟', '姐姐': '姐姐', '妹妹': '妹妹',
    '伯祖父': '伯公、大爷爷', '叔祖父': '叔公、二爷爷', '姑祖母': '姑奶奶、姑婆',
    '舅祖父': '舅爷爷、舅公', '姨祖母': '姨奶奶、姨婆',
    '侄子': '侄子、侄儿', '侄女': '侄女', '外甥': '外甥', '外甥女': '外甥女',
    '堂兄': '堂哥', '堂弟': '堂弟', '堂姐': '堂姐', '堂妹': '堂妹',
    '表兄': '表哥', '表弟': '表弟', '表姐': '表姐', '表妹': '表妹',
    '岳父': '老丈人、丈人', '岳母': '丈母娘', '公公': '老公公、阿公',
    '婆婆': '婆母、阿婆', '嫂子': '嫂子、嫂嫂', '弟媳': '弟妹',
    '姐夫': '姐夫', '妹夫': '妹夫', '儿媳': '媳妇', '女婿': '女婿、姑爷'
  };

  /* ====================== 图遍历 ====================== */

  function genderOf(G, id) { const p = G.person(id); return p ? p.gender : 'U'; }
  function born(G, id) { const p = G.person(id); const y = p && parseInt(p.born, 10); return isNaN(y) ? null : y; }

  /** 比较 a、b 的长幼：返回 '+' a 年长 / '-' a 年幼 / null 未知 */
  function seniority(G, a, b) {
    const ya = born(G, a), yb = born(G, b);
    if (ya == null || yb == null || ya === yb) return null;
    return ya < yb ? '+' : '-';
  }

  /** b 相对 a 的长幼：'elder' b 年长 / 'younger' b 年幼 / null 未知
   *  先比出生年；年龄缺失时改用「兄弟排行」（排行 1 ＝ 同辈中最大，谁排前谁年长）。
   *  排行只在真正的兄弟姐妹之间可比，堂表亲不比排行。 */
  function senOf(G, a, b) {
    const s = seniority(G, a, b);
    if (s === '+') return 'younger';
    if (s === '-') return 'elder';
    if (!G.siblingsOf || G.siblingsOf(a).indexOf(b) < 0) return null;
    if (G.elderBetween) {
      const e = G.elderBetween(a, b);
      if (e === 'a') return 'younger';     // a 年长 ⇒ b 年幼
      if (e === 'b') return 'elder';
    }
    return null;
  }

  /** 某人的全部邻居边：[token, 邻居 id] */
  function neighbors(G, id) {
    const out = [];
    for (const pid of G.parentsOf(id)) {
      out.push([{ k: genderOf(G, pid) === 'F' ? '母' : '父' }, pid]);
    }
    for (const sid of G.spousesOf(id)) {
      out.push([{ k: genderOf(G, sid) === 'F' ? '妻' : '夫' }, sid]);
    }
    for (const cid of G.childrenOf(id)) {
      out.push([{ k: genderOf(G, cid) === 'F' ? '女' : '子' }, cid]);
    }
    for (const sib of G.siblingsOf(id)) {
      const g = genderOf(G, sib);
      // 旁系一律以「兄 / 姐」表示性别，长幼另放在 sen 里（elder 对方年长 / younger 对方年幼 / null 未知）
      out.push([{ k: g === 'F' ? '姐' : '兄', sen: senOf(G, id, sib), lat: true }, sib]);
    }
    return out;
  }

  /** 广度优先搜索最短关系路径 */
  function findPath(G, from, to) {
    if (from === to) return { ids: [from], toks: [] };
    const seen = new Set([from]);
    let frontier = [{ id: from, ids: [from], toks: [] }];
    while (frontier.length) {
      const next = [];
      for (const node of frontier) {
        for (const [tok, nid] of neighbors(G, node.id)) {
          if (seen.has(nid)) continue;
          const ids = node.ids.concat([nid]);
          const toks = node.toks.concat([tok]);
          if (nid === to) return { ids, toks };
          seen.add(nid);
          next.push({ id: nid, ids, toks });
        }
      }
      frontier = next;
    }
    return null;
  }

  /* ====================== 路径归约 ====================== */

  /** 把「父/母 + 子/女」两跳合并为「兄/弟/姐/妹」一跳 */
  function reduce(G, ids, toks) {
    const T = toks.map(t => Object.assign({}, t));
    const I = ids.slice();
    for (let i = 0; i < T.length - 1; i++) {
      const a = T[i].k, b = T[i + 1].k;
      if ((a === '父' || a === '母') && (b === '子' || b === '女')) {
        const sen = senOf(G, I[i], I[i + 2]);
        T.splice(i, 2, { k: b === '子' ? '兄' : '姐', sen, lat: true });
        I.splice(i + 1, 1);
        i--;
      }
    }
    return { ids: I, toks: T };
  }

  /* ====================== 称呼生成 ====================== */

  function spoken(term) { return SPOKEN[term] || ''; }
  function withSpoken(term) {
    const s = spoken(term);
    return s ? s : '';
  }

  /** 直系长辈：ups 为从「我」向外依次的 父/母 序列 */
  function ancestorName(ups, targetGender) {
    const n = ups.length;
    if (n === 0) return '';
    if (n === 1) return ups[0] === '父' ? '父亲' : '母亲';
    // 中途只要跨过一位女性，就冠以「外」（父亲的母亲＝祖母；祖母的父亲＝外曾祖父）
    let wai = false;
    for (let i = 0; i < n - 1; i++) if (ups[i] === '母') wai = true;
    const gen = GEN_UP[Math.min(n, GEN_UP.length - 1)] || '远祖';
    return (wai ? '外' : '') + gen + (targetGender === 'F' ? '母' : '父');
  }

  /** 直系晚辈：downs 为从「我」向外依次的 子/女 序列 */
  function descendantName(downs, targetGender) {
    const n = downs.length;
    if (n === 0) return '';
    if (n === 1) return targetGender === 'F' ? '女儿' : '儿子';
    // 中途经过女儿即算「外」（女儿的儿子＝外孙；儿子的女儿＝孙女）
    let wai = false;
    for (let i = 0; i < n - 1; i++) if (downs[i] === '女') wai = true;
    const gen = GEN_DOWN[Math.min(n - 1, GEN_DOWN.length - 1)] || '远孙';
    // 儿子之子＝孙子；女儿之子＝外孙（不再加「子」）
    if (!wai && targetGender === 'M' && gen === '孙') return '孙子';
    return (wai ? '外' : '') + gen + (targetGender === 'F' ? '女' : '');
  }

  /** 兄弟姐妹及其后代（ups 为空、存在旁系） */
  function siblingLine(lat, downs, targetGender) {
    const male = lat.k === '兄' || lat.k === '弟';
    const sen = lat.sen;
    let term;
    if (male) term = sen === 'elder' ? '哥哥' : sen === 'younger' ? '弟弟' : '兄弟';
    else term = sen === 'elder' ? '姐姐' : sen === 'younger' ? '妹妹' : '姐妹';
    if (!downs.length) return { term };
    // 兄弟姐妹的子女
    const via = male ? '侄' : '外甥';
    const d0 = downs[0];
    if (downs.length === 1) {
      term = (d0 === '女') ? via + '女' : (male ? '侄子' : '外甥');
      return { term, note: (male ? '兄弟' : '姐妹') + '的' + (d0 === '女' ? '女儿' : '儿子') };
    }
    // 兄弟姐妹的孙辈
    const dLast = downs[downs.length - 1];
    const gen = GEN_DOWN[Math.min(downs.length - 1, GEN_DOWN.length - 1)] || '孙';
    term = via + gen + (dLast === '女' ? '女' : '');
    return { term };
  }

  /**
   * 父母/祖辈的兄弟姐妹（旁系长辈）及其后代
   * ups 长度 gen → 旁系长辈相对我上溯 gen 代；rel = gen - downs.length 即目标相对我的辈分
   */
  function collateralLine(ups, lat, downs, targetGender, ageSen) {
    const gen = ups.length;
    const side = ups[0];                                   // '父' 父系 / '母' 母系
    const ancGender = ups[gen - 1] === '母' ? 'F' : 'M';   // 那位长辈本人的性别
    const ancTerm = ancestorName(ups, ancGender);
    let wai = false;
    for (let i = 0; i < gen - 1; i++) if (ups[i] === '母') wai = true;
    const waiS = wai ? '外' : '';
    const stem = GEN_UP[Math.min(gen, GEN_UP.length - 1)] || '远祖';

    const male = lat.k === '兄' || lat.k === '弟';
    const sen = lat.sen;
    const sibGender = male ? 'M' : 'F';
    const senWord = male ? (sen === 'elder' ? '哥哥' : sen === 'younger' ? '弟弟' : '兄弟')
      : (sen === 'elder' ? '姐姐' : sen === 'younger' ? '妹妹' : '姐妹');

    let term, isTang;
    if (gen === 1) {
      if (side === '父') {
        if (male) term = sen === 'elder' ? '伯父' : sen === 'younger' ? '叔父' : '伯父 / 叔父';
        else term = sen === 'elder' ? '大姑母' : sen === 'younger' ? '小姑母' : '姑母';
      } else {
        if (male) term = sen === 'elder' ? '大舅父' : sen === 'younger' ? '小舅父' : '舅父';
        else term = sen === 'elder' ? '大姨母' : sen === 'younger' ? '小姨母' : '姨母';
      }
      isTang = (side === '父' && male);
    } else {
      // 祖父的兄弟＝伯祖父／叔祖父，姐妹＝姑祖母；祖母的兄弟＝舅祖父，姐妹＝姨祖母
      const suffix = sibGender === 'F' ? '母' : '父';
      if (ancGender === 'M' && male && sen === null) {
        term = waiS + '伯' + stem + suffix + ' / ' + waiS + '叔' + stem + suffix;
      } else {
        const prefix = ancGender === 'M' ? (male ? (sen === 'elder' ? '伯' : sen === 'younger' ? '叔' : '伯') : '姑')
          : (male ? '舅' : '姨');
        term = waiS + prefix + stem + suffix;
      }
      isTang = (side === '父' && ancGender === 'M' && male);
    }

    if (!downs.length) return { term, note: ancTerm + '的' + senWord };

    const rel = gen - downs.length;                        // 目标相对我的辈分（正数＝长辈）
    const kin1 = isTang ? '堂' : '表';

    if (rel === 0) {                                       // 同辈：堂/表兄弟姐妹
      const s = ageSen || sen;
      const base = targetGender === 'F'
        ? (s === 'elder' ? '姐' : s === 'younger' ? '妹' : '姐妹')
        : (s === 'elder' ? '兄' : s === 'younger' ? '弟' : '兄弟');
      term = kin1 + base;
      return { term, note: '与「我」同辈，出自' + ancTerm + '一系' };
    }
    if (rel === 1) {                                       // 父母辈：堂/表伯叔姑舅姨
      if (targetGender === 'F') {
        term = (side === '父' ? kin1 + '姑母' : '表姨母');
      } else if (sen === null) {                            // 长幼不明，两种叫法并列
        term = side === '父' ? (kin1 + '伯父 / ' + kin1 + '叔父') : '表舅父';
      } else {
        term = side === '父' ? kin1 + (sen === 'elder' ? '伯父' : '叔父') : '表舅父';
      }
      return { term, note: ancTerm + '的' + senWord + '的' + (targetGender === 'F' ? '女儿' : '儿子') };
    }
    if (rel >= 2) {                                        // 祖辈及以上
      term = kin1 + (GEN_UP[Math.min(rel, GEN_UP.length - 1)] || '远祖') + (targetGender === 'F' ? '母' : '父');
      return { term };
    }
    if (rel === -1) {                                      // 侄辈
      term = kin1 + (targetGender === 'F' ? '侄女' : '侄子');
      return { term };
    }
    term = kin1 + '侄' + (GEN_DOWN[Math.min(-rel, GEN_DOWN.length - 1)] || '孙') + (targetGender === 'F' ? '女' : '');
    return { term };
  }

  /* ---------------- 姻亲 ---------------- */

  function inLaw(baseTerm, speakerGender) {
    const M = speakerGender === 'M';
    const map = {
      '父亲': M ? '岳父' : '公公',
      '母亲': M ? '岳母' : '婆婆',
      '哥哥': M ? '大舅子' : '大伯子',
      '弟弟': M ? '小舅子' : '小叔子',
      '姐姐': M ? '大姨子' : '大姑子',
      '妹妹': M ? '小姨子' : '小姑子',
      '祖父': M ? '岳祖父' : '祖公公',
      '祖母': M ? '岳祖母' : '祖婆婆'
    };
    if (map[baseTerm]) return { term: map[baseTerm], note: (M ? '妻子的' : '丈夫的') + baseTerm };
    return { term: '配偶的' + baseTerm, note: '姻亲（配偶一方的亲属）' };
  }

  function spouseOf(baseTerm, baseIsFemale) {
    if (SPOUSE_OF[baseTerm]) return { term: SPOUSE_OF[baseTerm], note: baseTerm + '的' + (baseIsFemale ? '丈夫' : '妻子') };
    if (/^堂?[兄弟姐妹]$/.test(baseTerm)) return { term: SPOUSE_OF[baseTerm] || baseTerm, note: baseTerm + '的配偶' };
    return { term: baseTerm + '的' + (baseIsFemale ? '丈夫' : '妻子'), note: '' };
  }

  /* ====================== 主函数 ====================== */

  function term(G, focalId, targetId) {
    if (!focalId || !targetId) return { ok: false, term: '—', note: '未设置中心人物' };
    const focal = G.person(focalId);
    if (focalId === targetId) return { ok: true, term: '我（本人）', note: '家谱的中心人物', spoken: '' };

    const path = findPath(G, focalId, targetId);
    if (!path || !path.toks.length) return { ok: false, term: '（无亲属关系）', note: '两人之间没有连通的亲属关系' };

    const tokText = path.toks.map(t => t.k).join(' → ');
    const ageSen = senOf(G, focalId, targetId);

    /* 0) 只有一步且是配偶 */
    if (path.toks.length === 1 && (path.toks[0].k === '夫' || path.toks[0].k === '妻')) {
      const tg = genderOf(G, targetId);
      const t = tg === 'F' ? '妻子' : tg === 'M' ? '丈夫' : '配偶（妻子 / 丈夫）';
      return { ok: true, term: t, note: '本人的配偶', spoken: spoken(t), path: tokText };
    }

    /* 1) 先处理姻亲步（夫/妻） */
    let toks = path.toks.slice(), ids = path.ids.slice();
    const spFirst = toks[0] && (toks[0].k === '夫' || toks[0].k === '妻');
    const spLast = toks.length > 1 && (toks[toks.length - 1].k === '夫' || toks[toks.length - 1].k === '妻');

    if (spFirst) {
      const sub = term(G, ids[1], targetId);          // 配偶相对我的称呼
      if (sub.ok && !/^配偶的/.test(sub.term)) {
        const r = inLaw(sub.term.replace(/\s*\/\s*.*$/, ''), focal.gender);
        return { ok: true, term: r.term, note: r.note || ('配偶的' + sub.term), spoken: spoken(r.term), path: tokText };
      }
      return { ok: true, term: '配偶的' + sub.term, note: '姻亲', path: tokText };
    }

    if (spLast) {
      const head = { ids: ids.slice(0, -1), toks: toks.slice(0, -1) };
      const sub = renderPure(G, head.ids, head.toks, genderOf(G, ids[ids.length - 2]), null);
      const baseTerm = sub.term.replace(/\s*\/\s*.*$/, '');
      const r = spouseOf(baseTerm, genderOf(G, ids[ids.length - 2]) === 'F');
      return { ok: true, term: r.term, note: r.note || sub.note, spoken: spoken(r.term), path: tokText };
    }

    const r = renderPure(G, ids, toks, genderOf(G, targetId), ageSen);
    r.path = tokText;
    r.ok = r.ok !== false;
    r.spoken = spoken(r.term.replace(/\s*\/\s*.*$/, ''));
    return r;
  }

  /** 纯血亲路径渲染 */
  function renderPure(G, ids, toks, targetGender, ageSen) {
    const red = reduce(G, ids, toks);
    const T = red.toks;

    const ups = [], downs = [];
    let lat = null, phase = 0;
    for (const t of T) {
      if (t.k === '父' || t.k === '母') {
        if (phase !== 0) return { ok: false, term: '（关系较远）', note: '关系路径：' + toks.map(x => x.k).join(' → ') };
        ups.push(t.k);
      } else if (t.k === '子' || t.k === '女') {
        phase = 2; downs.push(t.k);
      } else if (t.lat || /^[兄弟姐妹]$/.test(t.k)) {
        if (phase !== 0) return { ok: false, term: '（关系较远）', note: '关系路径：' + toks.map(x => x.k).join(' → ') };
        phase = 1; lat = t;
      } else {
        return { ok: false, term: '（关系较远）', note: '关系路径：' + toks.map(x => x.k).join(' → ') };
      }
    }

    /* 直系 */
    if (!lat && ups.length && !downs.length) {
      const t = ancestorName(ups, targetGender);
      return { ok: true, term: t, note: relationText(ups, 'up') };
    }
    if (!lat && !ups.length && downs.length) {
      const t = descendantName(downs, targetGender);
      return { ok: true, term: t, note: relationText(downs, 'down') };
    }
    /* 兄弟姐妹线 */
    if (!ups.length && lat) {
      const r = siblingLine(lat, downs, targetGender);
      return { ok: true, term: r.term, note: r.note || ('同辈：' + r.term) };
    }
    /* 父母的兄弟姐妹线 */
    if (ups.length && lat) {
      const r = collateralLine(ups, lat, downs, targetGender, ageSen);
      return { ok: true, term: r.term, note: r.note || '' };
    }
    return { ok: false, term: '（关系较远）', note: '关系路径：' + toks.map(x => x.k).join(' → ') };
  }

  const UPWORD = { '父': '父亲', '母': '母亲' };
  const DOWNWORD = { '子': '儿子', '女': '女儿' };
  function relationText(seq, dir) {
    const w = dir === 'up' ? UPWORD : DOWNWORD;
    let s = '我';
    for (const k of seq) s += '的' + w[k];
    return s;
  }

  /** 供界面显示：完整结果（含备选说明） */
  function full(G, focalId, targetId) {
    const r = term(G, focalId, targetId);
    if (r.ok && r.spoken && r.spoken !== r.term) {
      r.note = (r.note ? r.note + '；' : '') + '口语：' + r.spoken;
    }
    if (r.ok === false && r.path) r.note = r.note || ('关系路径：' + r.path);
    return r;
  }

  return { term: full, findPath };
})();

isplay:none}\nbody.locked .tool[data-act],\nbody.locked .tool[data-tool=\"add\"],\nbody.locked .tool[data-tool=\"bond\"]{opacity:.35;pointer-events:none}\nbody.locked #btnTidy,\nbody.locked #btnUndo,\nbody.locked #btnRedo{opacity:.42;pointer-events:none}\nbody.locked .title-input{pointer-events:none;background:transparent}\nbody.locked #btnLock{background:#1e2633;border-color:#1e2633;color:#fff;font-weight:600}\nbody.locked #btnLock:hover{background:#0f1720;border-color:#0f1720}\nbody.locked .menu button[data-act=\"new\"],\nbody.locked .menu button[data-act=\"templates\"],\nbody.locked .menu button[data-act=\"data\"],\nbody.locked .menu button[data-act=\"demo-zj\"],\nbody.locked .menu button[data-act=\"demo-core\"]{opacity:.35;pointer-events:none}\n\n/* ---------- 画布内框选 ---------- */\n.marquee{\n  position:absolute;display:none;pointer-events:none;z-index:22;\n  border:1px solid var(--accent);background:rgba(47,111,208,.10);border-radius:3px;\n}\n\n/* ---------- 画布内就地编辑 ---------- */\n.inline-edit{\n  position:absolute;transform:translate(-50%,-50%);z-index:25;pointer-events:auto;\n}\n.inline-edit input{\n  font-family:var(--font);font-size:inherit;font-weight:600;text-align:center;padding:3px 8px;\n  border:1px solid var(--accent);border-radius:7px;background:#fff;color:var(--text);\n  box-shadow:0 2px 10px rgba(47,111,208,.22);outline:none;display:block;\n}\n.inline-edit.is-term input{color:var(--accent-dark)}\n/* 提示浮在输入框外侧，不占高度，输入框才能正对原来的文字 */\n.inline-edit .inline-hint{\n  position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;\n  font-size:11px;color:#fff;background:rgba(30,38,51,.86);border-radius:6px;padding:2px 8px;\n  white-space:nowrap;pointer-events:none;\n}\n.inline-edit.is-term .inline-hint{top:auto;bottom:100%;margin:0 0 5px}\n\n/* ---------- 弹层 ---------- */\n.modal-mask{\n  position:fixed;inset:0;background:rgba(20,28,42,.42);display:none;place-items:center;z-index:300;\n  padding:24px;\n}\n.modal-mask.open{display:grid}\n.modal{\n  background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(15,25,45,.3);width:min(560px,100%);\n  max-height:86vh;display:flex;flex-direction:column;overflow:hidden;\n}\n.modal h3{margin:0;padding:16px 20px;font-size:15.5px;border-bottom:1px solid var(--line)}\n.modal .mbody{padding:18px 20px;overflow-y:auto}\n.modal .mfoot{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;background:var(--panel-2)}\n.grid-tpl{display:grid;grid-template-columns:1fr 1fr;gap:11px}\n.tpl{border:1px solid var(--line);border-radius:11px;padding:13px;cursor:pointer;transition:.15s;background:#fff}\n.tpl:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(47,111,208,.14);transform:translateY(-1px)}\n.tpl b{display:block;font-size:13.5px;margin-bottom:4px}\n.tpl span{font-size:12px;color:var(--muted);line-height:1.5}\n.tpl.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px rgba(47,111,208,.14)}\n.modal .hint-text{font-size:12.5px;color:var(--muted);line-height:1.7;margin:0 0 14px}\n.modal textarea{width:100%;min-height:230px;border:1px solid var(--line);border-radius:9px;padding:11px;\n  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;resize:vertical}\n.kbd-table{width:100%;border-collapse:collapse;font-size:13px}\n.kbd-table td{padding:6px 4px;border-bottom:1px solid var(--line)}\n.kbd-table td:first-child{width:130px;color:var(--muted)}\n.kbd-badge{display:inline-block;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;\n  padding:1px 7px;font-size:12px;font-family:ui-monospace,Menlo,monospace;margin-right:4px}\n\n@media (max-width:980px){\n  .tools{width:60px;padding:8px 5px}\n  .tgroup-title,.tool span,.tool .tag{display:none}\n  .tool{justify-content:center;padding:9px 0}\n  .inspector{position:absolute;right:0;top:0;bottom:0;z-index:30;box-shadow:var(--shadow);width:290px;\n    transform:translateX(100%);transition:transform .25s}\n  .inspector.open{transform:none}\n  .title-input{width:120px}\n}\n<\/style>\n<\/head>\n<body>\n\n<!-- ============================ 顶栏 ============================ -->\n<header class=\"topbar\">\n  <div class=\"brand\">\n    <div class=\"logo\">谱<\/div>\n    <input class=\"title-input\" id=\"docTitle\" value=\"我的家谱\" title=\"家谱名称\" spellcheck=\"false\">\n  <\/div>\n\n  <div class=\"spacer\"><\/div>\n\n  <div class=\"actions\">\n    <button class=\"btn ghost\" id=\"btnUndo\" title=\"撤销 (Ctrl+Z)\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 7v6h6\"/><path d=\"M3.5 13a9 9 0 1 0 2.6-7.6L3 8\"/><\/svg>撤销\n    <\/button>\n    <button class=\"btn ghost\" id=\"btnRedo\" title=\"重做 (Ctrl+Y)\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 7v6h-6\"/><path d=\"M20.5 13a9 9 0 1 1-2.6-7.6L21 8\"/><\/svg>重做\n    <\/button>\n    <button class=\"btn\" id=\"btnTidy\" title=\"重新计算布局（清除手动拖动的位置）\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1\"/><\/svg>自动排列\n    <\/button>\n    <button class=\"btn\" id=\"btnFit\" title=\"适应窗口\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M16 21h3a2 2 0 0 0 2-2v-3M8 21H5a2 2 0 0 1-2-2v-3\"/><\/svg>适应窗口\n    <\/button>\n    <button class=\"btn\" id=\"btnLock\" title=\"锁定为「仅查看」，防止自己或别人误改（会随文件一起保存）\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10.5\" width=\"16\" height=\"10\" rx=\"2\"/><path d=\"M8 10.5V7a4 4 0 0 1 8 0v3.5\"/><\/svg><span id=\"btnLockLabel\">仅查看<\/span>\n    <\/button>\n\n    <div class=\"menu-wrap\">\n      <button class=\"btn\" id=\"btnFile\" title=\"新建 / 打开 / 保存家谱文件（.json）、查看与编辑数据、载入示例\">文件\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"/><\/svg>\n      <\/button>\n      <div class=\"menu\" id=\"menuFile\">\n        <div class=\"mlabel\">存档<\/div>\n        <button data-act=\"new\">新建空白家谱<\/button>\n        <button data-act=\"templates\">从模板开始…<\/button>\n        <div class=\"sep\"><\/div>\n        <button data-act=\"save\">保存为文件（.json）<span class=\"kbd\">Ctrl+S<\/span><\/button>\n        <button data-act=\"open\">打开文件…<span class=\"kbd\">Ctrl+O<\/span><\/button>\n        <button data-act=\"data\">查看 / 编辑数据…<\/button>\n        <div class=\"sep\"><\/div>\n        <div class=\"mlabel\">示例数据<\/div>\n        <button data-act=\"demo-zj\">载入「江淮亲属称呼谱」<\/button>\n        <button data-act=\"demo-core\">载入「三代核心家庭」示例<\/button>\n      <\/div>\n    <\/div>\n\n    <button class=\"btn\" id=\"btnHelp\" title=\"帮助与快捷键\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2.2-3 4\"/><path d=\"M12 17.5h.01\"/><\/svg>\n    <\/button>\n\n    <div class=\"menu-wrap\">\n      <button class=\"btn primary\" id=\"btnExport\" title=\"导出图片（PNG / SVG）、单文件网页（HTML）、PDF，或直接打印\">导出\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v12\"/><path d=\"m7 10 5 5 5-5\"/><path d=\"M4 21h16\"/><\/svg>\n      <\/button>\n      <div class=\"menu\" id=\"menuExport\">\n        <div class=\"mlabel\">图片<\/div>\n        <button data-act=\"png2\">PNG 图片（2 倍清晰度）<\/button>\n        <button data-act=\"png4\">PNG 图片（4 倍高清）<\/button>\n        <button data-act=\"svg\">SVG 矢量图（可再编辑）<\/button>\n        <div class=\"sep\"><\/div>\n        <div class=\"mlabel\">文档<\/div>\n        <button data-act=\"html\">HTML 网页（只读，适合分享）<\/button>\n        <button data-act=\"html-edit\">HTML 网页（可编辑副本，能接着改）<\/button>\n        <button data-act=\"pdf\">PDF 文件（A4 自适应）<\/button>\n        <button data-act=\"pdf-a3\">PDF 文件（A3 自适应）<\/button>\n        <button data-act=\"print\">打印…<span class=\"kbd\">Ctrl+P<\/span><\/button>\n        <div class=\"sep\"><\/div>\n        <label class=\"chk\" style=\"padding:6px 10px\"><input type=\"checkbox\" id=\"chkLegend\" checked>导出时包含图例<\/label>\n        <label class=\"chk\" style=\"padding:6px 10px\"><input type=\"checkbox\" id=\"chkBg\">导出时包含浅色背景<\/label>\n      <\/div>\n    <\/div>\n\n    <button class=\"btn ghost\" id=\"btnInspToggle\" title=\"属性面板\" style=\"display:none\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 6h16M4 12h16M4 18h16\"/><\/svg>\n    <\/button>\n  <\/div>\n<\/header>\n\n<!-- ============================ 主体 ============================ -->\n<div class=\"layout\">\n\n  <!-- 左侧工具条 -->\n  <aside class=\"tools\">\n    <div class=\"tgroup\">\n      <div class=\"tgroup-title\">绘制<\/div>\n      <button class=\"tool active\" data-tool=\"select\" title=\"在空白处拖出方框框选多人（Shift 追加）；按到人物即自动选中，接着拖就能微调位置\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><path d=\"M3 4h6M3 4v6M21 4h-6M21 4v6M3 20h6M3 20v-6M21 20h-6M21 20v-6\"/><rect x=\"8.5\" y=\"8.5\" width=\"7\" height=\"7\" rx=\"1.2\" stroke-dasharray=\"2.6 2.2\"/><\/svg>\n        <span>框选<\/span><span class=\"tag\">拖空白<\/span><\/button>\n      <button class=\"tool\" data-tool=\"add\" title=\"在空白处点击即可新增一位成员\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"/><\/svg>\n        <span>添加成员<\/span><span class=\"tag\">点画布<\/span><\/button>\n      <button class=\"tool\" data-tool=\"kin\" title=\"依次点击两个人，为他们添加一条血缘关系线（生 / 被生 / 兄弟姐妹 / 领养 / 过继 / 自定义辈分差）\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"5.5\" cy=\"6\" r=\"2.8\"/><circle cx=\"18.5\" cy=\"18\" r=\"2.8\"/><path d=\"M7.8 7.6 16.2 16.4\"/><path d=\"M13.6 16.6 16.5 16.9 16.2 14\" fill=\"currentColor\"/><\/svg>\n        <span>关系线<\/span><span class=\"tag\">点两人<\/span><\/button>\n      <button class=\"tool\" data-tool=\"bond\" title=\"依次点击两个人，为他们添加情感关系线\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"6\" cy=\"7\" r=\"3\"/><circle cx=\"18\" cy=\"17\" r=\"3\"/><path d=\"M8.6 8.6 15.4 15.4\"/><\/svg>\n        <span>情感关系线<\/span><span class=\"tag\">点两人<\/span><\/button>\n      <button class=\"tool\" data-tool=\"hand\" title=\"平移画布：按住空格或 Alt 拖动、鼠标中键、或直接用键盘方向键（Shift 加速）；「框选」工具下轻点人物仍是选中\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M8 12V6.5a1.5 1.5 0 0 1 3 0V12m0-1V5a1.5 1.5 0 0 1 3 0v6m0-1.5a1.5 1.5 0 0 1 3 0V13m0-1a1.5 1.5 0 0 1 3 0v3.5c0 3-2 5.5-5.5 5.5h-1.7c-2 0-3-1-4-2.6L6 13.6c-.7-1.2.9-2.6 2-1.7l.9.8\"/><\/svg>\n        <span>平移画布<\/span><span class=\"tag\">拖拽<\/span><\/button>\n    <\/div>\n\n    <div class=\"tgroup\">\n      <div class=\"tgroup-title\">以选中的人为中心<\/div>\n      <button class=\"tool\" data-act=\"addPartner\" title=\"为选中者添加配偶（或再婚配偶）\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"8\" cy=\"12\" r=\"4\"/><circle cx=\"17\" cy=\"12\" r=\"3.4\"/><\/svg>\n        <span>配偶<\/span><\/button>\n      <button class=\"tool\" data-act=\"addParents\" title=\"为选中者添加父母\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M12 6v5M8 20v-3h8v3\"/><circle cx=\"6\" cy=\"5\" r=\"3\"/><circle cx=\"18\" cy=\"5\" r=\"3\"/><\/svg>\n        <span>父母<\/span><\/button>\n      <button class=\"tool\" data-act=\"addChild\" title=\"为选中者（或其夫妻）添加子女\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M12 4v5\"/><circle cx=\"12\" cy=\"16\" r=\"4\"/><\/svg>\n        <span>子女<\/span><\/button>\n      <button class=\"tool\" data-act=\"addSibling\" title=\"添加兄弟姐妹（同父同母）\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"7\" cy=\"14\" r=\"3.4\"/><circle cx=\"17\" cy=\"14\" r=\"3.4\"/><path d=\"M4 6h16\"/><\/svg>\n        <span>兄弟姐妹<\/span><\/button>\n      <button class=\"tool\" data-act=\"addSpouseParents\" title=\"为选中者的配偶添加父母\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"5\" cy=\"6\" r=\"2.6\"/><circle cx=\"14\" cy=\"6\" r=\"2.6\"/><path d=\"M9.4 19a4 4 0 0 1 7 0\"/><path d=\"M5 9v4h14V9\"/><\/svg>\n        <span>配偶的父母<\/span><\/button>\n    <\/div>\n\n    <div class=\"tgroup\">\n      <div class=\"tgroup-title\">调整<\/div>\n      <button class=\"tool\" data-act=\"focus\" title=\"把选中者设为「我」，用于推算亲属称呼\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"12\" cy=\"12\" r=\"8\"/><circle cx=\"12\" cy=\"12\" r=\"2.5\" fill=\"currentColor\"/><\/svg>\n        <span>设为中心人物<\/span><\/button>\n      <button class=\"tool\" data-act=\"duplicate\" title=\"复制一份该成员及其配偶\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"9\" y=\"9\" width=\"11\" height=\"11\" rx=\"2\"/><path d=\"M5 15V5a1 1 0 0 1 1-1h10\"/><\/svg>\n        <span>复制成员<\/span><\/button>\n      <button class=\"tool\" data-act=\"delete\" title=\"删除选中成员（Delete）\">\n        <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\"><path d=\"M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13\"/><\/svg>\n        <span>删除成员<\/span><span class=\"tag\">Del<\/span><\/button>\n    <\/div>\n\n    <div class=\"tgroup\">\n      <div class=\"tgroup-title\">视图<\/div>\n      <label class=\"chk\"><input type=\"checkbox\" id=\"chkShowLegend\">显示图例<\/label>\n      <label class=\"chk\"><input type=\"checkbox\" id=\"chkShowTerm\" checked>节点上显示称呼<\/label>\n      <label class=\"chk\"><input type=\"checkbox\" id=\"chkShowNote\">节点上显示备注<\/label>\n      <label class=\"chk\"><input type=\"checkbox\" id=\"chkShowGhost\" checked title=\"出嫁 / 入赘的人只按实线符号画在婚后所在的家族，连回本家的那条亲子线改用极淡虚线表示；取消勾选则与普通子女一样画实线\">母族关系用淡线<\/label>\n    <\/div>\n  <\/aside>\n\n  <!-- 画布 -->\n  <section class=\"canvas-wrap\" id=\"canvasWrap\">\n    <svg id=\"svg\" xmlns=\"http://www.w3.org/2000/svg\"><\/svg>\n    <div class=\"canvas-hint\" id=\"canvasHint\"><\/div>\n    <div class=\"lock-banner\" id=\"lockBanner\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"4\" y=\"10.5\" width=\"16\" height=\"10\" rx=\"2\"/><path d=\"M8 10.5V7a4 4 0 0 1 8 0v3.5\"/><\/svg>\n      <span>仅查看模式 · 家谱已锁定，只能平移、缩放与导出<\/span>\n      <button id=\"btnUnlock\">解锁<\/button>\n    <\/div>\n    <div class=\"zoom-bar\">\n      <button id=\"zOut\" title=\"缩小\">−<\/button>\n      <span class=\"pct\" id=\"zPct\">100%<\/span>\n      <button id=\"zIn\" title=\"放大\">＋<\/button>\n      <button id=\"zFit\" title=\"适应窗口\" style=\"width:auto;padding:0 8px;font-size:12px\">适应<\/button>\n      <button id=\"zReset\" title=\"重置为 100%\" style=\"width:auto;padding:0 8px;font-size:12px\">100%<\/button>\n    <\/div>\n  <\/section>\n\n  <!-- 右侧属性面板 -->\n  <aside class=\"inspector\" id=\"inspector\">\n    <div id=\"inspContent\"><\/div>\n  <\/aside>\n<\/div>\n\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<!-- ============================ 弹层 ============================ -->\n<div class=\"modal-mask\" id=\"modalMask\">\n  <div class=\"modal\" id=\"modalBox\"><\/div>\n<\/div>\n<input type=\"file\" id=\"fileInput\" accept=\".json,application/json\" style=\"display:none\">\n\n<script>/* ===== kin.js ===== */\n/* ==========================================================================\n   Kin —— 中文亲属称呼自动推算\n   输入：家谱关系图 G（由编辑器提供）\n   输出：以「我」（中心人物）为基准，目标成员的规范称呼 + 口语叫法 + 关系说明\n\n   做法：在亲属图上按 父/母/夫/妻/子/女/兄/弟/姐/妹 九种步长做广度优先搜索，\n        取最短关系路径；再把「父+子」这类两跳归约成「兄弟」一跳，\n        最后按 上溯(ups) → 旁系(lat) → 下延(downs) 三段式生成称呼。\n   ========================================================================== */\nconst Kin = (function () {\n\n  /* ---------------- 世系用字 ---------------- */\n  const GEN_UP = ['', '', '祖', '曾祖', '高祖', '天祖', '烈祖', '太祖', '远祖'];\n  const GEN_DOWN = ['', '孙', '曾孙', '玄孙', '来孙', '晜孙', '仍孙', '云孙'];\n\n  /* ---------------- 配偶（姻亲）对照 ---------------- */\n  const SPOUSE_OF = {\n    '父亲': '母亲', '母亲': '父亲', '爸爸': '妈妈', '妈妈': '爸爸',\n    '祖父': '祖母', '祖母': '祖父',\n    '外祖父': '外祖母', '外祖母': '外祖父',\n    '曾祖父': '曾祖母', '曾祖母': '曾祖父',\n    '高祖父': '高祖母', '高祖母': '高祖父',\n    '哥哥': '嫂子', '弟弟': '弟媳', '姐姐': '姐夫', '妹妹': '妹夫',\n    '兄': '嫂子', '弟': '弟媳', '姐': '姐夫', '妹': '妹夫',\n    '兄弟': '嫂子 / 弟媳', '姐妹': '姐夫 / 妹夫',\n    '伯父': '伯母', '叔父': '婶母', '姑母': '姑父', '舅父': '舅母', '姨母': '姨父',\n    '大姑母': '大姑父', '小姑母': '小姑父', '大舅父': '大舅母', '小舅父': '小舅母',\n    '大姨母': '大姨父', '小姨母': '小姨父',\n    '伯祖父': '伯祖母', '叔祖父': '叔祖母', '姑祖父': '姑祖母',\n    '舅祖父': '舅祖母', '姨祖父': '姨祖母',\n    '伯祖母': '伯祖父', '叔祖母': '叔祖父', '姑祖母': '姑祖父',\n    '舅祖母': '舅祖父', '姨祖母': '姨祖父',\n    '外伯祖父': '外伯祖母', '外叔祖父': '外叔祖母', '外姑祖父': '外姑祖母',\n    '外舅祖父': '外舅祖母', '外姨祖父': '外姨祖母',\n    '儿子': '儿媳', '女儿': '女婿',\n    '孙子': '孙媳', '孙女': '孙女婿', '外孙': '外孙媳', '外孙女': '外孙女婿',\n    '曾孙': '曾孙媳', '曾孙女': '曾孙女婿',\n    '侄子': '侄媳', '侄女': '侄女婿', '外甥': '外甥媳', '外甥女': '外甥女婿',\n    '堂兄': '堂嫂', '堂弟': '堂弟媳', '堂姐': '堂姐夫', '堂妹': '堂妹夫',\n    '表兄': '表嫂', '表弟': '表弟媳', '表姐': '表姐夫', '表妹': '表妹夫',\n    '堂伯父': '堂伯母', '堂叔父': '堂婶母', '堂姑母': '堂姑父',\n    '表伯父': '表伯母', '表叔父': '表婶母', '表姑母': '表姑父',\n    '表舅父': '表舅母', '表姨母': '表姨父'\n  };\n\n  /* ---------------- 口语叫法（补充说明用） ---------------- */\n  const SPOKEN = {\n    '父亲': '爸爸、爹爹（江淮老派）', '母亲': '妈妈、娘',\n    '祖父': '爷爷、爹爹（老派）', '祖母': '奶奶、太太（老家庭）',\n    '外祖父': '外公、姥爷', '外祖母': '外婆、姥姥',\n    '曾祖父': '太爷爷、老太爷', '曾祖母': '太奶奶、老太',\n    '伯父': '伯伯、大大（老派）', '叔父': '叔叔、爷儿（老派）',\n    '姑母': '姑姑、姑妈', '舅父': '舅舅', '姨母': '姨妈、姨娘',\n    '伯母': '伯娘、大妈', '婶母': '婶婶、婶娘', '姑父': '姑父、姑爷',\n    '舅母': '舅妈', '姨父': '姨夫',\n    '哥哥': '哥哥', '弟弟': '弟弟', '姐姐': '姐姐', '妹妹': '妹妹',\n    '伯祖父': '伯公、大爷爷', '叔祖父': '叔公、二爷爷', '姑祖母': '姑奶奶、姑婆',\n    '舅祖父': '舅爷爷、舅公', '姨祖母': '姨奶奶、姨婆',\n    '侄子': '侄子、侄儿', '侄女': '侄女', '外甥': '外甥', '外甥女': '外甥女',\n    '堂兄': '堂哥', '堂弟': '堂弟', '堂姐': '堂姐', '堂妹': '堂妹',\n    '表兄': '表哥', '表弟': '表弟', '表姐': '表姐', '表妹': '表妹',\n    '岳父': '老丈人、丈人', '岳母': '丈母娘', '公公': '老公公、阿公',\n    '婆婆': '婆母、阿婆', '嫂子': '嫂子、嫂嫂', '弟媳': '弟妹',\n    '姐夫': '姐夫', '妹夫': '妹夫', '儿媳': '媳妇', '女婿': '女婿、姑爷'\n  };\n\n  /* ====================== 图遍历 ====================== */\n\n  function genderOf(G, id) { const p = G.person(id); return p ? p.gender : 'U'; }\n  function born(G, id) { const p = G.person(id); const y = p && parseInt(p.born, 10); return isNaN(y) ? null : y; }\n\n  /** 比较 a、b 的长幼：返回 '+' a 年长 / '-' a 年幼 / null 未知 */\n  function seniority(G, a, b) {\n    const ya = born(G, a), yb = born(G, b);\n    if (ya == null || yb == null || ya === yb) return null;\n    return ya < yb ? '+' : '-';\n  }\n\n  /** b 相对 a 的长幼：'elder' b 年长 / 'younger' b 年幼 / null 未知\n   *  先比出生年；年龄缺失时改用「兄弟排行」（排行 1 ＝ 同辈中最大，谁排前谁年长）。\n   *  排行只在真正的兄弟姐妹之间可比，堂表亲不比排行。 */\n  function senOf(G, a, b) {\n    const s = seniority(G, a, b);\n    if (s === '+') return 'younger';\n    if (s === '-') return 'elder';\n    if (!G.siblingsOf || G.siblingsOf(a).indexOf(b) < 0) return null;\n    if (G.elderBetween) {\n      const e = G.elderBetween(a, b);\n      if (e === 'a') return 'younger';     // a 年长 ⇒ b 年幼\n      if (e === 'b') return 'elder';\n    }\n    return null;\n  }\n\n  /** 某人的全部邻居边：[token, 邻居 id] */\n  function neighbors(G, id) {\n    const out = [];\n    for (const pid of G.parentsOf(id)) {\n      out.push([{ k: genderOf(G, pid) === 'F' ? '母' : '父' }, pid]);\n    }\n    for (const sid of G.spousesOf(id)) {\n      out.push([{ k: genderOf(G, sid) === 'F' ? '妻' : '夫' }, sid]);\n    }\n    for (const cid of G.childrenOf(id)) {\n      out.push([{ k: genderOf(G, cid) === 'F' ? '女' : '子' }, cid]);\n    }\n    for (const sib of G.siblingsOf(id)) {\n      const g = genderOf(G, sib);\n      // 旁系一律以「兄 / 姐」表示性别，长幼另放在 sen 里（elder 对方年长 / younger 对方年幼 / null 未知）\n      out.push([{ k: g === 'F' ? '姐' : '兄', sen: senOf(G, id, sib), lat: true }, sib]);\n    }\n    return out;\n  }\n\n  /** 广度优先搜索最短关系路径 */\n  function findPath(G, from, to) {\n    if (from === to) return { ids: [from], toks: [] };\n    const seen = new Set([from]);\n    let frontier = [{ id: from, ids: [from], toks: [] }];\n    while (frontier.length) {\n      const next = [];\n      for (const node of frontier) {\n        for (const [tok, nid] of neighbors(G, node.id)) {\n          if (seen.has(nid)) continue;\n          const ids = node.ids.concat([nid]);\n          const toks = node.toks.concat([tok]);\n          if (nid === to) return { ids, toks };\n          seen.add(nid);\n          next.push({ id: nid, ids, toks });\n        }\n      }\n      frontier = next;\n    }\n    return null;\n  }\n\n  /* ====================== 路径归约 ====================== */\n\n  /** 把「父/母 + 子/女」两跳合并为「兄/弟/姐/妹」一跳 */\n  function reduce(G, ids, toks) {\n    const T = toks.map(t => Object.assign({}, t));\n    const I = ids.slice();\n    for (let i = 0; i < T.length - 1; i++) {\n      const a = T[i].k, b = T[i + 1].k;\n      if ((a === '父' || a === '母') && (b === '子' || b === '女')) {\n        const sen = senOf(G, I[i], I[i + 2]);\n        T.splice(i, 2, { k: b === '子' ? '兄' : '姐', sen, lat: true });\n        I.splice(i + 1, 1);\n        i--;\n      }\n    }\n    return { ids: I, toks: T };\n  }\n\n  /* ====================== 称呼生成 ====================== */\n\n  function spoken(term) { return SPOKEN[term] || ''; }\n  function withSpoken(term) {\n    const s = spoken(term);\n    return s ? s : '';\n  }\n\n  /** 直系长辈：ups 为从「我」向外依次的 父/母 序列 */\n  function ancestorName(ups, targetGender) {\n    const n = ups.length;\n    if (n === 0) return '';\n    if (n === 1) return ups[0] === '父' ? '父亲' : '母亲';\n    // 中途只要跨过一位女性，就冠以「外」（父亲的母亲＝祖母；祖母的父亲＝外曾祖父）\n    let wai = false;\n    for (let i = 0; i < n - 1; i++) if (ups[i] === '母') wai = true;\n    const gen = GEN_UP[Math.min(n, GEN_UP.length - 1)] || '远祖';\n    return (wai ? '外' : '') + gen + (targetGender === 'F' ? '母' : '父');\n  }\n\n  /** 直系晚辈：downs 为从「我」向外依次的 子/女 序列 */\n  function descendantName(downs, targetGender) {\n    const n = downs.length;\n    if (n === 0) return '';\n    if (n === 1) return targetGender === 'F' ? '女儿' : '儿子';\n    // 中途经过女儿即算「外」（女儿的儿子＝外孙；儿子的女儿＝孙女）\n    let wai = false;\n    for (let i = 0; i < n - 1; i++) if (downs[i] === '女') wai = true;\n    const gen = GEN_DOWN[Math.min(n - 1, GEN_DOWN.length - 1)] || '远孙';\n    // 儿子之子＝孙子；女儿之子＝外孙（不再加「子」）\n    if (!wai && targetGender === 'M' && gen === '孙') return '孙子';\n    return (wai ? '外' : '') + gen + (targetGender === 'F' ? '女' : '');\n  }\n\n  /** 兄弟姐妹及其后代（ups 为空、存在旁系） */\n  function siblingLine(lat, downs, targetGender) {\n    const male = lat.k === '兄' || lat.k === '弟';\n    const sen = lat.sen;\n    let term;\n    if (male) term = sen === 'elder' ? '哥哥' : sen === 'younger' ? '弟弟' : '兄弟';\n    else term = sen === 'elder' ? '姐姐' : sen === 'younger' ? '妹妹' : '姐妹';\n    if (!downs.length) return { term };\n    // 兄弟姐妹的子女\n    const via = male ? '侄' : '外甥';\n    const d0 = downs[0];\n    if (downs.length === 1) {\n      term = (d0 === '女') ? via + '女' : (male ? '侄子' : '外甥');\n      return { term, note: (male ? '兄弟' :
