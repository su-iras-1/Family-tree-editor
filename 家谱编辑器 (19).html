ng = true;\n  requestAnimationFrame(() => {\n    rafPending = false;\n    if (!noLayout) ui.layout = computeLayout();\n    render();\n  });\n}\n\n/* ==========================================================================\n   弹层\n   ========================================================================== */\nfunction showModal(html) {\n  $('#modalBox').innerHTML = html;\n  $('#modalMask').classList.add('open');\n}\nfunction closeModal() { $('#modalMask').classList.remove('open'); }\nfunction confirmModal(title, text, onOk) {\n  showModal(`<h3>${esc(title)}<\/h3><div class=\"mbody\"><p class=\"hint-text\">${esc(text)}<\/p><\/div>\n    <div class=\"mfoot\"><button class=\"btn\" data-close>取消<\/button>\n    <button class=\"btn primary\" data-ok>确定<\/button><\/div>`);\n  $('#modalBox [data-close]').onclick = closeModal;\n  $('#modalBox [data-ok]').onclick = () => { closeModal(); onOk(); };\n}\nfunction chooseBondType(cb) {\n  showModal(`<h3>选择情感关系类型<\/h3><div class=\"mbody\">\n    <p class=\"hint-text\">共 6 种线条样式，与家谱图国际通用画法一致。<\/p>\n    <div class=\"grid-tpl\" id=\"bondTypes\">\n      ${Object.entries(BOND_TYPE).map(([k, v]) => `<div class=\"tpl\" data-bt=\"${k}\">\n        <svg width=\"100%\" height=\"26\" style=\"margin-bottom:6px\">\n          ${v.label === '亲密' || v.label === '融合 / 纠缠'\n      ? `<path d=\"M4 9 Q50 9 96 9\" stroke=\"#2f8f6b\" stroke-width=\"2\" fill=\"none\"/><path d=\"M4 15 Q50 15 96 15\" stroke=\"#2f8f6b\" stroke-width=\"2\" fill=\"none\"/>`\n      : v.label === '疏远' ? `<path d=\"M4 12 Q50 12 96 12\" stroke=\"#8a94a4\" stroke-width=\"2\" fill=\"none\" stroke-dasharray=\"7 6\"/>`\n        : v.label === '冲突' ? `<polyline points=\"4,12 12,5 20,19 28,5 36,19 44,5 52,19 60,5 68,19 76,5 84,19 92,12\" stroke=\"#d97706\" stroke-width=\"1.8\" fill=\"none\"/>`\n          : v.label === '断绝来往' ? `<path d=\"M4 12 L42 12\" stroke=\"#dc2626\" stroke-width=\"2\"/><path d=\"M58 12 L96 12\" stroke=\"#dc2626\" stroke-width=\"2\"/>`\n            : `<polyline points=\"4,12 14,3 24,21 34,3 44,21 54,3 64,21 74,3 84,21 92,6\" stroke=\"#b91c1c\" stroke-width=\"1.8\" fill=\"none\"/>`}\n        <\/svg>\n        <b>${esc(v.label)}<\/b><span>${k === 'close' ? '双平行线' : k === 'fused' ? '三重平行线' : k === 'distant' ? '虚线' : k === 'conflict' ? '锯齿线' : k === 'cutoff' ? '中间断开' : '锯齿＋加重'}<\/span>\n      <\/div>`).join('')}\n    <\/div><\/div><div class=\"mfoot\"><button class=\"btn\" data-close>取消<\/button><\/div>`);\n  $('#modalBox [data-close]').onclick = closeModal;\n  $$('#bondTypes .tpl').forEach(el => el.onclick = () => { closeModal(); cb(el.dataset.bt); });\n}\n\n/* ==========================================================================\n   血缘关系线\n   ========================================================================== */\n/** 弹层里那条示意小线 */\nfunction kinSample(t) {\n  const dash = t.draw === 'dash' ? ' stroke-dasharray=\"9 5\"'\n    : t.draw === 'dashdot' ? ' stroke-dasharray=\"10 4 2 4\"'\n      : t.draw === 'dot' ? ' stroke-dasharray=\"2 5\"' : '';\n  const seg = `stroke=\"${t.color}\" stroke-width=\"1.7\" fill=\"none\"${dash}`;\n  if (t.draw === 'double') {\n    return `<path d=\"M5 9 L91 9\" ${seg}/><path d=\"M5 15 L91 15\" ${seg}/>`;\n  }\n  return `<path d=\"M5 12 L84 12\" ${seg}/>` +\n    `<path d=\"M91 12 L82 7.6 L82 16.4 Z\" fill=\"${t.color}\"/>`;\n}\n/** 关系线怎么描述辈分：给弹层和面板用的一句话 */\nfunction kinGapText(delta) {\n  if (delta === 0) return '同辈（排在同一行）';\n  return delta > 0 ? '低 ' + delta + ' 辈（排在下方 ' + delta + ' 行）' : '高 ' + (-delta) + ' 辈（排在上方 ' + (-delta) + ' 行）';\n}\n\n/** 弹层主体：fromId → toId 这一对要建立（edit 为空）或修改（edit 为已有那条）一条关系线 */\nfunction kinModal(fromId, toId, edit) {\n  const A = person(fromId), B = person(toId);\n  if (!A || !B) return;\n  const nameA = esc(displayName(A)), nameB = esc(displayName(B));\n  const gens = (ui.layout && ui.layout.gen) || new Map();\n  const anchor = gens.has(fromId) ? `（${nameA} 现在排在第 ${gens.get(fromId) + 1} 行）` : '';\n  showModal(`<h3>${edit ? '修改血缘关系线' : '选择血缘关系类型'}<\/h3><div class=\"mbody\">\n    <p class=\"hint-text\"><b>${nameA}<\/b> → <b>${nameB}<\/b>${anchor}。下面每个选项的主语都是<b>先点的「${nameA}」<\/b>，\n      反过来说就是「被生」。<\/p>\n    <div class=\"grid-tpl\" id=\"kinTypes\">\n      ${Object.entries(KIN_TYPE).map(([k, v]) => `<div class=\"tpl${edit && edit.type === k ? ' on' : ''}\" data-kt=\"${k}\">\n        <svg width=\"100%\" height=\"24\" style=\"margin-bottom:6px\">${kinSample(v)}<\/svg>\n        <b>${esc(v.label)}<\/b><span>${esc(k === 'custom' ? '辈分差自定' : kinGapText(v.delta))}<\/span>\n      <\/div>`).join('')}\n    <\/div>\n    <div id=\"kinCustom\" style=\"display:none;margin-top:12px;border-top:1px solid #e6ebf3;padding-top:12px\">\n      <div class=\"field\"><label>辈分差 n（「${nameB}」比「${nameA}」高／低几辈）<\/label>\n        <div class=\"row2\" style=\"grid-template-columns:110px 1fr;align-items:center\">\n          <input type=\"number\" id=\"kinN\" step=\"1\" min=\"-6\" max=\"6\" value=\"${edit && edit.type === 'custom' && Number(edit.n) ? Number(edit.n) : 1}\" style=\"text-align:center\">\n          <div class=\"seg\" id=\"kinQuick\" style=\"margin:0\">\n            <button type=\"button\" data-n=\"-1\">高一辈<\/button>\n            <button type=\"button\" data-n=\"0\">同辈<\/button>\n            <button type=\"button\" data-n=\"1\">低一辈<\/button>\n            <button type=\"button\" data-n=\"2\">低两辈<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"hint-sm\">正数＝「${nameB}」低 n 辈（排在下方），负数＝高一辈（排在上方），0＝同辈。<\/div>\n      <\/div>\n      <div class=\"field\"><label>这条线叫什么（可留空）<\/label>\n        <input type=\"text\" id=\"kinText\" value=\"${esc((edit && edit.text) || '')}\" placeholder=\"如：堂兄 / 表哥 / 兼祧 / 义子\">\n      <\/div>\n      <p class=\"hint-text\" style=\"margin:9px 0 0\">自定义<b>不说明具体是什么亲戚<\/b>，自动排列不会拿它当亲子或兄弟姐妹去解释，\n        只按你填的辈分差，把「${nameB}」作为挂件挂到合理的那一辈上；已有的父母、夫妻、兄弟姐妹关系优先，不受影响。<\/p>\n    <\/div>\n  <\/div>\n  <div class=\"mfoot\">\n    ${edit ? `<button class=\"btn\" style=\"color:#dc2626;border-color:#f3c9c9;margin-right:auto\" data-del>删除这条线<\/button>` : ''}\n    <button class=\"btn\" data-close>取消<\/button>\n    <button class=\"btn primary\" id=\"kinOk\" style=\"display:none\">确定<\/button>\n  <\/div>`);\n  $('#modalBox [data-close]').onclick = closeModal;\n\n  const save = (type, extra) => {\n    const patch = Object.assign({ a: fromId, b: toId, type }, extra || {});\n    if (edit) Object.assign(edit, patch);\n    else {\n      state.kins = state.kins || [];\n      state.kins.push(Object.assign({ id: uid('k') }, patch));\n    }\n    closeModal();\n    commit();\n    toast((edit ? '已更新关系线：' : '已添加关系线：') + kinLabel(edit || patch) + '（工具还开着，可以接着点两个人）', 3000);\n  };\n\n  $$('#kinTypes .tpl').forEach(el => el.onclick = () => {\n    const t = el.dataset.kt;\n    if (t !== 'custom') { save(t); return; }\n    $$('#kinTypes .tpl').forEach(x => x.classList.toggle('on', x === el));\n    $('#kinCustom').style.display = '';\n    $('#kinOk').style.display = '';\n    $('#kinText').focus();\n  });\n  $$('#kinQuick button').forEach(b => b.onclick = () => { $('#kinN').value = b.dataset.n; });\n  $('#kinOk').onclick = () => {\n    let n = Math.round(Number($('#kinN').value));\n    if (!isFinite(n)) n = 0;\n    n = Math.max(-6, Math.min(6, n));\n    save('custom', { n: n, text: $('#kinText').value.trim() });\n  };\n  if (edit && edit.type === 'custom') {\n    $$('#kinTypes .tpl').forEach(x => x.classList.toggle('on', x.dataset.kt === 'custom'));\n    $('#kinCustom').style.display = '';\n    $('#kinOk').style.display = '';\n  }\n  const del = $('#modalBox [data-del]');\n  if (del) del.onclick = () => { removeKin(edit.id); closeModal(); commit(); toast('已删除这条关系线'); };\n}\n/** 画布上点两个人后进来：新建 */\nfunction chooseKinType(fromId, toId) { kinModal(fromId, toId, null); }\n/** 点画布上的标签、或面板里点「改」，进来：修改已有的一条 */\nfunction editKin(id) {\n  if (guard()) return;\n  const k = (state.kins || []).find(x => x.id === id);\n  if (k) kinModal(k.a, k.b, k);\n}\n/** 面板里的「＋ 与某位成员添加血缘线」：先挑人 */\nfunction pickKinTarget(fromId) {\n  showModal(`<h3>选择 (d, opts) {\n  if (!d || !Array.isArray(d.people)) { toast('文件格式不对：缺少 people 列表'); return false; }\n  state = {\n    version: 1, title: d.title || '我的家谱', focalId: d.focalId || null,\n    people: (d.people || []).map(p => Object.assign({\n      gender: 'U', born: '', died: '', deceased: false, trans: false, orientation: '', ruzhui: false,\n      conditions: [], note: '', term: '', rank: ''\n    }, p)),\n    couples: d.couples || [], links: d.links || [], bonds: d.bonds || [], kins: d.kins || [],\n    locked: !!d.locked,\n    faintNatal: d.faintNatal !== false\n  };\n  // 清理悬空关系\n  const ids = new Set(state.people.map(p => p.id));\n  state.couples = state.couples.filter(c => ids.has(c.a) && ids.has(c.b));\n  const cids = new Set(state.couples.map(c => c.id));\n  state.links = state.links.filter(l => ids.has(l.child) && ((l.couple && cids.has(l.couple)) || (l.parent && ids.has(l.parent))));\n  state.bonds = state.bonds.filter(b => ids.has(b.a) && ids.has(b.b));\n  state.kins = state.kins.filter(k => ids.has(k.a) && ids.has(k.b) && KIN_TYPE[k.type]);\n  if (state.focalId && !ids.has(state.focalId)) state.focalId = null;\n  if (!state.focalId && state.people.length) state.focalId = state.people[0].id;\n  setSelection([]); ui._inspKey = null; ui.structVer = (ui.structVer || 0) + 1;\n  history = { stack: [], index: -1 };\n  pushHistory();\n  $('#docTitle').value = state.title;\n  relayoutRender();\n  fitView();\n  if (!(opts && opts.silent)) saveDraft();\n  return true;\n}\nfunction newDoc() {\n  confirmModal('新建空白家谱', '当前内容会被替换（若已保存为文件则不受影响）。确定继续？', () => {\n    loadStateData(starterState()); toast('已新建');\n  });\n}\n\n/* ==========================================================================\n   导出\n   ========================================================================== */\nfunction standaloneSVG(opts) {\n  opts = opts || {};\n  const r = contentMarkup({ legend: opts.legend !== false, export: true });\n  const b = fullBounds(), pad = 46;\n  const titleH = opts.title ? 58 : 0;\n  const x0 = b.x0 - pad, y0 = b.y0 - pad - titleH;\n  const w = Math.max(b.x1 - b.x0 + pad * 2, 240);\n  const h = Math.max(b.y1 - b.y0 + pad * 2 + titleH, 200);\n  const bg = opts.bg === false ? '' :\n    `<rect x=\"${x0}\" y=\"${y0}\" width=\"${w}\" height=\"${h}\" fill=\"#ffffff\"/>`;\n  const title = opts.title ? `<text x=\"${x0 + 10}\" y=\"${y0 + 38}\" font-size=\"26\" font-weight=\"700\" fill=\"#1e2633\" font-family='${FONT}'>${esc(state.title)}<\/text>\n    <line x1=\"${x0 + 10}\" y1=\"${y0 + 50}\" x2=\"${x0 + w - 10}\" y2=\"${y0 + 50}\" stroke=\"#dbe1ea\" stroke-width=\"1.5\"/>` : '';\n  return `<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"${Math.round(w)}\" height=\"${Math.round(h)}\" viewBox=\"${x0} ${y0} ${w} ${h}\">\n${bg}${title}${r.markup}\n<\/svg>`;\n}\nfunction svgToCanvas(svgStr, scale, cb) {\n  const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });\n  const url = URL.createObjectURL(blob);\n  const img = new Image();\n  img.onload = () => {\n    const cv = document.createElement('canvas');\n    cv.width = Math.round(img.width * scale);\n    cv.height = Math.round(img.height * scale);\n    const ctx = cv.getContext('2d');\n    ctx.fillStyle = '#fff';\n    ctx.fillRect(0, 0, cv.width, cv.height);\n    ctx.drawImage(img, 0, 0, cv.width, cv.height);\n    URL.revokeObjectURL(url);\n    cb(cv);\n  };\n  img.onerror = () => { URL.revokeObjectURL(url); toast('导出失败，请稍后重试'); };\n  img.src = url;\n}\nfunction exportPNG(scale) {\n  const opts = { legend: $('#chkLegend').checked, bg: $('#chkBg').checked, title: true };\n  const svgStr = standaloneSVG(opts);\n  toast('正在生成图片…');\n  svgToCanvas(svgStr, scale, cv => {\n    cv.toBlob(b => {\n      if (!b) { toast('导出失败：这个浏览器没能生成图片，可以改用「SVG 矢量图」或「HTML 网页」'); return; }\n      download(b, fileName('png'));\n      toast('图片已导出');\n    }, 'image/png');\n  });\n}\nfunction exportSVG() {\n  const svgStr = standaloneSVG({ legend: $('#chkLegend').checked, bg: false, title: true });\n  download(new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' }), fileName('svg'));\n  toast('矢量图已导出');\n}\n/* ---- 极简 PDF 生成（内嵌 JPEG，无外部依赖） ---- */\nfunction pdfFromJPEG(jpegBytes, pxW, pxH, pageW, pageH) {\n  const strBytes = s => { const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 0xff; return a; };\n  // 等比缩放居中\n  const s = Math.min(pageW / pxW, pageH / pxH) * 0.94;\n  const w = pxW * s, h = pxH * s;\n  const x = (pageW - w) / 2, y = (pageH - h) / 2;\n\n  const chunks = [];\n  const offsets = [0];\n  let len = 0;\n  const push = u8 => { chunks.push(u8); len += u8.length; };\n  const pushStr = s => push(strBytes(s));\n  const startObj = () => { offsets.push(len); };\n\n  pushStr('%PDF-1.4\\n%\\xE2\\xE3\\xCF\\xD3\\n');\n  startObj(); pushStr('1 0 obj\\n<<\/Type/Catalog/Pages 2 0 R>>\\nendobj\\n');\n  startObj(); pushStr('2 0 obj\\n<<\/Type/Pages/Kids[3 0 R]/Count 1>>\\nendobj\\n');\n  startObj(); pushStr(`3 0 obj\\n<<\/Type/Page/Parent 2 0 R/MediaBox[0 0 ${pageW.toFixed(2)} ${pageH.toFixed(2)}]/Resources<<\/XObject<<\/Im0 4 0 R>>>>/Contents 5 0 R>>\\nendobj\\n`);\n  startObj(); pushStr(`4 0 obj\\n<<\/Type/XObject/Subtype/Image/Width ${pxW}/Height ${pxH}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpegBytes.length}>>\\nstream\\n`);\n  push(jpegBytes);\n  pushStr('\\nendstream\\nendobj\\n');\n  const content = `q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q\\n`;\n  startObj(); pushStr(`5 0 obj\\n<<\/Length ${content.length}>>\\nstream\\n${content}endstream\\nendobj\\n`);\n\n  const xrefPos = len;\n  let xref = 'xref\\n0 6\\n0000000000 65535 f \\n';\n  for (let i = 1; i <= 5; i++) xref += String(offsets[i]).padStart(10, '0') + ' 00000 n \\n';\n  pushStr(xref);\n  pushStr(`trailer\\n<<\/Size 6/Root 1 0 R>>\\nstartxref\\n${xrefPos}\\n%%EOF\\n`);\n\n  const total = chunks.reduce((a, b) => a + b.length, 0);\n  const out = new Uint8Array(total);\n  let o = 0; chunks.forEach(c => { out.set(c, o); o += c.length; });\n  return new Blob([out], { type: 'application/pdf' });\n}\n/** 把 JS 字符串安全地嵌进 <script> 里（转义引号换行，并拆掉可能提前闭合脚本的 <\/） */\nfunction jsStr(v) {\n  return JSON.stringify(v == null ? null : v).replace(/<\\//g, '<\\\\/');\n}\n/** 在模板里一次性填空：边扫边替换，插进去的内容不会再被扫到（副本里也有同样的占位行） */\nfunction fillTemplate(src, map) {\n  // left 里的每个占位只填一次：整份源码里，占位行除了 app-core.js 里那一处，\n  // 在本函数的查找表里还各有一处，填完必须摘掉，否则会把查找表自己改掉\n  const left = Object.assign({}, map);\n  let out = '', i = 0;\n  while (i < src.length) {\n    let hit = null;\n    for (const k in left) {\n      const j = src.indexOf(k, i);\n      if (j >= 0 && (!hit || j < hit.j)) hit = { k: k, j: j };\n    }\n    if (!hit) { out += src.slice(i); break; }\n    out += src.slice(i, hit.j) + left[hit.k];\n    i = hit.j + hit.k.length;\n    delete left[hit.k];\n  }\n  return out;\n}\n/** 导出一份**可继续编辑的副本**：整份编辑器 + 当前家谱数据，双击打开就能接着改 */\nfunction exportEditableHTML() {\n  if (!SELF_SRC) {\n    toast('这份文件没带上编辑器源码，导不出可编辑副本——请用原始的「家谱编辑器.html」');\n    return;\n  }\n  const id = 'copy-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);\n  const data = JSON.parse(snapshot());\n  data.locked = false;                                   // 副本为「继续编辑」而导出，不继承锁定\n  const src = fillTemplate(SELF_SRC, {\n    \"const DOC_ID = 'main';\": `const DOC_ID = ${jsStr(id)};`,\n    'const SELF_SRC = null;': 'const SELF_SRC = ' + jsStr(SELF_SRC) + ';',\n    'const EMBEDDED_STATE = null;': 'const EMBEDDED_STATE = ' + jsStr(data) + ';'\n  });\n  download(new Blob([src], { type: 'text/html;charset=utf-8' }), fileName('html', '_可编辑'));\n  toast('已导出可编辑副本：双击打开就是一个带这份家谱的编辑器，改完还能再导出', 3600);\n}\n/** 导出一份**单文件网页**：把家谱 SVG 内嵌进一张干净页面，双击就能用浏览器打开、直接发给别人看 */\nfunction exportHTML() {\n  // 页面里已有 <h1> 标题，SVG 就不必再画一遍自己的标题\n  const svg = standaloneSVG({ legend: $('#chkLegend').checked, bg: $('#chkBg').checked, title: false });\n  const name = esc(state.title || '家谱');\n  const d = new Date();\n  const p2 = n => String(n).padStart(2, '0');\n  const stamp = `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;\n  const html = `<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>${name}<\/title>\n<style>\n  html{-webkit-text-size-adjust:100%}\n  body{margin:0;background:#f2f4f8;color:#1e2633;font-family:${FONT};line-height:1.6}\n  .wrap{max-width:1500px;margin:0 auto;padding:20px 16px 40px}\n  h1{font-size:19px;font-weight:700;margin:2px 0 14px;letter-spacing:.02em}\n  .card{background:#fff;border:1px solid #dbe1ea;border-radius:14px;\n        box-shadow:0 6px 22px rgba(24,34,51,.07);padding:14px;overflow:auto}\n  .card svg{max-width:100%;height:auto;display:block;margin:0 auto}\n  .foot{margin-top:12px;font-size:12px;color:#8a94a4;display:flex;\n        justify-content:space-between;gap:12px;flex-wrap:wrap}\n  @media (max-width:640px){.wrap{padding:12px 8px 28px}.card{padding:8px;border-radius:10px}}\n  @media print{\n    body{background:#fff}.wrap{padding:0;max-width:none}\n    h1{margin:0 0 8px}.card{border:0;box-shadow:none;padding:0}.foot{display:none}\n    @page{size:auto;margin:10mm}\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <h1>${name}<\/h1>\n  <div class=\"card\">${svg}<\/div>\n  <div class=\"foot\"><span>共 ${state.people.length} 位成员 · ${state.couples.length} 对夫妻<\/span><span>导出于 ${stamp}<\/span><\/div>\n<\/div>\n<\/body>\n<\/html>`;\n  download(new Blob([html], { type: 'text/html;charset=utf-8' }), fileName('html'));\n  toast('已导出网页：双击这个 .html 就能用浏览器打开，也可以直接发给别人');\n}\nfunction exportPDF(a3) {\n  const opts = { legend: $('#chkLegend').checked, bg: true, title: true };\n  const svgStr = standaloneSVG(opts);\n  toast('正在生成 PDF…');\n  svgToCanvas(svgStr, 2.4, cv => {\n    const pxW = cv.width, pxH = cv.height;\n    const jpeg = cv.toDataURL('image/jpeg', 0.94);\n    const bin = atob(jpeg.split(',')[1]);\n    const bytes = new Uint8Array(bin.length);\n    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);\n    let pw = 595.28, ph = 841.89;                 // A4 纵向\n    if (pxW > pxH) { const t = pw; pw = ph; ph = t; }  // 横向\n    if (a3) { pw *= Math.SQRT2; ph *= Math.SQRT2; }    // A3\n    download(pdfFromJPEG(bytes, pxW, pxH, pw, ph), fileName('pdf'));\n    toast('PDF 已导出');\n  });\n}\nfunction printDoc() {\n  const svgStr = standaloneSVG({ legend: $('#chkLegend').checked, bg: true, title: true });\n  const fr = document.createElement('iframe');\n  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';\n  document.body.appendChild(fr);\n  const d = fr.contentDocument;\n  d.open();\n  d.write(`<!DOCTYPE html><html><head><meta charset=\"utf-8\"><title>${esc(state.title)}<\/title>\n    <style>@page{margin:10mm}body{margin:0}svg{width:100%;height:auto;display:block}<\/style><\/head>\n    <body>${svgStr}<\/body><\/html>`);\n  d.close();\n  setTimeout(() => {\n    try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { toast('浏览器阻止了打印，请用导出 PDF 后打印'); }\n    setTimeout(() => fr.remove(), 1500);\n  }, 350);\n}\n\n/* ==========================================================================\n   模板\n   ========================================================================== */\nfunction starterState() {\n  const s = emptyState('我的家谱');\n  const me = addPersonTo(s, { name: '我', gender: GENDER_M });\n  s.focalId = me.id;\n  return s;\n}\nfunction addPersonTo(s, o) {\n  const p = Object.assign({\n    id: uid('p'), name: '', term: '', gender: 'U', born: '', died: '', rank: '',\n    deceased: false, trans: false, orientation: '', conditions: [], note: ''\n  }, o);\n  s.people.push(p);\n  return p;\n}\nfunction linkTo(s, parentRef, childId, type) {\n  const l = { id: uid('l'), couple: null, parent: null, child: childId, type: type || 'bio' };\n  if (parentRef && s.couples.some(c => c.id === parentRef)) l.couple = parentRef; else l.parent = parentRef;\n  s.links.push(l);\n  return l;\n}\nfunction coupleTo(s, a, b, status) {\n  const c = { id: uid('c'), a, b, status: status || 'married' };\n  s.couples.push(c);\n  return c;\n}\n\nfunction templateCore() {\n  const s = emptyState('三代家庭');\n  const gf = addPersonTo(s, { name: '祖父', gender: 'M', born: '1938', died: '2016', deceased: true });\n  const gm = addPersonTo(s, { name: '祖母', gender: 'F', born: '1941' });\n  const c1 = coupleTo(s, gf.id, gm.id);\n  const f = addPersonTo(s, { name: '父亲', gender: 'M', born: '1966' });\n  const gu = addPersonTo(s, { name: '姑妈', gender: 'F', born: '1970' });\n  linkTo(s, c1.id, f.id); linkTo(s, c1.id, gu.id);\n  const mf = addPersonTo(s, { name: '外祖父', gender: 'M', born: '1940' });\n  const mm = addPersonTo(s, { name: '外祖母', gender: 'F', born: '1943' });\n  const c2 = coupleTo(s, mf.id, mm.id);\n  const m = addPersonTo(s, { name: '母亲', gender: 'F', born: '1968' });\n  linkTo(s, c2.id, m.id);\n  const c3 = coupleTo(s, f.id, m.id);\n  const me = addPersonTo(s, { name: '我', gender: 'M', born: '1996' });\n  const si = addPersonTo(s, { name: '妹妹', gender: 'F', born: '2001' });\n  linkTo(s, c3.id, me.id); linkTo(s, c3.id, si.id);\n  s.focalId = me.id;\n  return s;\n}\nfunction templateDivorce() {\n  const s = emptyState('离异与再婚');\n  const f = addPersonTo(s, { name: '父亲', gender: 'M', born: '1965' });\n  const m1 = addPersonTo(s, { name: '生母', gender: 'F', born: '1967' });\n  const m2 = addPersonTo(s, { name: '继母', gender: 'F', born: '1974' });\n  const c1 = coupleTo(s, f.id, m1.id, 'divorced');\n  const c2 = coupleTo(s, f.id, m2.id, 'married');\n  const me = addPersonTo(s, { name: '我', gender: 'M', born: '1992' });\n  const hb = addPersonTo(s, { name: '同父异母弟弟', gender: 'M', born: '2001' });\n  linkTo(s, c1.id, me.id); linkTo(s, c2.id, hb.id);\n  const mo = addPersonTo(s, { name: '母亲的新伴侣', gender: 'M', born: '1966' });\n  const c3 = coupleTo(s, m1.id, mo.id, 'cohabit');\n  s.focalId = me.id;\n  return s;\n}\nfunction templateMedical() {\n  const s = emptyState('家族病史');\n  const a = addPersonTo(s, { name: '祖父', gender: 'M', born: '1930', died: '1998', deceased: true, conditions: [{ label: '高血压', color: '#c2410c' }, { label: '糖尿病', color: '#e0a30b' }] });\n  const b = addPersonTo(s, { name: '祖母', gender: 'F', born: '1933', died: '2015', deceased: true, conditions: [{ label: '乳腺癌', color: '#9d174d' }] });\n  const c = coupleTo(s, a.id, b.id);\n  const f = addPersonTo(s, { name: '父亲', gender: 'M', born: '1958', conditions: [{ label: '高血压', color: '#c2410c' }] });\n  const au = addPersonTo(s, { name: '姑姑', gender: 'F', born: '1961', conditions: [{ label: '乳腺癌', color: '#9d174d' }] });\n  linkTo(s, c.id, f.id); linkTo(s, c.id, au.id);\n  const m = addPersonTo(s, { name: '母亲', gender: 'F', born: '1960' });\n  const c2 = coupleTo(s, f.id, m.id);\n  const me = addPersonTo(s, { name: '我', gender: 'F', born: '1988' });\n  const br = addPersonTo(s, { name: '弟弟', gender: 'M', born: '1991' });\n  linkTo(s, c2.id, me.id); linkTo(s, c2.id, br.id);\n  s.focalId = me.id;\n  return s;\n}\nfunction templateAdopt() {\n  const s = emptyState('收养与重组家庭');\n  const f = addPersonTo(s, { name: '养父', gender: 'M', born: '1970' });\n  const m = addPersonTo(s, { name: '养母', gender: 'F', born: '1972' });\n  const c = coupleTo(s, f.id, m.id);\n  const me = addPersonTo(s, { name: '我（养子）', gender: 'M', born: '2002' });\n  linkTo(s, c.id, me.id, 'adopt');\n  const fk = addPersonTo(s, { name: '养母与前夫之女', gender: 'F', born: '1996' });\n  const c2 = coupleTo(s, m.id, addPersonToTo(s, '养母前夫', 'M', '1968'), 'divorced');\n  linkTo(s, c2.id, fk.id);\n  s.focalId = me.id;\n  return s;\n}\nfunction addPersonToTo(s, name, gender, born) { return addPersonTo(s, { name, gender, born }); }\n\nfunction openTemplates() {\n  const tpls = [\n    { k: 'core', n: '三代家庭', d: '祖父母 — 父母 — 我，含姑妈与妹妹', f: templateCore },\n    { k: 'divorce', n: '离异与再婚', d: '父母离异、父亲再婚、同父异母弟弟', f: templateDivorce },\n    { k: 'medical', n: '家族病史', d: '用彩色符号标记高血压 / 乳腺癌等', f: templateMedical },\n    { k: 'adopt', n: '收养与重组家庭', d: '收养线（虚线）、继子女关系', f: templateAdopt },\n    { k: 'blank', n: '空白家谱', d: '只有一位「我」，从零开始', f: starterState }\n  ];\n  showModal(`<h3>从模板开始<\/h3><div class=\"mbody\"><div class=\"grid-tpl\">\n    ${tpls.map(t => `<div class=\"tpl\" data-tpl=\"${t.k}\"><b>${t.n}<\/b><span>${t.d}<\/span><\/div>`).join('')}\n  <\/div><\/div><div class=\"mfoot\"><button class=\"btn\" data-close>取消<\/button><\/div>`);\n  $('#modalBox [data-close]').onclick = closeModal;\n  $$('#modalBox .tpl').forEach(el => el.onclick = () => {\n    const t = tpls.find(x => x.k === el.dataset.tpl);\n    closeModal(); loadStateData(t.f()); toast('已套用模板：' + t.n);\n  });\n}\nfunction openHelp() {\n  showModal(`<h3>使用说明与快捷键<\/h3><div class=\"mbody\">\n    <p class=\"hint-text\">本页是一个离线家谱图（genogram）编辑器：所有数据保存在你自己的浏览器与本地文件中，不会上传任何服务器。<\/p>\n    <table class=\"kbd-table\">\n      <tr><td>加父母 / 配偶 / 子女 / 兄弟姐妹<\/td><td>选中某人后，用节点四周的蓝色 <b>+<\/b> 号，或左侧工具栏<\/td><\/tr>\n      <tr><td>改称呼 / 姓名<\/td><td>在画布上<b>双击<\/b>节点上的蓝色称呼或下面的姓名，就地修改（回车保存、Esc 取消、清空＝恢复自动推算）<\/td><\/tr>\n      <tr><td>调整位置<\/td><td>直接拖动节点（只影响该节点，不会打乱结构）；框选多位后可一起拖动<\/td><\/tr>\n      <tr><td>框选多位成员<\/td><td>在<b>空白处拖出方框<\/b>，框住的人一起选中；按住 <b>Shift<\/b> 再框＝追加，<b>Shift 单击<\/b>可逐个增减<\/td><\/tr>\n      <tr><td>解除整齐布局<\/td><td>「自动排列」会清除所有手动位移，按「<b>以中心人物推算辈分、同辈同行<\/b>，父系主线、夫左妻右」重排<\/td><\/tr>\n      <tr><td>亲族分块次序<\/td><td>自动排列把各家族按「<b>本家 → 奶奶一族 → 外公一族 → 外婆一族<\/b>」依次类推，从左到右分块摆放<\/td><\/tr>\n      <tr><td>出嫁 / 入赘者的来路<\/td><td>嫁娶进来的人只按实线符号画在婚后所在的家族；本家的父母横杆上仍按<b>姊妹排行<\/b>给她留一个位子，从那里用<b>极淡虚线直角转弯<\/b>连到她本人。可在左侧「视图」里取消勾选「<b>母族关系用淡线<\/b>」，她就和普通子女一样画实线<\/td><\/tr>\n      <tr><td>赘 · 入赘（男到女家）<\/td><td>选中一位<b>男性<\/b>，在右侧面板勾选「<b>赘 · 入赘<\/b>」：这一对夫妻<b>门户按女方算<\/b>，整个小家庭搬到女方一族下面排（仍是夫左妻右），他自己本家留一个姊妹位用淡线连过来，符号左下角多一个小圆章「赘」。这一项会改门户归属、导致整图重排，取消勾选即恢复<\/td><\/tr>\n      <tr><td>关系线（自定义血缘）<\/td><td>左侧「<b>关系线<\/b>」工具，依次点两个人，选一种血缘：<b>生 / 被生 / 兄弟姐妹 / 领养 / 过继<\/b>，或「<b>自定义<\/b>」只填一个辈分差 n。它只改<b>辈分排位<\/b>——把对方挂到合理的那一辈上，已有的父母 / 夫妻 / 兄弟姐妹关系优先、不受影响；「自定义」不会被自动排列当成亲子或兄弟姐妹来解释<\/td><\/tr>\n      <tr><td>同辈长幼<\/td><td>填<b>出生年<\/b>即按年龄排，年长者始终在左；年龄不明的，在右侧面板填<b>兄弟排行<\/b>（1＝最大）<\/td><\/tr>\n      <tr><td>缩放 / 平移<\/td><td>滚轮缩放；点左侧「平移画布」，或按住<b>空格 / Alt<\/b> 拖动，也可用鼠标中键；键盘<b>方向键<\/b>也能平移（按住 Shift 加速）<\/td><\/tr>\n      <tr><td>仅查看（锁定）<\/td><td>点顶栏「<b>仅查看<\/b>」把家谱锁成只读，只能平移、缩放、框选与导出；锁定状态会随 .json 一起保存<\/td><\/tr>\n      <tr><td>两种 HTML 导出<\/td><td>顶栏「<b>导出<\/b>」里有两个网页选项：<b>只读<\/b>的是一张会自适应的静态网页，适合发给家人看；<b>可编辑副本<\/b>把整个编辑器连同当前家谱装进一个 <b>.html<\/b>，别人双击打开就能接着改、还能再导出。副本不继承锁定，草稿也与本文件分开存，互不覆盖<\/td><\/tr>\n      <tr><td><span class=\"kbd-badge\">Del<\/span><\/td><td>删除选中成员（框选多位时一次删掉全部）<\/td><\/tr>\n      <tr><td><span class=\"kbd-badge\">Ctrl<\/span><span class=\"kbd-badge\">Z<\/span> / <span class=\"kbd-badge\">Ctrl<\/span><span class=\"kbd-badge\">Y<\/span><\/td><td>撤销 / 重做<\/td><\/tr>\n      <tr><td><span class=\"kbd-badge\">Ctrl<\/span><span class=\"kbd-badge\">S<\/span><\/td><td>保存为 .json 文件<\/td><\/tr>\n      <tr><td><span class=\"kbd-badge\">Ctrl<\/span><span class=\"kbd-badge\">O<\/span><\/td><td>打开 .json 文件<\/td><\/tr>\n      <tr><td><span class=\"kbd-badge\">Ctrl<\/span><span class=\"kbd-badge\">P<\/span><\/td><td>打印<\/td><\/tr>\n      <tr><td><span class=\"kbd-badge\">←<\/span><span class=\"kbd-badge\">↑<\/span><span class=\"kbd-badge\">↓<\/span><span class=\"kbd-badge\">→<\/span><\/td><td>平移画布；按住不放会连续平移，Shift 加速，可同时按两个走对角线<\/td><\/tr>\n      <tr><td><span class=\"kbd-badge\">Esc<\/span><\/td><td>取消选择 / 取消连线<\/td><\/tr>\n    <\/table>\n    <div class=\"section\" style=\"margin-top:16px;border-top:1px solid #dbe1ea;padding-top:12px\">\n      <h4 style=\"font-size:12px;color:#6b7688;letter-spacing:.06em\">符号速查（McGoldrick 通用画法）<\/h4>\n      <p class=\"hint-text\" style=\"margin:0\">\n        □ 男 · ○ 女 · ◇ 性别未填 · 符号加 × 为已故；<br>\n        方框内嵌小圆＝跨性别人士，圆内嵌小方＝跨性别女性，实心三角＝同性恋，<br>\n        方块左下角小圆章「赘」＝入赘（男到女家，可在右侧面板勾选，见上表）；<br>\n        夫妻线：实线＝婚姻，虚线＝同居，点线＝订婚，单斜杠＝分居/丧偶，双斜杠＝离异；<br>\n        亲子线：实线＝亲生，长虚线＝收养，点线＝寄养；<br>\n        情感线：双平行线＝亲密，三重平行线＝融合，虚线＝疏远，锯齿＝冲突，中间断开＝断绝来往，加重锯齿＝敌对；<br>\n        关系线（自定义血缘）：带箭头的棕线＝生 / 被生 / 领养 / 过继（箭头指向后点的人），双线＝兄弟姐妹，点线＝自定义辈分差；中点的小标签写着是什么关系，点它就能改；<br>\n        极淡虚线＝出嫁 / 入赘者从本家姊妹位绕回自己位置的来路（可在左侧「视图」中关掉）。\n      <\/p>\n    <\/div>\n  <\/div><div class=\"mfoot\"><button class=\"btn primary\" data-close>知道了<\/button><\/div>`);\n  $('#modalBox [data-close]').onclick = closeModal;\n}\nfunction openData() {\n  showModal(`<h3>查看 / 编辑数据（JSON）<\/h3><div class=\"mbody\">\n    <p class=\"hint-text\">可直接修改后「应用」。people＝成员，couples＝夫妻，links＝亲子（couple 或 parent 指向长辈，child 指向晚辈），bonds＝情感线，\n      kins＝关系线（a 为「先点的人」，b 为「后点的人」；type 取 birth／begotten／sibling／adopt／succession／custom，\n      custom 另带 n＝辈分差、text＝自定义文字）。<\/p>\n    <textarea id=\"dataArea\" spellcheck=\"false\">${esc(JSON.stringify(state, null, 2))}<\/textarea>\n  <\/div><div class=\"mfoot\"><button class=\"btn\" data-close>取消<\/button>\n    <button class=\"btn\" id=\"dataDownload\">下载为文件<\/button>\n    <button class=\"btn primary\" id=\"dataApply\">应用<\/button><\/div>`);\n  $('#modalBox [data-close]').onclick = closeModal;\n  $('#dataDownload').onclick = () => { try { const d = JSON.parse($('#dataArea').value); download(new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' }), fileName('json')); } catch (e) { toast('JSON 解析失败'); } };\n  $('#dataApply').onclick = () => {\n    try {\n      const d = JSON.parse($('#dataArea').value);\n      closeModal(); loadStateData(d); toast('已应用');\n    } catch (e) { toast('JSON 格式有误：' + e.message); }\n  };\n}\n\n/* ==========================================================================\n   事件绑定\n   ========================================================================== */\nfunction syncToolButtons() {\n  $$('.tool[data-tool]').forEach(b => b.classList.toggle('active', b.dataset.tool === ui.tool));\n}\nfunction needSelection(fn) {\n  return () => {\n    if (!ui.sel || !person(ui.sel)) { toast('请先在画布上选中一位成员'); return; }\n    fn(ui.sel);\n  };\n}\n/** 收起所有下拉菜单 */\nfunction closeMenus() {\n  $$('.menu').forEach(x => { x.classList.remove('open'); x.style.visibility = ''; });\n}\n/** 展开某个菜单：菜单是 fixed 定位，这里按按钮的位置现算坐标，贴右边缘对齐 */\nfunction placeMenu(btn, menu) {\n  if (!btn || !menu) return;\n  menu.style.visibility = 'hidden';\n  menu.classList.add('open');\n  const r = btn.getBoundingClientRect();\n  const w = menu.offsetWidth, h = menu.offsetHeight, pad = 8;\n  let left = Math.min(Math.max(pad, r.right - w), Math.max(pad, window.innerWidth - w - pad));\n  let top = r.bottom + 6;\n  if (top + h > window.innerHeight - pad) top = Math.max(pad, r.top - h - 6);  // 下面放不下就翻到按钮上方\n  menu.style.left = Math.round(left) + 'px';\n  menu.style.top = Math.round(top) + 'px';\n  menu.style.visibility = '';\n}\nfunction bindUI() {\n  $('#canvasHint').classList.remove('show');\n\n  $$('.tool[data-tool]').forEach(b => b.onclick = () => {\n    ui.tool = b.dataset.tool; ui.bondFrom = null; ui.kinFrom = null; syncToolButtons();\n    render();\n    if (ui.tool === 'add') toast('在画布空白处点击即可放置新成员', 2600);\n    if (ui.tool === 'bond') toast('依次点击两位成员，为他们添加情感关系线', 2600);\n    if (ui.tool === 'kin') toast('依次点击两位成员，为他们添加血缘关系线', 2600);\n    if (ui.tool === 'hand') toast('拖动画布即可平移；「框选」工具下按住空格或 Alt 拖动同样可以平移', 2600);\n  });\n  const actions = {\n    addPartner: needSelection(actAddPartner),\n    addParents: needSelection(actAddParents),\n    addChild: needSelection(actAddChild),\n    addSibling: needSelection(actAddSibling),\n    addSpouseParents: needSelection(actAddSpouseParents),\n    focus: needSelection(id => { state.focalId = id; ui.structVer++; commit(); toast('已设为中心人物「我」'); }),\n    duplicate: needSelection(actDuplicate),\n    delete: needSelection(actDelete)\n  };\n  $$('.tool[data-act]').forEach(b => b.onclick = () => {\n    const f = actions[b.dataset.act];\n    if (f) f();\n  });\n\n  $('#btnUndo').onclick = undo;\n  $('#btnRedo').onclick = redo;\n  $('#btnTidy').onclick = () => {\n    if (guard()) return;\n    state.people.forEach(p => delete p.off);\n    commit(); fitView();     draft = JSON.parse(JSON.stringify(EMBEDDED_STATE));\n    draft.locked = false;                     // 副本是拿来继续改的，不再保持「仅查看」\n  }\n  state = draft || starterState();\n  if (!state.focalId && state.people.length) state.focalId = state.people[0].id;\n  $('#docTitle').value = state.title || '我的家谱';\n  history = { stack: [], index: -1 };\n  pushHistory();\n  ui.sel = null;\n  ui.structVer = 1;\n  bindUI();\n  bindCanvas();\n  // 视图开关的初始状态以 ui 为准（图例默认关闭，见 app-core.js）\n  $('#chkShowLegend').checked = ui.showLegend;\n  $('#chkShowTerm').checked = ui.showTerm;\n  $('#chkShowNote').checked = ui.showNote;\n  relayoutRender();\n  fitView();\n  if (state.people.length <= 1) {\n    const hint = $('#canvasHint');\n    hint.textContent = '提示：选中「我」，点节点上方的 ＋ 添加父母，左右加配偶/兄弟姐妹，下方加子女';\n    hint.classList.add('show');\n    setTimeout(() => hint.classList.remove('show'), 7000);\n  }\n}\ndocument.addEventListener('DOMContentLoaded', init);\n<\/script>\n<\/body>\n<\/html>\n";
const EMBEDDED_STATE = null;

/* 婚姻状态 */
const COUPLE_STATUS = {
  married: { label: '婚姻', draw: 'solid' },
  cohabit: { label: '同居', draw: 'dash' },
  engaged: { label: '订婚', draw: 'dot' },
  separated: { label: '分居', draw: 'slash1' },
  divorced: { label: '离异', draw: 'slash2' },
  widowed: { label: '丧偶', draw: 'slash1' }
};

/* 亲子关系 */
const PARENT_TYPE = {
  bio: { label: '亲生', draw: 'solid' },
  adopt: { label: '收养', draw: 'dash' },
  foster: { label: '寄养', draw: 'dot' },
  step: { label: '继子女', draw: 'dashdot' }

/* 情感关系 */
const BOND_TYPE = {
  close: { label: '亲密', color: '#2f8f6b' },
  fused: { label: '融合 / 纠缠', color: '#7c3aed' },
  distant: { label: '疏远', color: '#8a94a4' },
  conflict: { label: '冲突', color: '#d97706' },
  cutoff: { label: '断绝来往', color: '#dc2626' },
  enmity: { label: '敌对', color: '#b91c1c' }
};

/* 血缘关系线（自定义血缘）
   delta ＝「后点的人」相对「先点的人」的辈分差：+1 表示后点的人低一辈，−1 高一辈，0 同辈。
   生 / 被生 是一对镜像：同样一条「长辈 → 晚辈」的线，选哪个取决于你先后点了谁。
   自定义 只提供一个辈分差 n，不说明具体是什么亲戚——自动排列不会拿它当亲子 / 兄弟姐妹去解释，
   只按 n 把对方挂到合理辈分上。 */
const KIN_TYPE = {
  birth: { label: '生', delta: 1, draw: 'solid', color: '#8a5a2b', hint: '先点的人是长辈，后点的人是他／她生的' },
  begotten: { label: '被生', delta: -1, draw: 'solid', color: '#8a5a2b', hint: '先点的人是晚辈，后点的人是他／她的父母' },
  sibling: { label: '兄弟姐妹', delta: 0, draw: 'double', color: '#1f7a6a', hint: '两人同辈' },
  adopt: { label: '领养', delta: 1, draw: 'dash', color: '#8a5a2b', hint: '先点的人是养父母（长辈），后点的人是被领养的一方' },
  succession: { label: '过继', delta: 1, draw: 'dashdot', color: '#8a5a2b', hint: '先点的人是嗣父母（长辈），后点的人过继到其名下' },
  custom: { label: '自定义', delta: 0, draw: 'dot', color: '#6b7688', hint: '自己定辈分差，不说明具体是什么亲戚' }
};

/** 一条关系线给「后点的人」带来的辈分差 */
function kinDelta(k) {
  if (!k) return 0;
  const t = KIN_TYPE[k.type];
  if (k.type === 'custom') { const n = Math.round(Number(k.n)); return isFinite(n) ? Math.max(-6, Math.min(6, n)) : 0; }
  return t ? t.delta : 0;
}
function kinOf(id) { return (state.kins || []).filter(k => k.a === id || k.b === id); }
/** 关系线另一头是谁 */
function otherEnd(k, id) { return k.a === id ? k.b : k.a; }
/** 关系线标签：自定义优先显示用户写的字，没写就按辈分差描述 */
function kinLabel(k) {
  if (!k) return '';
  if (k.type !== 'custom') return (KIN_TYPE[k.type] || {}).label || '';
  const txt = (k.text || '').trim();
  const n = kinDelta(k);
  const gap = n === 0 ? '同辈' : (n > 0 ? '低 ' + n + ' 辈' : '高 ' + (-n) + ' 辈');
  return txt ? txt + '（' + gap + '）' : gap;
}

/* 健康状况常用配色（可自定义） */
const COND_COLORS = ['#4a7fd4', '#d4628f', '#e0a30b', '#2f8f6b', '#7c3aed', '#c2410c',
  '#0e7490', '#9d174d', '#4d7c0f', '#57534e'];

/* ---------------- 状态 ---------------- */
let state = null;         // 家谱数据
let view = { zoom: 1, x: 0, y: 0 };   // 视图变换
let ui = {
  tool: 'select', sel: null, selSet: [], bondFrom: null, kinFrom: null,
  // 图例默认关掉：刚打开时那几行图例挡在画布右上角，碍着看谱；要用时在左侧「视图」里勾上
  showLegend: false, showTerm: true, showNote: false,
  layout: null, bounds: null
};
let history = { stack: [], index: -1 };

/* ---------------- 选择（支持框选多选） ----------------
   ui.sel    ── 主选中项，属性面板与「加父母 / 加子女」等操作的对象
   ui.selSet ── 全部被选中的人；只有一个时与 ui.sel 相同 */
function isSelected(id) {
  return (ui.selSet && ui.selSet.length) ? ui.selSet.indexOf(id) >= 0 : ui.sel === id;
}
/** 设定选中集合；primary 缺省取最后一个。传空数组即取消选择 */
function setSelection(ids, primary) {
  ui.selSet = (ids || []).filter(id => person(id));
  ui.sel = (primary && person(primary)) ? primary
    : (ui.selSet.length ? ui.selSet[ui.selSet.length - 1] : null);
  ui.structVer = (ui.structVer || 0) + 1;
}
/** 撤销 / 载入数据后，把已经不存在的人从选中集合里剔掉 */

/* ==========================================================================

   ========================================================================== */
function emptyState(title) {
  return {
    version: 1,
    title: title || '我的家谱',
    focalId: null,
    locked: false,          // 「仅查看」锁定，随文件一起保存
    faintNatal: true,       // 出嫁 / 入赘者在本家（母族）的亲子关系，用极淡虚线表示
    people: [], couples: [], links: [], bonds: [], kins: []
  };
}

function person(id) { return state.people.find(p => p.id === id) || null; }
function couple(id) { return state.couples.find(c => c.id === id) || null; }
function couplesOf(id) { return state.couples.filter(c => c.a === id || c.b === id); }
function spouseOf(id) {
  return couplesOf(id).map(c => (c.a === id ? c.b : c.a));
}
function linksOfChild(id) { return state.links.filter(l => l.child === id); }
function partnerIn(c, id) { return c.a === id ? c.b : c.a; }
function displayName(p) { return p ? (p.name && p.name.trim() ? p.name : '（未命名）') : '（未知）'; }

/** 某人的父母 id 列表 */
function parentsOf(id) {
  const out = [];
  for (const l of linksOfChild(id)) {
    if (l.couple) {
      const c = couple(l.couple);
      if (c) { if (!out.includes(c.a)) out.push(c.a); if (!out.includes(c.b)) out.push(c.b); }
    } else if (l.parent && !out.includes(l.parent)) out.push(l.parent);
  }
  return out;
}
/** 某人的子女 id 列表（含其夫妻关系中的子女） */
function childrenOf(id) {
  const out = [];
  for (const l of state.links) {
    if (l.couple) { const c = couple(l.couple); if (c && (c.a === id || c.b === id)) { if (!out.includes(l.child)) out.push(l.child); } }
    else if (l.parent === id && !out.includes(l.child)) out.push(l.child);
  }
  return out;
}
/** 兄弟姐妹（共享同一父母关系） */
function siblingsOf(id) {
  const out = [];
  const refs = linksOfChild(id).map(l => l.couple ? 'c:' + l.couple : 'p:' + l.parent);
  for (const l of state.links) {
    const key = l.couple ? 'c:' + l.couple : 'p:' + l.parent;
    if (refs.includes(key) && l.child !== id && !out.includes(l.child)) out.push(l.child);
  }
  return out;
}
function firstParentRef(id) {
  const l = linksOfChild(id)[0];
  return l ? (l.couple ? l.couple : l.parent) : null;
}
function isAncestorOf(anc, node) {
  if (anc === node) return true;
  const seen = new Set();
  const walk = (x) => {
    if (seen.has(x)) return false; seen.add(x);
    for (const p of parentsOf(x)) { if (p === anc || walk(p)) return true; }
    return false;
  };

}

/* 供 Kin 模块使用的适配器 */
const KinGraph = {
  person: id => person(id),
  parentsOf, childrenOf, siblingsOf,
  spousesOf: id => spouseOf(id),
  elderBetween: (a, b) => elderBetween(a, b)   // 年龄未知时，称呼的长幼改由「兄弟排行」决定

/* ---------------- 增删改 ---------------- */
function addPerson(opts) {
  const p = Object.assign({
    id: uid('p'), name: '', term: '', gender: GENDER_U, born: '', died: '', rank: '',
    deceased: false, trans: false, orientation: '', ruzhui: false, conditions: [], note: ''
  }, opts || {});

}
function addCouple(a, b, status) {
  const existing = state.couples.find(c => (c.a === a && c.b === b) || (c.a === b && c.b === a));
  if (existing) return existing;
  const c = { id: uid('c'), a, b, status: status || 'married' };

}
function addLink(parentRef, childId, type) {

  if (typeof parentRef === 'string' && parentRef.startsWith('c_')) l.couple = parentRef;
  else if (parentRef && couple(parentRef)) l.couple = parentRef;

  state.links.push(l);

}
/** 找出「某人/某夫妻」当前使用的亲子关系引用 */
function parentRefOf(id, preferCoupleWith) {
  if (preferCoupleWith) {
    const c = state.couples.find(x => (x.a === id && x.b === preferCoupleWith) || (x.b === id && x.a === preferCoupleWith));
    if (c) return c.id;
  }
  const l = linksOfChild(id)[0];
  if (l) return l.couple || l.parent;
  const cs = couplesOf(id);
  return cs.length ? cs[0].id : id;
}
function removePerson(id) {
  // 先找出「因删人而解体」的夫妻，并记下仍在世的一方
  const broken = state.couples.filter(c => c.a === id || c.b === id);
  const survivor = {};
  broken.forEach(c => { survivor[c.id] = partnerIn(c, id); });
  const gone = new Set(broken.map(c => c.id));

  state.couples = state.couples.filter(c => !gone.has(c.id));
  state.links = state.links.filter(l => {
    if (l.child === id) return false;               // 本人作为子女的连线
    if (l.parent === id) return false;              // 本人作为单亲家长的连线
    if (l.couple && gone.has(l.couple)) {
      // 夫妻一方被删：子女改挂到仍在世的一方，亲子关系不丢
      const s = survivor[l.couple];
      if (s && person(s)) { l.couple = null; l.parent = s; return true; }
      return false;
    }
    return true;                                    // 其余关系一律保留
  });
  state.bonds = state.bonds.filter(b => b.a !== id && b.b !== id);
  if (state.kins) state.kins = state.kins.filter(k => k.a !== id && k.b !== id);
  state.people = state.people.filter(p => p.id !== id);
  if (state.focalId === id) state.focalId = null;
}
function removeBond(id) { state.bonds = state.bonds.filter(b => b.id !== id); }
function removeKin(id) { state.kins = (state.kins || []).filter(k => k.id !== id); }

/* ==========================================================================
   自动布局
   ========================================================================== */

/** 辈分行号：以中心人物为基准推算，同辈必然同行。
 *
 *  规则：中心人物 = 0，父母 = −1，子女 = +1，配偶与兄弟姐妹 = 同辈。
 *  从中心人物出发做一次广度传播，最后整体平移到最小值为 0，得到行号。
 *
 *  为什么不按「无父母者 = 0」的老办法：那样算出来的是「离本支最早祖先有多远」，
 *  而不是「比『我』高几辈」。外祖父母一支若记得浅（只记到外公，再往上的没录），
 *  外公就会被当成第 0 代，与曾祖父挤在同一行，而他到妈妈之间的线也要多跨一行。
 *  以中心人物推算后，外公 = −2、妈妈 = −1，辈分相同的人自然齐平。 */
function computeGenerations() {
  const v = new Map();
  const valid = new Set(state.people.map(p => p.id));
  let queue = [];
  const put = (id, val) => {
    if (!valid.has(id) || v.has(id)) return;
    v.set(id, val);
    queue.push(id);
  };

  /* ① 以中心人物为基准做一致性传播 */
  if (state.focalId && valid.has(state.focalId)) put(state.focalId, 0);
  for (let qi = 0; qi < queue.length; qi++) {
    const id = queue[qi];
    const g = v.get(id);
    parentsOf(id).forEach(p => put(p, g - 1));
    childrenOf(id).forEach(c => put(c, g + 1));
    spouseOf(id).forEach(s => put(s, g));
    siblingsOf(id).forEach(s => put(s, g));
  }

  /* ①′ 关系线：把只靠关系线连着的成员挂到合理辈分上。
        规矩是「结构优先」——父母 / 子女 / 配偶 / 兄弟姐妹算出来的辈分不动，
        关系线只补结构没覆盖到的人；所以被关系者等于挂在主体家族旁边的一个「挂件」，
        辈分对了，但不会并进那个家族的子树里去。
        补完之后新落位的人还可能带着自己的父母 / 子女 / 配偶，所以整段反复跑到不再有人落位。 */
  if ((state.kins || []).length) {
    for (let pass = 0; pass < 12; pass++) {
      const before = v.size;
      const q = [];
      v.forEach((val, id) => q.push(id));
      // (a) 先把已有的结构闭包补完
      for (let qi0 = 0; qi0 < q.length; qi0++) {
        const id = q[qi0], g0 = v.get(id);
        const add = (o, d) => { if (o && valid.has(o) && !v.has(o)) { v.set(o, g0 + d); q.push(o); } };
        parentsOf(id).forEach(p => add(p, -1));
        childrenOf(id).forEach(c => add(c, 1));
        spouseOf(id).forEach(s => add(s, 0));
        siblingsOf(id).forEach(s => add(s, 0));
      }
      // (b) 再看关系线：只补 (a) 没算到的人
      const q2 = [];
      v.forEach((val, id) => q2.push(id));
      for (let i = 0; i < q2.length; i++) {
        const id = q2[i], g0 = v.get(id);
        kinOf(id).forEach(k => {
          const o = otherEnd(k, id);
          const d = kinDelta(k) * (k.a === id ? 1 : -1);   // 对方相对我的辈分差
          if (o && valid.has(o) && !v.has(o)) { v.set(o, g0 + d); q2.push(o); }
        });
      }
      if (v.size === before) break;
    }
  }

  /* ② 与中心人物不连通的分支：退回「无父母者 0」的拓扑代数，再整体对齐。
        没有中心人物时全体走这条路，与旧行为一致。
        只有「牵涉关系线的那些分支」换成一次相对辈分的传播，好让一连串关系线
        （甲同辈乙、乙生丙、丙又差三辈丁……）内部的高下严格对得上各自的辈分差；
        不牵涉关系线的分支走的还是原来那套，行为一点没变。 */
  if (state.people.some(p => !v.has(p.id))) {
    const memo = new Map(), visiting = new Set();
    const left = state.people.filter(p => !v.has(p.id)).map(p => p.id);
    const leftSet = new Set(left);

    function solvedByKin(id) {
      return (state.kins || []).some(k => (k.a === id && leftSet.has(k.b)) || (k.b === id && leftSet.has(k.a)));
    }
    const rel = new Map();
    left.forEach(start => {
      if (rel.has(start) || !solvedByKin(start)) return;
      const comp = [start], q = [start];
      rel.set(start, 0);
      for (let i = 0; i < q.length; i++) {
        const id = q[i]; comp.push(id);
        const push = (o, d) => { if (o && leftSet.has(o) && !rel.has(o)) { rel.set(o, rel.get(id) + d); q.push(o); } };
        parentsOf(id).forEach(p => push(p, -1));
        childrenOf(id).forEach(c => push(c, 1));
        spouseOf(id).forEach(s => push(s, 0));
        siblingsOf(id).forEach(s => push(s, 0));
        kinOf(id).forEach(k => push(otherEnd(k, id), kinDelta(k) * (k.a === id ? 1 : -1)));
      }
      // 这一伙人里辈分最低的那个落在 0，和老办法「无父母者 0」的观感一致
      let m = Infinity;
      comp.forEach(id => { const x = rel.get(id); if (x < m) m = x; });
      if (!isFinite(m)) m = 0;
      comp.forEach(id => memo.set(id, rel.get(id) - m));
    });

    function topo(id) {
      if (memo.has(id)) return memo.get(id);
      if (visiting.has(id)) return 0;
      visiting.add(id);
      let g = 0;
      for (const p of parentsOf(id)) g = Math.max(g, topo(p) + 1);
      visiting.delete(id);
      memo.set(id, g);
      return g;
    }
    state.people.forEach(p => topo(p.id));
    let base = 0;
    if (v.size) { let m = Infinity; v.forEach(x => { if (x < m) m = x; }); base = m; }
    state.people.forEach(p => { if (!v.has(p.id)) v.set(p.id, memo.get(p.id) + base); });
  }

  /* ③ 平移到 0 起步的行号 */
  let min = Infinity;
  v.forEach(x => { if (x < min) min = x; });
  if (!isFinite(min)) min = 0;
  const rows = new Map();
  v.forEach((val, id) => rows.set(id, val - min));
  return rows;
}

/** 判定一对夫妻中谁是「本家」（承接血亲线的一侧） */
function tentativeAnchor(c) {
  const has = id => linksOfChild(id).length > 0;
  const a = c.a, b = c.b;
  // 入赘优先：男方到女方家，门户按女方算，男方按「嫁进来」的一方处理
  const ra = isRuzhui(a), rb = isRuzhui(b);
  if (ra !== rb) return ra ? b : a;
  const ha = has(a), hb = has(b);
  if (ha && !hb) return a;
  if (hb && !ha) return b;
  const na = !has(a) ? 0 : -1, nb = !has(b) ? 0 : -1;
  // 若某人是中心人物的直系祖先，优先作为锚点
  const fa = state.focalId ? isAncestorOf(a, state.focalId) : false;
  const fb = state.focalId ? isAncestorOf(b, state.focalId) : false;
  if (fa !== fb) return fa ? a : b;
  const da = ancestorDepth(a), db = ancestorDepth(b);
  if (da !== db) return da > db ? a : b;
  const ga = person(a), gb = person(b);
  if (ga && gb && ga.gender !== gb.gender) return ga.gender === GENDER_M ? a : b;
  return a;
}
function ancestorDepth(id, depth) {
  depth = depth || 0;
  if (depth > 20) return depth;
  const ps = parentsOf(id);
  if (!ps.length) return 0;
  return 1 + Math.max.apply(null, ps.map(p => ancestorDepth(p, depth + 1)));
}

function buildUnits() {
  const anchors = new Map();
  state.couples.forEach(c => anchors.set(c.id, tentativeAnchor(c)));

  // 若某人作为「非锚点配偶」出现在两对以上关系中（再婚），改由他/她来当锚点
  const cnt = {};
  state.couples.forEach(c => {
    const A = anchors.get(c.id), B = partnerIn(c, A);
    cnt[B] = (cnt[B] || 0) + 1;
  });
  state.couples.forEach(c => {
    const A = anchors.get(c.id), B = partnerIn(c, A);
    if (cnt[B] >= 2) anchors.set(c.id, B);
  });

  const isAnchorOfAny = new Set(Array.from(anchors.values()));
  const owner = {};
  state.people.forEach(p => owner[p.id] = p.id);
  state.couples.forEach(c => {
    const A = anchors.get(c.id), B = partnerIn(c, A);
    if (!isAnchorOfAny.has(B) && owner[B] === B) owner[B] = A;
  });

  // 组装单元
  const units = {};
  state.people.forEach(p => {
    if (owner[p.id] === p.id) units[p.id] = { anchor: p.id, cells: [p.id], couples: [], groups: [] };
  });
  state.people.forEach(p => {
    const A = owner[p.id];
    if (A !== p.id && units[A]) units[A].cells.push(p.id);

  // 单元内顺序：本家为男性时配偶在右，为女性时配偶在左，多配偶依次向外
  Object.values(units).forEach(u => {
    const A = u.anchor;
    const partners = state.couples.filter(c => (c.a === A || c.b === A))
      .map(c => ({ c, B: partnerIn(c, A) }))
      .filter(x => owner[x.B] === A);
    const aMale = person(A) && person(A).gender === GENDER_M;
    const left = [], right = [];
    partners.forEach((x, i) => {
      if (i === 0) (aMale ? right : left).push(x);
      else if (i % 2 === 1) right.push(x);
      else left.unshift(x);
    });
    u.cells = left.map(x => x.B).concat([A], right.map(x => x.B));
    // 夫左妻右：一对夫妻里把丈夫排在左边。两人才好换；多段婚姻仍按「本家在中间、配偶依次向外」保持读得通
    if (u.cells.length === 2) {
      const p0 = person(u.cells[0]), p1 = person(u.cells[1]);
      if (p0 && p1 && p0.gender !== GENDER_M && p1.gender === GENDER_M) {
        u.cells = [u.cells[1], u.cells[0]];
      }
    }
    u.couples = left.concat(right).sort((x, y) => u.cells.indexOf(x.B) - u.cells.indexOf(y.B)).map(x => x.c);
    u.partnerOf = {};
    left.concat(right).forEach(x => u.partnerOf[x.B] = x.c.id);
  });

  Object.values(units).forEach(u => {
    const seen = new Set();
    u.groups = [];
    u.couples.forEach(c => {
      const kids = state.links.filter(l => l.couple === c.id).map(l => l.child).filter(k => !seen.has(k));
      kids.forEach(k => seen.add(k));
      if (kids.length) u.groups.push({ ref: c.id, couple: c, kids: sortKids(kids) });
    });
    const solo = state.links.filter(l => l.parent === u.anchor).map(l => l.child).filter(k => !seen.has(k));
    if (solo.length) u.groups.push({ ref: u.anchor, couple: null, kids: sortKids(solo) });
  });

  return { units, owner, anchors };
}
/** 同辈组（兄弟姐妹，含本人） */

/** 出生年（整数）；没填或填了非数字返回 null */
function bornYear(id) {
  const p = person(id);

  return isNaN(y) ? null : y;
}
/** 手工填写的排行（1＝同辈中最大）；未填返回 null */
function manualRank(id) {
  const p = person(id);

/**
 * 同辈排序：年长者始终在前。

 *   2. 没填出生年、但填了「兄弟排行」的人，把排行当作「他在这一辈里排第几」的直接声明，
 *      据此占住对应位次（排行 1 → 第一个）；
 *   3. 两样都没有的人垫在最后，保持录入次序。

      u.groups.forEach(g => {

        g.kids.forEach(cid => {

            // 嫁出 / 入赘的子女本人算在配偶那一族，这里只按姊妹排行留一个位子
            if (withSlot && units[o]) { w += SLOT_W + (k ? DX_SIB : 0); k++; }

          }

    }

    function place(id, left, top) {
      const u = units[id];

      const w = unitWidth(id);
      const cellsW = (u.cells.length - 1) * DX_PAIR + SYM;
      const startX = left + (w - cellsW) / 2 + SYM / 2;
      u.cells.forEach((pid, i) => { p2[pid] = { x: startX + i * DX_PAIR, y: top }; });

      const childTop = top + DY;
      const groups = [];
      u.groups.forEach(g => {
        // 留在本家的子女 + 嫁出去者的姊妹位，一起参与排布
        const kids = g.kids.filter(cid => (owner[cid] === cid && units[cid]) ||

            slots[cid] = { x: kx + SLOT_W / 2, y: childTop };
            kx += SLOT_W + DX_SIB;

          }
          const kw = unitWidth(cid);

    }

    let cursor = 0;
    rootOrder.forEach(id => {
      if (p2[id]) return;

      place(id, cursor, (gen.get(id) || 0) * DY);
      cursor += w + 90;

    state.people.forEach(p => {
      if (p2[p.id]) return;
      const A = owner[p.id];
      if (p2[A]) { p2[p.id] = { x: p2[A].x + DX_PAIR, y: p2[A].y }; return; }
    });
    state.people.forEach(p => {
      if (!p2[p.id]) { p2[p.id] = { x: cursor, y: (gen.get(p.id) || 0) * DY }; cursor += DX_PAIR; }

  const roots = state.people
    .filter(p => owner[p.id] === p.id && !linksOfChild(p.id).length)
    .map(p => p.id);

  const ordered = orderRootsByKin(roots, owner);

  function finish(order) {
    const lay = layoutWith(order);
    const full = lay.pos, slots = lay.slots;
    state.people.forEach(p => { if (full[p.id]) pos[p.id] = full[p.id]; });

    // 手动微调偏移
    state.people.forEach(p => {
      if (p.off && pos[p.id]) { pos[p.id].x += p.off[0]; pos[p.id].y += p.off[1]; }
    });

    const b = { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9 };
    state.people.forEach(p => {
      const q = pos[p.id]; if (!q) return;
      b.x0 = Math.min(b.x0, q.x - SYM - 30); b.x1 = Math.max(b.x1, q.x + SYM + 30);
      b.y0 = Math.min(b.y0, q.y - SYM - 34); b.y1 = Math.max(b.y1, q.y + SYM + 52);
    });
    if (b.x0 > b.x1) { b.x0 = 0; b.y0 = 0; b.x1 = 600; b.y1 = 400; }
    ui.layout = { pos, units, owner, gen, slots };
    ui.bounds = b;
    return ui.layout;
  }

  if (p.orientation === 'gay') extra += `<path d="M${s/2} ${s*0.28} L${s*0.72} ${s*0.68} L${s*0.28} ${s*0.68} Z" fill="#33415c" opacity="0.85"/>`;
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}">${shape}${extra}</svg>`;

/* 图例用的小图形（中心在 (13,0)） */
const LG = {
  square: () => `<rect x="4" y="-9" width="18" height="18" rx="2" fill="none" stroke="#33415c" stroke-width="2"/>`,
  circle: () => `<circle cx="13" cy="0" r="9" fill="none" stroke="#33415c" stroke-width="2"/>`,
  diamond: () => `<path d="M13 -10 L23 0 L13 10 L3 0 Z" fill="none" stroke="#33415c" stroke-width="2"/>`
};

function lineDash(draw) {  if (draw === 'dash') return '8 6';

/** 生成整幅图的 SVG 内容 */
function contentMarkup(opts) {
  opts = opts || {};
  const L = ui.layout || computeLayout();
  const pos = L.pos, b = ui.bounds;
  const forExport = !!opts.export;
  let out = '';

  /* ---- 情感关系线（绘于底层） ---- */
  let bonds = '';
  state.bonds.forEach(bd => {
    const p1 = pos[bd.a], p2 = pos[bd.b];
    if (!p1 || !p2) return;
    const t = BOND_TYPE[bd.type] || BOND_TYPE.close;
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const bow = Math.min(46, len * 0.16);
    const cx = mx + nx * bow, cy = my + ny * bow;
    const base = { stroke: t.color, 'stroke-width': 1.8, fill: 'none', 'stroke-linecap': 'round' };
    const attr = o => Object.entries(Object.assign({}, base, o)).map(([k, v]) => `${k}="${v}"`).join(' ');
    const q = (off) => `M${p1.x + nx*off} ${p1.y + ny*off} Q${cx + nx*off} ${cy + ny*off} ${p2.x + nx*off} ${p2.y + ny*off}`;

    if (bd.type === 'close' || bd.type === 'fused') {
      const n = bd.type === 'fused' ? 3 : 2;
      for (let i = 0; i < n; i++) bonds += `<path d="${q((i - (n - 1) / 2) * 3.4)}" ${attr({})}/>`;
    } else if (bd.type === 'distant') {
      bonds += `<path d="${q(0)}" ${attr({ 'stroke-dasharray': '7 6' })}/>`;
    } else if (bd.type === 'conflict' || bd.type === 'enmity') {
      const N = 26, amp = 4.6;
      let pts = [];
      for (let i = 0; i <= N; i++) {
        const u = i / N, iu = 1 - u;
        const px = iu*iu*p1.x + 2*iu*u*cx + u*u*p2.x, py = iu*iu*p1.y + 2*iu*u*cy + u*u*p2.y;
        const s = (i % 2 ? 1 : -1) * amp * Math.sin(Math.PI * u);
        pts.push([px + nx * s, py + ny * s]);
      }
      bonds += `<polyline points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" ${attr({ 'stroke-width': 1.6 })}/>`;
      if (bd.type === 'enmity') bonds += `<path d="${q(0)}" ${attr({ 'stroke-width': 1.6, 'marker-end': '' })} opacity="0"/>`;
    } else if (bd.type === 'cutoff') {
      const N = 30, seg1 = [], seg2 = [];
      for (let i = 0; i <= N; i++) {
        const u = i / N, iu = 1 - u;
        const px = iu*iu*p1.x + 2*iu*u*cx + u*u*p2.x, py = iu*iu*p1.y + 2*iu*u*cy + u*u*p2.y;
        if (u <= 0.4) seg1.push([px, py]); else if (u >= 0.6) seg2.push([px, py]);

  /* ---- 夫妻线 ---- */
  let cls = '';
  state.couples.forEach(c => {
    const pa = pos[c.a], pb = pos[c.b];
    if (!pa || !pb) return;
    const st = COUPLE_STATUS[c.status] || COUPLE_STATUS.married;
    const dash = lineDash(st.draw);
    const y = pa.y;
    let d;
    if (Math.abs(pa.y - pb.y) < 1) {
      // 同行：直接连（若中间隔着别人，绕到下方）
      const between = state.people.some(p => pos[p.id] && Math.abs(pos[p.id].y - y) < 1 &&
        pos[p.id].x > Math.min(pa.x, pb.x) + SYM && pos[p.id].x < Math.max(pa.x, pb.x) - SYM);
      if (!between) d = `M${pa.x} ${y} L${pb.x} ${y}`;
      else {
        const yy = y + SYM + 20;
        const x1 = pa.x + (pb.x > pa.x ? SYM * 0.6 : -SYM * 0.6);
        const x2 = pb.x + (pb.x > pa.x ? -SYM * 0.6 : SYM * 0.6);
        d = `M${x1} ${y} L${x1} ${yy} L${x2} ${yy} L${x2} ${y}`;
      }
    } else {
      const yy = Math.max(pa.y, pb.y) + SYM + 22;
      const x1 = pa.x + (pb.x >= pa.x ? SYM * 0.6 : -SYM * 0.6);
      const x2 = pb.x + (pb.x >= pa.x ? -SYM * 0.6 : SYM * 0.6);
      d = `M${x1} ${pa.y} L${x1} ${yy} L${x2} ${yy} L${x2} ${pb.y}`;
    }
    cls += `<path d="${d}" fill="none" stroke="#33415c" stroke-width="1.8" stroke-linejoin="round" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
    // 婚姻状态符号
    const mx = (pa.x + pb.x) / 2, segY = (Math.abs(pa.y - pb.y) < 1) ? y : Math.max(pa.y, pb.y) + SYM + 22;
    if (st.draw === 'slash1' || st.draw === 'slash2') {
      const n = st.draw === 'slash2' ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const ox = mx + (i - (n - 1) / 2) * 9;
        cls += `<path d="M${ox - 6} ${segY + 6} L${ox + 6} ${segY - 6}" stroke="#33415c" stroke-width="2" stroke-linecap="round"/>`;
      }

    }

  /* ---- 亲子线 ---- */

  state.links.forEach(l => {

    (groups[key] = groups[key] || []).push(l);
  });
  const bars = [];          // 待绘制的「父母 → 子女」支架
  const slots = faintNatalOn() ? (L.slots || {}) : {};
  Object.entries(groups).forEach(([key, ls]) => {
    let anchorPt = null;
    if (key.startsWith('c:')) {
      const c = couple(key.slice(2));
      if (!c) return;
      const pa = pos[c.a], pb = pos[c.b];
      if (!pa || !pb) return;
      if (Math.abs(pa.y - pb.y) < 1) anchorPt = { x: (pa.x + pb.x) / 2, y: pa.y + (hasCrossing(c, pos) ? SYM + 20 : 0) };
      else anchorPt = { x: (pa.x + pb.x) / 2, y: Math.max(pa.y, pb.y) + SYM + 22 };
    } else {
      const q = pos[key.slice(2)];
      if (!q) return;
      anchorPt = { x: q.x, y: q.y + SYM };
    }
    const all = ls.map(l => ({ l, q: pos[l.child], slot: slots[l.child] })).filter(k => k.q);
    if (!all.length) return;
    // 嫁出 / 入赘的子女：本人在配偶那一族，这里只在父母横杆上按姊妹排行留一个位子（m.x / m.y）
    const byRow = {};
    all.forEach(k => {
      const m = { k, x: k.slot ? k.slot.x : k.q.x, y: k.slot ? k.slot.y : k.q.y };
      (byRow[m.y] = byRow[m.y] || []).push(m);
    });
    Object.values(byRow).forEach(row => {
      const childY = Math.min.apply(null, row.map(m => m.y)) - SYM;
      // 横杆必须横跨「长辈轴心」与全部子女在本家的位置（嫁出者用她的姊妹位），
      // 这样她的连线与前后的兄弟姐妹是同一条横杆、同一个起点，地位完全相同
      const bx0 = Math.min(Math.min.apply(null, row.map(m => m.x)), anchorPt.x);
      const bx1 = Math.max(Math.max.apply(null, row.map(m => m.x)), anchorPt.x);
      const natural = anchorPt.y + Math.max(26, (childY - anchorPt.y) * 0.42);

  const settled = [];
  bars.forEach(g => {
    let y = g.barY, guard = 0;
    while (guard++ < 60 && settled.some(p =>

    g.barY = Math.min(y, g.childY - 18);

  /** 竖线穿横杆时画「跳线」半圆，避免看成接点 */
  function vpath(x, y1, y2) {
    const cross = settled.filter(s => s.x0 - 1 <= x && x <= s.x1 + 1 && s.y > y1 + 3 && s.y < y2 - 3)
      .map(s => s.y).sort((a, b) => a - b);
    let d = `M${x} ${y1}`;

  }
  /* ---- 父母 → 子女：实线照旧；出嫁 / 入赘的那一条改用极淡虚线，但走法完全一样 ----
     她从父母横杆上「自己的姊妹位」出发（跟兄弟姐妹同一个起点、同一条横杆），
     直角转弯（竖 → 横 → 竖）绕到配偶那一族里她本人的符号顶端。

  let pl = '', faintPl = '';

  bars.forEach(g => {
    pl += `<path d="${vpath(g.anchorPt.x, g.anchorPt.y, g.barY)}" fill="none" stroke="#33415c" stroke-width="1.8"/>`;
    pl += `<path d="M${g.bx0} ${g.barY} L${g.bx1} ${g.barY}" fill="none" stroke="#33415c" stroke-width="1.8"/>`;
    g.row.forEach(m => {
      const k = m.k;
      if (k.slot) {
        // 姊妹位 → 直角转弯 → 她本人的符号顶端
        const y0 = g.barY, x1 = k.q.x, y1 = k.q.y - SYM;
        // 转弯的横线走在「父母那一行」与「子女那一行」之间，避开子女的称呼小字
        const midY = Math.max(y0 + 12, Math.min(y0 + (y1 - y0) * 0.5, y1 - 12));
        const ry = midY.toFixed(1);
        faintPl += `<path d="M${m.x.toFixed(1)} ${y0.toFixed(1)} L${m.x.toFixed(1)} ${ry} L${x1.toFixed(1)} ${ry} L${x1.toFixed(1)} ${y1.toFixed(1)}" ` +
          `fill="none" stroke="#b3c3d8" stroke-width="1.5" stroke-dasharray="5 6" stroke-linecap="round" stroke-linejoin="round"/>`;
        nFaint++;
        return;
      }
      const t = PARENT_TYPE[k.l.type] || PARENT_TYPE.bio;
      const dash = lineDash(t.draw);
      pl += `<path d="${vpath(m.x, g.barY, m.y - SYM)}" fill="none" stroke="#33415c" stroke-width="1.8" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;

     一条线 = 一句「先点的人 → 后点的人」的血缘声明，中点挂一个小标签说明是什么关系。
     两端各留出 SYM 的空档，线不压到符号上。 */
  let kins = '';
  (state.kins || []).forEach(k => {
    const p1 = pos[k.a], p2 = pos[k.b];
    if (!p1 || !p2) return;
    const t = KIN_TYPE[k.type] || KIN_TYPE.custom;
    const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const gp = Math.min(SYM + 7, Math.max(0, (len - 26) / 2));

        : t.draw === 'dot' ? ' stroke-dasharray="2 5"' : '';
    const line = o =>
      `<path d="M${(x1 + (uy * o)).toFixed(1)} ${(y1 - (ux * o)).toFixed(1)} L${(x2 + (uy * o)).toFixed(1)} ${(y2 - (ux * o)).toFixed(1)}" ` +
      `stroke="${t.color}" stroke-width="1.7" fill="none" stroke-linecap="round"${dash}/>`;
    if (t.draw === 'double') kins += line(-3) + line(3);
    else kins += line(0);
    // 箭头指向「后点的人」，让「生 / 被生」这类方向一眼看得出来；兄弟姐妹是对称的，不画箭头
    if (t.draw !== 'double') {
      const a = 9, w = 5.2;
      kins += `<path d="M${x2.toFixed(1)} ${y2.toFixed(1)} L${(x2 - ux * a + uy * w).toFixed(1)} ${(y2 - uy * a - ux * w).toFixed(1)} L${(x2 - ux * a - uy * w).toFixed(1)} ${(y2 - uy * a + ux * w).toFixed(1)} Z" fill="${t.color}"/>`;
    }
    // 中点标签；两人挨得近时（标签比两个符号之间的空档还宽）把标签挑到线的一侧，免得压住符号
    const text = kinLabel(k);
    const lw = Math.max(34, text.length * 11.4 + 14), lh = 19;
    let mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    if (lw > len - 2 * (SYM + 4)) { mx += uy * (lh / 2 + 5); my -= ux * (lh / 2 + 5); }
    kins += `<g class="kin-chip" data-kin="${k.id}" style="cursor:pointer">` +
      `<rect x="${(mx - lw / 2).toFixed(1)}" y="${(my - lh / 2).toFixed(1)}" width="${lw.toFixed(1)}" height="${lh}" rx="9.5" ` +
      `fill="rgba(255,255,255,0.94)" stroke="${t.color}" stroke-width="1.2"/>` +
      `<text x="${mx.toFixed(1)}" y="${(my + 0.5).toFixed(1)}" font-size="11.5" fill="${t.color}" text-anchor="middle" ` +
      `dominant-baseline="central" font-family='${FONT}'>${esc(text)}</text></g>`;
  });
  out += `<g>${kins}</g>`;

  /* ---- 成员 ---- */
  let nodes = '';
  state.people.forEach(p => {
    const q = pos[p.id];
    if (!q) return;
    const isSel = isSelected(p.id);
    let label = currentTerm(p);
    if (p.id === state.focalId && !p.term) label = '我';
    const nm = displayName(p);
    const dates = [p.born, p.died].filter(Boolean).join('–');
    let txt = '';
    // 非导出时给文字挂上 data-inline，画布上双击即可直接改
    const hit = forExport ? '' : ' pointer-events="visiblePainted" style="pointer-events:auto;cursor:text"';
    if (label) txt += `<text x="0" y="${-SYM - 12}" font-size="12.5" fill="#2f6fd0" text-anchor="middle" font-family='${FONT}' font-weight="600"${forExport ? '' : ' data-inline="term"'}${hit}>${esc(label)}</text>`;
    txt += `<text x="0" y="${SYM + 20}" font-size="14" font-weight="600" fill="${p.name ? '#1e2633' : '#9aa4b2'}" text-anchor="middle" font-family='${FONT}'${forExport ? '' : ' data-inline="name"'}${hit}>${esc(nm)}</text>`;
    if (dates) txt += `<text x="0" y="${SYM + 36}" font-size="11" fill="#7b8798" text-anchor="middle" font-family='${FONT}'>${esc(dates)}</text>`;
    if (ui.showNote && p.note) {
      const short = p.note.length > 18 ? p.note.slice(0, 18) + '…' : p.note;
      txt += `<text x="0" y="${SYM + 51}" font-size="10.5" fill="#9aa4b2" text-anchor="middle" font-family='${FONT}'>${esc(short)}</text>`;
    }
    // 入赘徽标：符号左下角一个小圆章「赘」
    if (isRuzhui(p.id)) {
      const bx = -SYM - 3, by = SYM + 3;
      txt += `<g><circle cx="${bx}" cy="${by}" r="8.5" fill="#fff" stroke="#e0a30b" stroke-width="1"/>` +
        `<text x="${bx}" y="${by}" font-size="10.5" font-weight="700" fill="#b45309" text-anchor="middle" dominant-baseline="central" font-family='${FONT}'>赘</text></g>`;
    }
    // 选中环：non-scaling-stroke 让线宽不随缩放变细，缩到很小也看得见谁被选中
    const selRing = (!forExport && isSel)
      ? `<rect class="sel-ring" style="display:block" x="${-SYM - 11}" y="${-SYM - 11}" width="${(SYM + 11) * 2}" height="${(SYM + 11) * 2}" rx="13" fill="none" stroke="#2f6fd0" stroke-width="2.5" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>`
      : '';
    const bub = forExport ? '' : bubbles(p.id);
    nodes += `<g class="fam-node${isSel ? ' sel' : ''}" data-id="${p.id}" transform="translate(${q.x.toFixed(1)},${q.y.toFixed(1)})">` +
      `<rect class="hit" x="${-SYM - 14}" y="${-SYM - 16}" width="${(SYM + 14) * 2}" height="${(SYM + 16) * 2 + 46}" rx="10" fill="transparent"/>` +
      selRing + symbolMarkup(p, 0, 0) + txt + bub + `</g>`;
  });
  out += `<g>${nodes}</g>`;

  /* ---- 图例 ---- */
  if (opts.legend) out += legendMarkup(b);

  return { markup: out, bounds: b };
}
function hasCrossing(c, pos) {
  const pa = pos[c.a], pb = pos[c.b];
  if (!pa || !pb || Math.abs(pa.y - pb.y) > 1) return false;
  return state.people.some(p => pos[p.id] && Math.abs(pos[p.id].y - pa.y) < 1 &&
    pos[p.id].x > Math.min(pa.x, pb.x) + SYM && pos[p.id].x < Math.max(pa.x, pb.x) - SYM);
}
function safeKin(focalId, targetId) {
  try { return Kin.term(KinGraph, focalId, targetId); } catch (e) { return null; }
}
/**
 * 某人此刻显示的称呼：手工填写的优先，其次自动推算，最后（中心人物）显示「我」。
 * 画布上双击改称呼时，就以它作为输入框的初值。
 */
function currentTerm(p) {
  if (!p) return '';
  if (p.term) return p.term;
  if (p.id === state.focalId) return '我';
  if (!ui.showTerm || !state.focalId) return '';
  const kin = safeKin(state.focalId, p.id);

}
function bubbles(id) {
  const r = 10.5, d = SYM + 16;
  const items = [
    [-d, 0, 'addPartner', '配偶'],
    [d, 0, 'addSibling', '兄弟姐妹'],
    [0, -d, 'addParents', '父母'],
    [0, d, 'addChild', '子女']
  ];
  return items.map(it =>
    `<g class="bubble" data-bubble="${it[2]}" data-id="${id}" transform="translate(${it[0]},${it[1]})">` +
    `<circle r="${r}"/><text y="0.5">+</text><title>添加${it[3]}</title></g>`).join('');
}

function legendMarkup(b) {
  const used = { M: false, F: false, U: false, dec: false, trans: false, gay: false };
  const conds = [];
  state.people.forEach(p => {
    if (p.gender === GENDER_M) used.M = true;
    if (p.gender === GENDER_F) used.F = true;
    if (p.gender === GENDER_U) used.U = true;
    if (p.deceased) used.dec = true;
    if (p.trans) used.trans = true;
    if (p.orientation === 'gay') used.gay = true;
    (p.conditions || []).forEach(c => { if (c.label && !conds.some(x => x.label === c.label)) conds.push(c); });
  });
  const W = 232, PAD = 14, LINE = 23;
  let rows = 0;
  let y = 0;
  const item = (shapeSvg, text) => {
    const s = `<g transform="translate(${PAD},${y})">${shapeSvg}<text x="40" y="5" font-size="11.5" fill="#5b6b82" font-family='${FONT}'>${esc(text)}</text></g>`;
    y += LINE; rows++;
    return s;
  };
  let items = '';
  if (used.M) items += item(LG.square(), '男性');
  if (used.F) items += item(LG.circle(), '女性');

  });
  const usedK = new Set((state.kins || []).map(k => k.type));
  usedK.forEach(t => {
    const kt = KIN_TYPE[t]; if (!kt) return;
    const dash = kt.draw === 'dash' ? 'stroke-dasharray="9 5"'
      : kt.draw === 'dashdot' ? 'stroke-dasharray="10 4 2 4"'
        : kt.draw === 'dot' ? 'stroke-dasharray="2 5"' : '';
    const seg = `stroke="${kt.color}" stroke-width="1.7" fill="none" ${dash}`;
    const g = kt.draw === 'double'
      ? `<path d="M2 3 L30 3" ${seg}/><path d="M2 9 L30 9" ${seg}/>`

  const totalRows = rows;
  const H = 46 + totalRows * LINE + 8;
  const x = b.x1 + 20 - W;
  const y0 = Math.max(b.y0, b.y1 - H);
  ui.legendBox = { x: x, y: y0, w: W, h: H };
  return `<g transform="translate(${x.toFixed(1)},${y0.toFixed(1)})">` +
    `<rect x="0" y="0" width="${W}" height="${H}" rx="10" fill="rgba(255,255,255,0.95)" stroke="#dbe1ea"/>` +
    `<text x="${PAD}" y="21" font-size="13" font-weight="700" fill="#1e2633" font-family='${FONT}'>图例</text>` +
    `<line x1="${PAD}" y1="29" x2="${W - PAD}" y2="29" stroke="#e6ebf3"/>` +
    `<g transform="translate(0,34)">${items}${cSt.join('')}</g></g>`;
}

/** 整幅图（含图例）的包围盒 */
function fullBounds() {
  const b = ui.bounds || { x0: 0, y0: 0, x1: 600, y1: 400 };
  const l = ui.legendBox;
  if (!l || !ui.showLegend) return b;
  return {
    x0: Math.min(b.x0, l.x), y0: Math.min(b.y0, l.y),
    x1: Math.max(b.x1, l.x + l.w), y1: Math.max(b.y1, l.y + l.h)
  };
}

/** 把整幅图渲染进 #svg（带平移缩放） */
function render() {
  const svg = $('#svg');
  ui.layout = ui.layout || computeLayout();
  const r = contentMarkup({ legend: ui.showLegend });
  svg.setAttribute('viewBox', `0 0 ${svg.clientWidth || 800} ${svg.clientHeight || 600}`);
  svg.innerHTML = `<g transform="translate(${view.x.toFixed(2)},${view.y.toFixed(2)}) scale(${view.zoom})">${r.markup}</g>`;
  svg.classList.toggle('tool-add', ui.tool === 'add');
  svg.classList.toggle('tool-bond', ui.tool === 'bond');
  svg.classList.toggle('tool-kin', ui.tool === 'kin');
  svg.classList.toggle('tool-hand', ui.tool === 'hand');
  $('#zPct').textContent = Math.round(view.zoom * 100) + '%';
  if (typeof closeInline === 'function') closeInline();   // 重绘后原来的就地编辑框位置就不准了
  if (typeof applyLock === 'function') applyLock();        // 锁定状态可能刚被撤销/载入改变
  renderInspector();
}
/** 屏幕坐标 → 世界坐标 */
function toWorld(clientX, clientY) {
  const r = $('#svg').getBoundingClientRect();
  return { x: (clientX - r.left - view.x) / view.zoom, y: (clientY - r.top - view.y) / view.zoom };
}

function fitView(padding) {
  const svg = $('#svg');
  const b = fullBounds(); if (!b) return;
  const pad = padding == null ? 60 : padding;
  const vw = svg.clientWidth || 900, vh = svg.clientHeight || 620;
  const w = b.x1 - b.x0, h = b.y1 - b.y0;
  const z = Math.min(vw / (w + pad * 2), vh / (h + pad * 2));
  view.zoom = Math.max(0.15, Math.min(2.2, z));
  view.x = (vw - w * view.zoom) / 2 - b.x0 * view.zoom;
  view.y = (vh - h * view.zoom) / 2 - b.y0 * view.zoom;
  render();
}
function zoomAt(cx, cy, factor) {
  const z2 = Math.max(0.1, Math.min(4, view.zoom * factor));
  const k = z2 / view.zoom;
  view.x = cx - (cx - view.x) * k;
  view.y = cy - (cy - view.y) * k;
  view.zoom = z2;
  render();
}


/* ===== app-ui.js ===== */
/* ==========================================================================
   家谱编辑器 · 界面交互 / 属性面板 / 存档导出
   ========================================================================== */

let saveTimer = null;

/* ==========================================================================
   历史记录
   ========================================================================== */
function snapshot() { return JSON.stringify(state); }
function pushHistory() {
  const s = snapshot();
  if (history.stack[history.index] === s) { updateUndoBtns(); return; }
  history.stack = history.stack.slice(0, history.index + 1);
  history.stack.push(s);
  if (history.stack.length > 80) history.stack.shift();
  history.index = history.stack.length - 1;
  updateUndoBtns();
}
function undo() {
  if (guard()) return;
  if (history.index <= 0) return;
  history.index--;
  state = JSON.parse(history.stack[history.index]);
  pruneSelection();
  ui.structVer = (ui.structVer || 0) + 1;
  relayoutRender(); saveDraft(); updateUndoBtns();
}
function redo() {
  if (guard()) return;
  if (history.index >= history.stack.length - 1) return;
  history.index++;
  state = JSON.parse(history.stack[history.index]);
  pruneSelection();
  ui.structVer = (ui.structVer || 0) + 1;
  relayoutRender(); saveDraft(); updateUndoBtns();
}
function updateUndoBtns() {
  $('#btnUndo').disabled = history.index <= 0;
  $('#btnRedo').disabled = history.index >= history.stack.length - 1;
}

/* ==========================================================================
   渲染与提交
   ========================================================================== */
function relayoutRender() {
  ui.layout = computeLayout();
  render();
}
/** 结构性改动（增删成员、改动关系）后调用 */
function commit(opts) {
  ui.structVer = (ui.structVer || 0) + 1;
  if (ui.bounds && !(opts && opts.keepView)) relayoutRender(); else relayoutRender();
  pushHistory();
  saveDraft();
}
/** 仅数据字段变化（改名、改年份），重绘但不重排 */
function touch() {
  render(); saveDraft();
}

/** 草稿按文件分格存放：导出的可编辑副本各存各的，不会互相覆盖，也不会盖掉编辑器本身的草稿 */
function draftKey() { return 'jiapu:draft:' + DOC_ID; }
function saveDraft() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    // 面板里打字改字段（姓名、年份、排行…）也要能撤销：
    // 停顿 500ms 记一步，连打不会碎成一堆撤销点；内容没变时 pushHistory 内部会跳过
    pushHistory();
    try { localStorage.setItem(draftKey(), snapshot()); } catch (e) { }
  }, 500);
}
function loadDraft() {
  try {
    let s = localStorage.getItem(draftKey());
    // 兼容老版本：以前所有草稿都挤在 'jiapu:draft' 这一个格子里，搬一次过去
    if (!s && DOC_ID === 'main') {
      s = localStorage.getItem('jiapu:draft');
      if (s) localStorage.setItem(draftKey(), s);
    }
    if (!s) return null;
    const d = JSON.parse(s);
    // 老版本存下来的草稿没有 kins 这一张表，补一个空数组，免得后面到处判空
    if (d && Array.isArray(d.people)) { if (!Array.isArray(d.kins)) d.kins = []; return d; }
  } catch (e) { }
  return null;
}

/* ==========================================================================
   仅查看（锁定）
   ========================================================================== */
/** 把锁定状态同步到界面：顶栏按钮、画布横幅、被禁用的入口 */
function applyLock() {
  const on = locked();
  document.body.classList.toggle('locked', on);
  const lab = $('#btnLockLabel');
  if (lab) lab.textContent = on ? '已锁定' : '仅查看';
  const b = $('#btnLock');
  if (b) b.title = on ? '当前已锁定为「仅查看」，点这里解除'
    : '锁定为「仅查看」，防止自己或别人误改（会随文件一起保存）';
  if (on && ui.tool !== 'select') { ui.tool = 'select'; ui.bondFrom = null; ui.kinFrom = null; syncToolButtons(); }
  const tidy = $('#btnTidy'); if (tidy) tidy.disabled = on;
  const t = $('#docTitle'); if (t) t.readOnly = on;
  syncViewChecks();
}
/** 把 state 里的显示开关同步回左侧「视图」复选框（撤销、打开文件后也要对得上） */
function syncViewChecks() {
  const g = $('#chkShowGhost');
  if (g) g.checked = faintNatalOn();
}
function setLock(on) {
  if (!state) return;
  state.locked = !!on;
  applyLock();
  render();
  renderInspector(true);
  if (on) toast('已锁定为「仅查看」：家谱只能平移、缩放与导出；保存后文件打开也是只读', 3200);
  else toast('已解除锁定，可以继续编辑');

}
function toggleLock() {

  confirmModal('解除锁定', '确定要解除「仅查看」状态，恢复编辑吗？解除后所有改动都能正常保存。', () => setLock(false));

/* ==========================================================================
   选择与属性面板
   ========================================================================== */
function select(id) {
  setSelection(id ? [id] : [], id);
  render();
  renderInspector(true);
}
function inspectorKey() {
  return (ui.selSet || []).join(',') + '|' + (ui.sel || '-') + '|' + (ui.structVer || 0) + '|' + (state.focalId || '-');
}
/** 只描述「面板该显示谁」：选中集合 + 中心人物，不含数据版本 */
function inspectorSelKey() {
  return (ui.selSet || []).join(',') + '|' + (ui.sel || '-') + '|' + (state.focalId || '-');
}
function renderInspector(force) {
  // 用户正在面板的某个输入框里打字时，不要重建面板：重建会把输入框整个换掉，
  // 光标位置随之丢失（回到最前），后面敲的数字就全被插到前面去了。
  // 但「选中的人变了」是另一回事——那种时候必须重建，否则点到别人身上面板还停在原来那位。
  const act = document.activeElement;
  const typing = !!(act && act.dataset && act.dataset.f && $('#inspContent').contains(act));
  const skey = inspectorSelKey();
  const selChanged = ui._inspSelKey !== skey;

  const key = inspectorKey();
  if (!force && ui._inspKey === key) return;
  if (!force && typing && !selChanged) return;   // 只是数据版本变了（比如正在填出生年），保住光标
  ui._inspKey = key;
  ui._inspSelKey = skey;

  // 换成另一个人了就不再把光标塞回原来那个字段——用户是在选人，不是接着填表
  const holdFocus = typing && !selChanged;
  const f = holdFocus ? act.dataset.f : null;
  const selStart = holdFocus ? caretOf(act) : null;
  const val = holdFocus ? act.value : null;

  const multi = (ui.selSet || []).length > 1;
  const p = ui.sel ? person(ui.sel) : null;
  $('#inspContent').innerHTML = multi ? multiInspector() : (p ? personInspector(p) : docInspector());

  // 仅查看状态下，面板里的一切可改控件一律禁用（名单跳转之类的只读操作保留）
  if (locked()) {
    $$('#inspContent input, #inspContent select, #inspContent textarea, #inspContent button').forEach(el => {
      el.disabled = true;
    });
    $('#inspContent').insertAdjacentHTML('afterbegin',
      `<div class="lock-note">仅查看模式 · 面板暂时不可编辑</div>`);
  }

  if (f && val != null) {
    const el = $(`#inspContent [data-f="${f}"]`);
    if (el) {
      el.focus();
      if (selStart != null) { try { el.setSelectionRange(selStart, selStart); } catch (e) { } }
    }
  }
}
/** 取输入框的光标位置；个别类型（number）不支持该 API，取不到就返回 null 而不是 0 */
function caretOf(el) {
  try { return typeof el.selectionStart === 'number' ? el.selectionStart : null; }
  catch (e) { return null; }
}

  /* 操作 */
  h += `<div class="section">

  return h;
}

function newSpouseGender(p) {

}

/** 方框内（按符号中心点判定）的成员 id */
function peopleInMarquee(clientX1, clientY1, clientX2, clientY2) {
  const r = { x0: Math.min(clientX1, clientX2), y0: Math.min(clientY1, clientY2), x1: Math.max(clientX1, clientX2), y1: Math.max(clientY1, clientY2) };
  const sr = $('#svg').getBoundingClientRect();
  const pos = (ui.layout && ui.layout.pos) || {};
  return state.people.filter(p => {

    const cx = sr.left + view.x + q.x * view.zoom;

    return cx >= r.x0 && cx <= r.x1 && cy >= r.y0 && cy <= r.y1;
